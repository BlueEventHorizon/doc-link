  docs/rules/implementation_guidelines.md:
    title: Implementation Guidelines
    purpose: "Defines rules for implementing doc-link plugin scripts and SKILL.md: language and dependency choice, testing, file placement, temporary files, fallback handling, and version-file limits."
    content_details:
      - "Language choice: Python for data transform and parsing, Bash for external commands, file operations and pipes"
      - Python standard library first; only PyYAML and markdown-it-py are approved external dependencies
      - Python scripts run via uv run with PEP 723 inline metadata; Node.js is prohibited
      - Tests under tests/{plugin}/{skill}/test_{module}.py using unittest; AI-judgment tests kept separate as manual
      - SKILL.md must not hold inline script logic; it calls standalone scripts via CLAUDE_SKILL_DIR
      - Single-skill assets go under skills/{skill}/, shared assets under plugin-root scripts/ and docs/; no direct reference into another skill directory
      - Temporary files written with the Write tool to .temp/doc-link/<skill>/ with session ID in name; no shell heredocs and no fixed names
      - Distributed files (SKILL.md, agents, commands, bundled docs) must not reference development-only spec or design IDs or paths
      - Other components are reached only through public SKILL argument and output contracts, never by calling their scripts directly
      - Unused code is deleted without commented-out remnants; fallbacks only with explained recovery; version files not edited in routine work
    applicable_tasks:
      - Implementing doc-link plugin scripts
      - Implementing or modifying SKILL.md files
      - Creating tests for Python scripts under plugins
      - Deciding script placement and file layout
      - Reviewing script language selection and dependency additions
      - Reviewing fallback and error-handling design in scripts or SKILL procedures
      - Reviewing temporary file handling in SKILL procedures
    keywords:
