  docs/rules/plugin_implementation_guidelines.md:
    title: Plugin Implementation Guidelines
    purpose: Defines plugin-agnostic rules for implementing plugin scripts (Python and Bash) and SKILL.md, covering script language and dependencies, test placement, script and document placement, temporary files, distribution references, version file handling, and removal of unused code.
    content_details:
      - "Language split: Python for data transformation and parsing, Bash for external commands and file operations, standard library only by default"
      - "Test rules: distributed .py files require tests named test_{module}.py, SKILL.md is exempt, AI-judgment tests run manually outside CI"
      - "No inline scripts in SKILL.md: SKILL.md calls independent scripts via CLAUDE_SKILL_DIR or CLAUDE_PLUGIN_ROOT"
      - "Placement: skills/{skill}/scripts and docs for single-skill assets, plugin-root scripts and docs for assets shared by two or more skills"
      - Do not reference other skills internal directories; move shared assets to plugin root instead of copying
      - "Temporary files: write with the Write tool to .temp/plugin/skill/ with session ID in name, no shell heredoc, no trap EXIT cleanup, no mktemp default directory"
      - Distributed files (SKILL.md, agents, commands, distributed docs, templates) must not reference development-only specs, designs, or rules by path or ID
      - Other components are reached only through the public SKILL argument and output contract, never by calling their scripts directly
      - Unused code is deleted without deprecated markers or comments, with the reason in the commit message
      - Fallbacks must have an explained recovery; otherwise report the error explicitly with information for the caller
    applicable_tasks:
