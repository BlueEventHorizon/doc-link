      - SKILL caller
  docs/rules/claude_code_authoring_guide.md:
    title: Authoring Guide for SKILL and Custom Agent in doc-link
    purpose: Defines the rules for authoring SKILLs and custom Agents in doc-link, including launch path selection, the inheritance-type SKILL execution model, multi-layer defense, Agent completion waiting, and confirmation of user decisions through AskUserQuestion.
    content_details:
      - "Launch path selection order: Bash subprocess, then general Agent, then custom Agent, then inheritance-type SKILL"
      - Inheritance-type SKILL never uses context fork or agent fields and states that it performs only X
      - Custom Agent is chosen when the same role serves several callers, a write boundary must be constrained, or the parent context grows large
      - Custom Agent frontmatter holds name, description, tools and model, with negative prohibitions on launching other Agents and taking over parent tasks
      - "Four-layer defense table: Agent boundary, Role constraint, allowlist via tools or allowed-tools, and physical deny in settings.json permissions"
      - Fixed short names for launch paths, and subagent is never used alone
      - subagent_type accepts only built-in or defined custom Agent names, and prompts carry no slash notation
      - Wait for the final Agent response or completion notification, and do not wait with ScheduleWakeup
      - Questions and confirmations use AskUserQuestion, and disallowed-tools is not used to block it
      - disable-model-invocation is set for irreversible operations such as deploy, push, tag, or version update
    applicable_tasks:
      - Creating a new SKILL or custom Agent in doc-link
      - Choosing the launch path among Bash subprocess, general Agent, custom Agent, and inheritance-type SKILL
      - Reviewing SKILL.md or agent definitions for Role constraint and allowlist layering
      - Modifying frontmatter or invocation settings of an existing SKILL or custom Agent
      - Reviewing user confirmation and Agent completion waiting in SKILL definitions
    keywords:
      - inheritance-type SKILL
      - custom Agent
      - launch path
      - context fork
      - allowed-tools
      - AskUserQuestion
      - disable-model-invocation
