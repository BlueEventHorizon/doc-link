  docs/rules/implementation_guidelines.md:
    title: Implementation Guidelines
    purpose: Defines rules for implementing the doc-link plugin scripts (Python and Bash) and SKILL.md, covering language choice, allowed dependencies, test placement, script and file placement, temporary files, error fallback, and version file handling
    content_details:
      - "Language choice table: Python for data transformation and parsing, Bash for external commands and file operations, Node.js is not used"
      - Python dependencies limited to PyYAML and markdown-it-py, other libraries require user approval
      - Python scripts run via uv run with PEP 723 inline metadata declaring dependencies
      - Test placement under tests/{plugin}/{skill}/test_{module}.py and tests/{plugin}/scripts/ for shared scripts, with AI-judgment tests kept separate as manual
      - SKILL.md must not contain inline script logic and must call independent scripts via CLAUDE_SKILL_DIR or CLAUDE_PLUGIN_ROOT
      - "Script placement rule: skills/{skill}/scripts/ for single-skill assets, plugin-root scripts/ for shared assets, no direct reference into another skill directory"
      - Temporary files written with the Write tool to .temp/doc-link/<skill>/ with session ID in the name, never via shell heredoc or echo
      - Distributed files (SKILL.md, agents, commands, bundled docs) must not reference development-only docs by path or spec ID
      - Unused code is deleted rather than commented out or marked deprecated
      - Fallbacks only when the recovery is explainable, otherwise report the error explicitly
      - Version files such as plugin.json version and CHANGELOG are not edited in normal work
    applicable_tasks:
      - Implementation of doc-link plugin Python scripts
      - Implementation of doc-link SKILL.md and Bash scripts
      - Creation of unit tests for doc-link Python scripts
      - Decision on script placement and dependency addition for doc-link
      - Review of doc-link implementation against implementation rules
      - Design of temporary file handling in doc-link SKILL procedures
    keywords:
