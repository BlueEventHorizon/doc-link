  docs/rules/script_error_output_rules.md:
    title: Script Error Output Rules
    purpose: Defines how plugin Python scripts return exit codes and error output, fixing the shared meaning of codes 0 to 2, requiring codes 3 and above to be declared in each script docstring, and specifying the JSON error format on stdout.
    content_details:
      - "Exit codes: 0 completed, 1 unspecified error, 2 reserved for argparse argument rejection, 3 and above defined only by the script that returns them"
      - Result content never changes the exit code; zero findings or zero targets still return 0
      - Scripts returning codes 3 and above must declare the full code table including 0 in the module docstring
      - Scripts returning only 0 to 2 need no declaration; wrappers pass through or collapse the codes they forward
      - Callers branch on a value only when the producing docstring declares it; otherwise treat as an unspecified error
      - Non-zero stdout is JSON with an errors array of natural-language strings, always an array even for one item
      - Argparse exit 2 leaves stdout empty, so usage goes to stderr
      - Diagnostics may go to stderr but error content must also appear in stdout JSON
      - Hook scripts governed by the harness contract are exempt
      - Rule applies to newly placed scripts; existing scripts are updated at revision time
    applicable_tasks:
      - Implementing exit code handling in new plugin Python scripts
      - Reviewing script exit codes and docstring declarations
      - Designing JSON error output on stdout for scripts
      - Writing caller logic that branches on script exit codes in SKILL.md
      - Adding a wrapper script that forwards another script exit codes
      - Reviewing error reporting of script failures
    keywords:
      - exit code
      - argparse
      - errors array
      - docstring declaration
      - stdout JSON
      - stderr
      - unspecified error
      - wrapper script
      - hook exemption
      - SKILL.md caller
  docs/rules/uv_usage_rules.md:
    title: uv Usage Rules
    purpose: Defines rules for running Python scripts with uv and managing their dependencies, Python versions, and lock files, including a 3-day cooldown that excludes newly published package versions to guard against hijacked releases
    content_details:
      - Python scripts run only via uv run, never with the system python3 directly
      - Dependencies and Python version declared per script with PEP 723 inline metadata
      - Dependencies added with uv add --script --bounds lower and removed with uv remove --script, versions never hand-written
      - Lock file created with uv lock --script and committed together with the script
      - Execution uses uv run --locked with the 3-day exclude-newer cutoff, and --locked is never dropped
      - Outdated dependency check with uv tree --script --outdated and upgrade with uv lock --upgrade or --upgrade-package
      - 3-day cooldown excludes package versions published less than 3 days ago, with the reason and Renovate preset basis
      - Urgent security fixes may use exclude-newer-package per package after verifying the change and publisher
      - requires-python lower bound follows the latest stable Python, checked with uv python list
      - "Known limit: the cooldown only defends against attacks discovered soon after publication"
    applicable_tasks:
      - Adding, removing, or upgrading dependencies of a Python script
      - Creating or updating a script lock file
      - Executing Python scripts in a plugin
      - Deciding the Python version requirement of a script
      - Reviewing supply chain safety of script dependencies
    keywords:
      - uv run
      - uv add --script
      - uv lock --script
      - "--locked"
      - "--exclude-newer"
      - "--exclude-newer-package"
      - PEP 723
      - requires-python
