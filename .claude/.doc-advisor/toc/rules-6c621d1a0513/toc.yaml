      - Choosing a launch path type for a new feature
      - Judging whether a fork-type SKILL is usable given known issues
      - Writing subagent_type values or plugin Agent names in SKILL definitions
      - Reviewing tool restriction and Agent background or foreground assumptions in SKILL or agent definitions
      - Updating Claude Code facts and their source records when behavior changes
