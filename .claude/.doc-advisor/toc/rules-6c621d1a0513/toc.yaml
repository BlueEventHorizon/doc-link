  docs/rules/agent_data_exchange_rules.md:
    title: Rules for Passing Per-Run Data between SKILL and Custom Agent
    purpose: Defines the rules for passing data that exists only during one run (requests and results) between a SKILL caller and a custom Agent. Passes only identifier values, has scripts write the data, uses an end value to signal success, and deletes the data after use.
    content_details:
      - Passing only an identifier value generated by a script, never the data body, from caller to Agent
      - Scripts write all data, AI never assembles JSON, and values are stored without alteration
      - Reader obtains an absolute path from a script and reads the file directly, and the script fails without a path when data is not ready
      - Values must reach the reader unchanged, including newlines, quotes, backticks and non-ASCII characters
      - Field meaning is defined in the SKILL.md or agent definition of the reading and writing actors, not carried with the value
      - Data is written once after all decisions are made, with no overwrite or correction operation
      - End value 0 marks success, unknown end values are treated as errors, and the script decides success
      - No runtime format validation, except for checks that scripts cannot guarantee automatically
      - Absolute paths are allowed for transient data, and the project root is not carried in the data
      - All temporary data held for a run is deleted when the run ends
    applicable_tasks:
      - Designing data exchange between a SKILL and a custom Agent
      - Implementing script-based request and result passing for an Agent call
      - Reviewing SKILL or agent definitions that pass data through prompts or return values
      - Deciding identifier composition and the end-value error set for a new Agent-based feature
    keywords:
      - agent data exchange
      - identifier value
      - end value
      - absolute path
      - transient data
      - prompt passing
      - return value
