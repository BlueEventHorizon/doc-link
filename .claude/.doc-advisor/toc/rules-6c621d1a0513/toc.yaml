  docs/rules/plugin_script_error_output_rules.md:
    title: Script Error Output Rules
    purpose: Specifies exit codes and error output for Claude Code plugin Python scripts, defining the shared meanings of 0, 1 and 2, requiring scripts that return 3 or higher to declare them in their docstring, and fixing stdout JSON with an errors array.
    content_details:
      - "Shared exit codes: 0 completed, 1 generic failure with no reason distinction, 2 reserved for argparse argument rejection"
      - Scripts returning 3 or higher must declare the full exit code table in their module docstring, including 0
      - Scripts without a declaration may return only 0, 1 or 2
      - Wrappers that pass through other scripts exit codes must declare the passed value range or collapse to 0, 1, 2
      - Zero findings or zero targets still return 0; result content goes in stdout JSON
      - Callers may branch on a value only when the producing docstring declares it; otherwise treat as generic error and report
      - "Stdout is JSON: result JSON on 0, error JSON with an errors array of natural-language strings on non-zero except exit code 2"
      - Diagnostics may go to stderr but error content must also appear in stdout JSON
      - "Scope: applies to newly placed scripts only; harness-defined hook scripts follow the harness contract"
      - Numeric values for 3 and above are chosen freely and must not encode categories by numeric ranges
    applicable_tasks:
      - Implementing a new Python script that returns exit codes or error output
      - Declaring exit codes in a script module docstring
      - Reviewing script exit code handling and error JSON output
      - Writing caller logic in SKILL.md that branches on script exit codes
      - Modifying a wrapper script that passes through another scripts exit codes
      - Deciding whether a script should use exit code 2 via argparse
      - Reviewing stdout and stderr contracts for plugin scripts
    keywords:
      - exit code
      - errors array
      - stdout JSON
      - argparse
      - sys.exit
      - module docstring
