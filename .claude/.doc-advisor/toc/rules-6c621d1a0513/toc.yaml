  docs/rules/plugin_claude_code_authoring_guide.md:
    title: Claude Code Authoring Guide (SKILL and Custom Agent)
    purpose: "Defines project-independent conventions for combining SKILLs and custom Agents: launch path selection, argument limits, custom Agent frontmatter, defense layers, self-invocation and wait rules."
    content_details:
      - "Naming: use launch path short names (inherited SKILL, fork SKILL, general-purpose Agent, custom Agent, Bash subprocess), not bare numbers or the word subagent alone"
      - subagent_type accepts only built-in or defined custom Agent names; slash notation is not written in prompts
      - "Launch path decision order: Bash subprocess, general-purpose Agent, custom Agent, then inherited SKILL"
      - Custom Agents are chosen for one role used by several callers, a constant write boundary, or a growing parent context
      - Inherited SKILL arguments stay minimal; parent context, issue bodies, diffs and full files are not passed
      - Custom Agent frontmatter holds name, description, tools and model; prohibitions are written in negative form
      - Writing Agents get scope limits, no unrelated refactor, syntax check after edits, and a recommended allowlist
      - "Defense layers A to D: Agent boundary, role constraint, tools allowlist, physical deny in settings"
      - SKILLs must not invoke themselves through the Skill tool; always-invoked SKILLs state this prohibition at the top
      - Agent completion is awaited by ending the turn, not by ScheduleWakeup
    applicable_tasks:
      - Creation of a SKILL and custom Agent pair in a plugin
      - Choosing a launch path among Bash subprocess, general-purpose Agent, custom Agent and inherited SKILL
      - Review of SKILL.md and agents definition files against authoring conventions
      - Writing custom Agent prohibitions and tools allowlist
      - Designing argument passing for inherited SKILLs
      - Modification of defense layer configuration for Agents
    keywords:
