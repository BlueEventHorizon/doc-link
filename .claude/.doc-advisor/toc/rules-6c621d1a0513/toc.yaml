  docs/rules/agent_data_exchange_rules.md:
    title: Rules for Passing Per-Run Data between SKILL and Custom Agent
    purpose: Defines the rules for passing data that exists only during one run (requests and results) between a SKILL caller and a custom Agent. Passes only identifier values, has scripts write the data, uses an end value to signal success, and deletes the data after use.
    content_details:
      - Passing only an identifier value generated by a script, never the data body, from caller to Agent
      - Scripts write all data, AI never assembles JSON, and values are stored without alteration
      - Reader obtains an absolute path from a script and reads the file directly, and the script fails without a path when data is not ready
      - Values must reach the reader unchanged, including newlines, quotes, backticks and non-ASCII characters
      - Field meaning is defined in the SKILL.md or agent definition of the reading and writing actors, not carried with the value
      - Data is written once after all decisions are made, with no overwrite or correction operation
      - End value 0 marks success, unknown end values are treated as errors, and the script decides success
      - No runtime format validation, except for checks that scripts cannot guarantee automatically
      - Absolute paths are allowed for transient data, and the project root is not carried in the data
      - All temporary data held for a run is deleted when the run ends
    applicable_tasks:
      - Designing data exchange between a SKILL and a custom Agent
      - Implementing script-based request and result passing for an Agent call
      - Reviewing SKILL or agent definitions that pass data through prompts or return values
      - Deciding identifier composition and the end-value error set for a new Agent-based feature
    keywords:
      - agent data exchange
      - identifier value
      - end value
      - absolute path
      - transient data
      - prompt passing
      - return value
      - custom Agent
      - SKILL caller
  docs/rules/claude_code_authoring_guide.md:
    title: Authoring Guide for SKILL and Custom Agent in doc-link
    purpose: Defines the rules for authoring SKILLs and custom Agents in doc-link, including launch path selection, the inheritance-type SKILL execution model, multi-layer defense, Agent completion waiting, and confirmation of user decisions through AskUserQuestion.
    content_details:
      - "Launch path selection order: Bash subprocess, then general Agent, then custom Agent, then inheritance-type SKILL"
      - Inheritance-type SKILL never uses context fork or agent fields and states that it performs only X
      - Custom Agent is chosen when the same role serves several callers, a write boundary must be constrained, or the parent context grows large
      - Custom Agent frontmatter holds name, description, tools and model, with negative prohibitions on launching other Agents and taking over parent tasks
      - "Four-layer defense table: Agent boundary, Role constraint, allowlist via tools or allowed-tools, and physical deny in settings.json permissions"
      - Fixed short names for launch paths, and subagent is never used alone
      - subagent_type accepts only built-in or defined custom Agent names, and prompts carry no slash notation
      - Wait for the final Agent response or completion notification, and do not wait with ScheduleWakeup
      - Questions and confirmations use AskUserQuestion, and disallowed-tools is not used to block it
      - disable-model-invocation is set for irreversible operations such as deploy, push, tag, or version update
    applicable_tasks:
      - Creating a new SKILL or custom Agent in doc-link
      - Choosing the launch path among Bash subprocess, general Agent, custom Agent, and inheritance-type SKILL
      - Reviewing SKILL.md or agent definitions for Role constraint and allowlist layering
      - Modifying frontmatter or invocation settings of an existing SKILL or custom Agent
      - Reviewing user confirmation and Agent completion waiting in SKILL definitions
    keywords:
      - inheritance-type SKILL
      - custom Agent
      - launch path
      - context fork
      - allowed-tools
      - AskUserQuestion
      - disable-model-invocation
      - subagent_type
      - ScheduleWakeup
