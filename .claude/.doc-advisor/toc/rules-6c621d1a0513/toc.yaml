      - Only external dependencies allowed are PyYAML and markdown-it-py; adding others requires user approval
      - Node.js prohibited and tools or packages depending on it excluded; GitHub Actions out of scope
      - All SKILLs are inherited-type; context fork attribute and agent field are not written; isolated processing goes to a custom Agent
      - plugins/ .py files require tests at tests/{plugin}/{skill}/test_{module}.py
      - Shared plugin-level scripts tested under tests/{plugin}/scripts; no skill named scripts
      - Test command uses uv run --python 3.15 with --exclude-newer `3 days` and markdown-it-py, running unittest discover
