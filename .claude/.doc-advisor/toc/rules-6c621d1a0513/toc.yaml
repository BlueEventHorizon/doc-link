  docs/rules/plugin_uv_usage_rules.md:
    title: uv Usage Rules
    purpose: Defines rules for running Python scripts and managing their dependencies with uv, covering PEP 723 metadata versus pyproject.toml, locking, upgrades, the 3-day exclude-newer supply-chain guard, and Python version selection.
    content_details:
      - "Dependency declaration: standalone and distributed scripts use PEP 723 inline metadata, multi-script groups with shared modules and tests use pyproject.toml with package false"
      - Run Python scripts with uv run, never bare python3, and put exclude-newer settings in the script tool.uv metadata
      - Dependencies are added with uv add --script and --bounds lower, removed with uv remove --script, and version numbers are never typed by hand
      - Lock with uv lock --script after adding dependencies, commit the lock file with the script, and verify with uv run --locked
      - Check outdated dependencies with uv tree --outdated and upgrade with uv lock --upgrade or --upgrade-package
      - "Supply-chain guard: exclude-newer 3 days in tool.uv, with per-package exclude-newer-package for urgent security fixes"
      - requires-python lower bound follows the latest stable Python, chosen from uv python list excluding alpha beta and rc
      - Distributed scripts cannot use pyproject.toml because end users have no project root, so every importing entry script declares shared dependencies
      - Adding a dependency requires prior user permission under the implementation guidelines
    applicable_tasks:
      - Running Python scripts through uv run in a plugin or project
      - Adding, removing, or upgrading a Python script dependency
      - Creating a PEP 723 inline metadata block for a script
      - Choosing between PEP 723 metadata and pyproject.toml for a script group
      - Updating or regenerating uv.lock for scripts
      - Configuring exclude-newer supply-chain protection for dependencies
      - Selecting the requires-python lower bound for a script
    keywords:
      - uv run
      - PEP 723
      - uv add --script
      - uv lock --script
      - uv.lock
      - "--locked"
      - exclude-newer
