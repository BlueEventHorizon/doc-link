  docs/rules/claude_code_reference.md:
    title: Claude Code Reference for SKILL, Plugin and Agent
    purpose: Records the Claude Code behavior facts that doc-link SKILLs and Agents depend on, including the five launch path types, known context fork issues, subagent_type values, tool restriction scope, and Agent foreground or background rules, with their sources.
    content_details:
      - Five launch path types with short names (inheritance-type SKILL, fork-type SKILL, general Agent, custom Agent, Bash subprocess) and their parent context and output
      - "Known context fork issues from public GitHub issues #18394, #34164, #60720, #55592, #34328, #19751, #17283, #17351 and #68233 with Anthropic responses"
      - "Valid subagent_type values: built-in Agent names and defined custom Agent names, with plugin Agents under the plugin name namespace"
      - SKILL names, slash notation and file paths are invalid as subagent_type
      - allowed-tools pre-approves tools only for the invoking turn, while disallowed-tools restriction clears on the next user message
      - Agent foreground or background decision order, including fork mode and CLAUDE_CODE_DISABLE_BACKGROUND_TASKS
      - Interactive Agent tool has no run_in_background argument, always runs in background, and returns results by completion notification
      - Background subagents observed without AskUserQuestion, with the cause not confirmed
      - Agent definition background true takes effect only when fork mode is OFF, and no SKILL frontmatter setting for launch mode is confirmed
      - ScheduleWakeup is a scheduling tool for /loop dynamic mode, and the harness notifies background completion
    applicable_tasks:
