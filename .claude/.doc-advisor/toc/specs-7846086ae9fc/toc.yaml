  docs/specs/design/DES-008_content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines rules for reading and writing DLIDs in frontmatter and heading lines, Markdown reference and heading parsing with markdown-it-py, heading anchor generation, content hashes, and the length limits for AI-generated fields.
    content_details:
      - Frontmatter boundary detection and minimal top-level parsing, with doc_link_id recognized only as DLID- followed by 12 lowercase Crockford Base32 characters
      - DLID write positions limited to the doc_link_id field and heading line ends, with post-write markdown-it-py reparse verifying that only the intended DLID changed
      - "Formal reference definition: reference link whose title ends with a DLID, with recorded content hash, path, and position"
      - Section range from a heading to the next heading of same or higher level, identified by a trailing DLID in the heading text
      - Ten CommonMark link resolution rules, including label normalization, first definition wins, and scheme URLs excluded
      - GitHub-compatible heading anchor generation via github-slugger v2.0.0 rules, not written into documents
      - Content hash as SHA-256 of raw UTF-8 bytes, excluding the recorded content hash token in reference titles
      - Section content hash over the section range, independent of the issued section ID
      - Document title from the first H1 with trailing section ID removed
      - Length limit L for AI-generated fields with validator H equal to floor of L times 1.3, minimums of 5 content details, 1 applicable task, and 5 keywords
