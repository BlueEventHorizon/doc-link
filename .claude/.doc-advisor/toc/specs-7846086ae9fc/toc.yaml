  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines the responsibilities and write permissions of each actor (caller AI, doc-link Skill, deterministic scripts, content AI, search AI, user), the logical operations scripts provide, and the Skill-to-script connection rules. Also sets the persistence layout under .doc-link.
    content_details:
      - "Responsibility table: caller project AI, doc-link Skill, deterministic scripts, content generation AI, search AI and user, each with allowed actions and prohibitions"
      - "Logical script operations: scope expansion, ID check, DLID assignment, comparison value fetch, diff judgement, reference extraction and check, AI output validation, candidate check and confirmation, search and reverse lookup, DLID resolution, consistency check"
      - Skill runs inline in the caller context; only the content generation AI runs in a separate context
      - "Five connection rules: script checks versions and states and rejects forbidden transitions; generation AI receives only required information and never the internal limit H; change impact lists are mechanical with no judgement; re-check after caller edits starts as a new operation; check and ID-assignment are separate SKILLs"
      - Partial DLID assignment failure keeps issued IDs and reports per-document causes without rollback (D-004)
      - Temporary files stay inside the project under .temp/doc-link/skill
      - Management state saved as JSON under .doc-link at the project root, split into one file per document info and one file per confirmed ToC per key
      - Scripts emit byte-identical deterministic output with sorted keys, UTF-8 and fixed indentation
      - Python scripts run with uv and depend only on uv and markdown-it-py
