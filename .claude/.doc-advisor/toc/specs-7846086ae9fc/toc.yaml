  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overview Design
    purpose: "Defines the overall design of doc-link: system boundary, the operations with their inputs, outputs and write boundaries, the ToC build and search sequence, and common invariants. Detailed designs for each part are split into separate documents."
    content_details:
      - "System boundary: doc-link replaces DocAdvisor and handles document IDs, ToC, search, DLID resolution, reference checks and change impact notification"
      - "Write boundary: doc-link writes only the DLID in the frontmatter doc_link_id and the section ID at the end of heading lines (REQ D-031); links are not written (D-042)"
      - "Operation table: DLID assignment, ToC build and rebuild, document search, DLID resolution, reference check, change impact candidate notification and consistency check, each with inputs, results and write boundary"
      - "ToC build order: target determination, ID check, change detection, required info acquisition, reference check, candidate check, confirmation; documents with missing or duplicate IDs are excluded and reported without stopping the build (D-036)"
      - Search, DLID resolution and impact notification are separate operations that run after ToC confirmation; no search is possible without an initial ToC
      - Sequence of index-docs then check-impact in the normal flow, with the notification only proposing candidates and never rewriting documents
      - Unreadable reference directory is recorded as absent and does not block ToC confirmation (D-025)
      - "Common invariants: document ID is independent of path, body and key and is not reissued for path or body changes; reference existence is not asserted without scanning the directory; no partial ToC is exposed as confirmed"
      - Updating one key never updates or deletes the ToC of another key
    applicable_tasks:
