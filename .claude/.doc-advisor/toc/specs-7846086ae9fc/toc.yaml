  docs/specs/design/DES-008_content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines Markdown parsing with markdown-it-py, DLID read and write positions, reference link resolution rules, section and document content hash scope, and the field rules for AI-generated ToC values
    content_details:
      - DLID read from frontmatter doc_link_id, accepted only as DLID- plus 12 lowercase Crockford Base32 characters
      - DLID write positions limited to frontmatter doc_link_id, a heading anchor line, and reference link title attributes
      - Post-write reparse with markdown-it-py that reverts the write when any difference beyond the intended DLID appears
      - Section DLID taken from an anchor line before a heading, with the section range running to the next heading of the same or higher level
      - Reference link resolution following CommonMark rules for label normalization, first definition, and unescaped title and href
      - Scheme URLs, images, autolinks, and HTML anchor tags excluded from formal references
      - Href path and fragment percent-decoded before resolution, with the hash splitting document and heading
      - Heading anchors resolved by a GitHub-compatible slug rule
      - Content hash as SHA-256 of the original UTF-8 bytes per document and per section range, with no normalization
      - AI-generated fields for title from H1, purpose, content details, applicable tasks, and keywords, checked against field limits
    applicable_tasks:
      - Implementation of DLID reading and writing in frontmatter, heading anchors, and link titles
      - Implementation of Markdown link and heading parsing with markdown-it-py
      - Implementation of content hash computation for documents and sections
      - Creation of test vectors for hash and link resolution rules
      - Review of AI-generated ToC field generation and validation
