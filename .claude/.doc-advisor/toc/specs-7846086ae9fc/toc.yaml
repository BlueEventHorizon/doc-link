  docs/specs/design/DES-010_skill-composition.md:
    title: SKILL and Custom Agent Composition (DES-010)
    purpose: Defines the eight SKILLs and two custom Agents of doc-link, their responsibilities and read-write boundaries, and the operation flow from check-dlid through index-docs to check-impact
    content_details:
      - Table of eight SKILLs (embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact) with their kind and whether they write to Index target documents or management state
      - Custom Agent toc-updater fills up to three same-directory documents per launch and query-worker searches the confirmed ToC read-only
      - embed-dlid writes only DLID and section IDs, while the check SKILLs detect and return without rewriting management state
      - check-links returns the title values to write, and the project AI asks the user before rewriting links and converts inline links to reference definitions
      - check-impact returns changed documents with direct referrers, recorded versus current hash, and falls back to the check-toc result when the ToC is stale
      - Per-SKILL sequence diagrams for embed-dlid, the index-docs entry script loop, the query-docs rebuild two-choice confirmation and resolve-dlid failure paths
      - "Operation flow in section 3.9: check-dlid, embed-dlid, check-links, index-docs and check-impact, repeated from check-dlid after body changes"
      - Exchange of identifiers with Agents through the .temp directory, with error value source_unreadable and exit value zero for success
      - Each SKILL does not prompt the next SKILL, and the project AI runs the flow
