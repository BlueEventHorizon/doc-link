  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Defines the design for pre-search freshness judgement of the confirmed ToC, the search result contract, the search AI input copy, and DLID resolution against recorded paths without writing.
    content_details:
      - "Pre-search judgement with three outcomes: no rebuild needed, rebuild needed, and undeterminable, where undeterminable stops the search instead of falling back to the old version"
      - User choice between rebuilding before search and searching the existing version when a rebuild is needed, with counts of new, removed, path changed, content changed, missing ID, and duplicate ID documents
      - "Search result contract: document ID, recorded path, relevance reason, section, ToC identification key, ToC version, and freshness judgement"
      - Composition of the search AI input copy from the confirmed ToC and latest document information, with paths and hashes excluded
      - Search AI reads all entries of the copy and returns document IDs, while script attaches paths from the confirmed ToC
      - "resolve-dlid input and output: per-DLID resolution with document and section lookup from management state"
      - Resolution by matching doc_link_id in frontmatter and section ID at heading line end, returning content hashes only when recorded values agree
      - Handling of recorded paths outside the project, symbolic links, and missing files as recorded path not found without exploration
      - Search and DLID resolution never write to the ToC, management state, or index target documents
