  docs/specs/requirement/REQ-005_references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for DLID-based references, link inspection by directory search, path-mismatch notification, section references, change-impact notification, and inconsistency checks.
    content_details:
      - "FR-007 reference notation: reference-link definition titles carry the referenced content hash and DLID, with the formal reference rules"
      - "FR-009 link inspection: DLID in title, directory search for the document ID, path match, relative path resolution, and fragment resolution"
      - "FR-010 path-fix notification: reported only when the current path is confirmed by directory search; doc-link never rewrites link definitions"
      - "Section 13.1 section references: a section ID appended to every heading line, with section scope up to the next heading of the same or higher level"
      - "FR-013 change-impact candidates: reverse lookup of referrers whose recorded content hash differs from the current hash"
      - "FR-014 and FR-015 notification: returns changed ID, compared hashes, referrers, reference text, and scanned scope; no notification state is stored"
      - "FR-016 inconsistency checks: missing or duplicate IDs, headings without section IDs, broken references, ID/path mismatch, unresolved fragments, ToC/file mismatch, and not-found in the specified directory"
      - "AC-032 title value suggestion: suggests the content hash and DLID for doc_link_id links lacking a DLID in the title"
      - "AC-008 out-of-scope documents: detects referrers and verifies by directory search instead of invalidating references"
    applicable_tasks:
      - Implementation of DLID reference notation and link inspection
      - Review of reference and change-impact notification requirements
      - Implementation of check-links inspection logic
      - Implementation of check-impact change-impact candidate listing
      - Verification of acceptance criteria AC-003, AC-004, AC-006 to AC-009, AC-028, and AC-032
