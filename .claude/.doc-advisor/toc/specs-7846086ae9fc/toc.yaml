  docs/specs/design/DES-007_references-impact.md:
    title: DES-007 Reference Inspection and Change Impact Candidate Notification
    purpose: Defines reference inspection by DLID matching over a scanned directory, reverse references and change impact candidates, processed baselines per target and referrer pair, and the scope of integrity checks
    content_details:
      - "Formal reference extraction: Markdown links whose title ends with a DLID, excluding file names and natural language mentions"
      - "Result classes of reference inspection: match, same ID at a different path, and absent in the specified directory"
      - Fragment resolution to an explicit anchor or heading-generated anchor, with fragment mismatch diagnosis and current anchor reporting
      - Path mismatch fix proposal only when the same ID is uniquely confirmed in the scanned directory
      - Reverse references built from scanned referrers and bound to content hash, scan key, and time
      - Change detection per section DLID against processed baselines, with addition and change classes
      - Notification of direct referrers only, with indirect impact detected one step at a time
      - Processed baseline keyed by target DLID and referrer document ID or no referrer, independent of the scan key
      - doc-link does not judge or edit referrers; the project management AI decides and applies fixes
      - Baseline advances only when the report is produced; check-links, check-impact, check-toc, check-dlid split
