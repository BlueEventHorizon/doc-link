  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overview Design
    purpose: Defines the doc-link system boundary, its six operations with inputs, outputs, and write boundaries, the ToC build order, and the common invariants shared across operations.
    content_details:
      - "System boundary: managed Markdown document IDs, ToC, search, reference inspection, change impact notification, with the caller passing the complete desired state of managed targets"
      - Only DLID writes to managed Markdown, limited to frontmatter doc_link_id, the anchor line before headings, and the title attribute of reference links (D-031)
      - "Operation table: ID assignment, ToC build and rebuild, document search, reference inspection, change candidate notification, consistency inspection, each with inputs, outputs, and write boundary"
      - "ToC build order: target confirmation, ID check, change detection, required info retrieval, reference inspection, candidate inspection, confirmation, excluding unassigned or duplicate IDs without stopping the build (D-036)"
      - Normal sequence of index-docs followed by check-impact as a separate operation, with ProjectAI, DeterministicScripts, and ContentAI participants
      - "Common invariants: DLID is independent of path, body, and key and is not reissued for reasons alone, no partial ToC candidate is published, and hash and comparison baseline are kept separate"
      - Reference scope bounded by scanned referrers, and an unreadable reference directory recorded as absent without blocking confirmation (D-025)
      - Updating one key never changes the ToC of another key, and search requires an initial ToC while report success is not ToC update success
    applicable_tasks:
