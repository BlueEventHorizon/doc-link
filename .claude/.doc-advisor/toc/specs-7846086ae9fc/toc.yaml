  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Defines the pre-search judgment of whether a ToC rebuild is needed, the search result contract, the composition of the search AI input copy, and DLID resolution against recorded paths without writing any state.
    content_details:
      - Pre-search judgment classifying results as rebuild not needed, rebuild needed, or undecidable, where undecidable stops the search
      - Two-choice user confirmation between rebuilding first or searching the existing version, with counts of new, removed, path changed, content changed, ID missing, and ID duplicate documents
      - "Search result fields: document ID, recorded path, relevance reason, section, key, ToC version, and freshness judgment"
      - Search AI input copy built from the confirmed ToC and document information, with titles, purposes, content details, applicable tasks, keywords, and section headings but no paths or hashes
      - "resolve-dlid behavior: document DLID resolved through its recorded current path, section ID resolved through the owning document across all keys"
      - Verification of DLID and section ID against the file at the recorded path, with the content hash taken from records and never computed from the current file
      - Recorded paths that are absolute or start with parent traversal treated as invalid records and reported as not at the recorded path
      - Resolution never writing to the ToC, management state, or Index target documents
