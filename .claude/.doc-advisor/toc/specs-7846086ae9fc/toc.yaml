      - Reference inspection by actual search of the reference directory, where unsearchable directories are recorded as absent and never block confirmation
      - Acceptance criteria AC-001, AC-002, AC-010, AC-011, AC-017, AC-018, AC-020, AC-026, and AC-027 covering moves without regeneration and no publication of partial state
