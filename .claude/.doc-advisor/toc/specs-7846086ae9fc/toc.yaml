  docs/specs/requirement/REQ-001_overview.md:
    title: doc-link Requirements Specification — Overview
    purpose: "Defines doc-link's purpose, background, scope, responsibility boundaries, shared non-functional requirements, decisions, and open issues; replaces DocAdvisor for document search and index management."
    content_details:
      - "Background limits of DocAdvisor: path-keyed ToC, file-hash change detection, non-unified references"
      - "Goal: persistent document IDs (DLID), machine-traceable references, change impact notification to the project management AI"
      - "System flow: ID assignment operation, then ToC build, change detection, and notification of changed documents and their referrers"
      - "Document search flow: rebuild check, user choice between rebuilding the ToC and searching the existing ToC (D-010)"
      - "Glossary: document ID, section ID, ToC, referrer, referee, content hash, management key, management target specification, target document list"
      - "Scope: Markdown only, no semantic impact decision by scripts, no code dependency analysis, no ToC backup or recovery"
      - "Responsibility boundary: doc-link never decides whether to fix a referrer and writes only DLIDs to managed Markdown (D-031)"
      - "Shared non-functional requirements NFR-001 to NFR-008: rebuild consistency, determinism, idempotency, write boundary, diagnosability, resumption, scalability, separation of generation instructions from validation limits"
      - Error candidates (fatal) and non-blocking detections recorded in the ToC, such as missing reference targets and file-name references (17.1, 17.2)
      - Decision log D-001 to D-047 and open-issue log U-001 to U-024 with their resolutions
