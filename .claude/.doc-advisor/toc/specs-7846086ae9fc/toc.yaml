  docs/specs/design/DES-010_skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: Defines the eight doc-link SKILLs and two custom Agents (toc-updater and query-worker), their responsibilities, the sequence of each SKILL, and the data exchange rules between SKILLs and the Agents.
    content_details:
      - Eight SKILLs embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact with their operation or inspection kind and their writes to documents and management state
      - "embed-dlid responsibilities: issue DLIDs to documents without an ID, issue section IDs to headings, resolve duplicate IDs with user confirmation, and add referenced DLIDs to link titles"
      - "index-docs responsibilities: detect the difference between confirmed ToC and actual files, ask toc-updater for generation targets, verify results, scan reference directories, and confirm the ToC version in one batch"
      - "toc-updater agent: handles up to 3 documents per launch independently, uses the haiku model, and checks only the field length limit L"
      - "query-worker agent: reads the whole confirmed ToC, verifies candidates against document bodies, returns related documents with reasons, is read-only, and never adds nonexistent IDs"
      - "check-impact: returns changed documents with their direct referrers and advances notified hashes per (changed document, referrer) pair; check-* SKILLs otherwise do not change management state"
