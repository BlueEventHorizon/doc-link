  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: "Defines the logical data model of doc-link: identity, relations, versions and primary sources of document info, reference records, reference check results, section entries, confirmed ToC and build runs, without specifying a physical schema. Clarifies that the notification keeps no state."
    content_details:
      - Document identity by doc_link_id, independent of path and key; one document info per ID shared by all keys without per-key copies
      - "Document info fields: ID, current path, title, purpose, overview, applicable tasks, keywords and content hash"
      - "Reference record: referrer ID, location, referee ID, recorded path, optional section ID and recorded content hash in the title, or no record"
      - Reference check result with check scope and time, result category and found path
      - "Section entry: owning document ID, section ID, heading, position and section content hash taken from the DLID at the end of the heading line"
      - Final check state per document with date and result of success, failure or unprocessed
      - "Confirmed ToC per key: target specification, member document IDs, reflected hashes, section entries, references, reverse references and final check state; at most one per key"
      - Build run identified by build ID, operation, key and start time
      - Membership is determined by target scanning per key; a document can belong to several keys
      - Content hash differs from document ID; path change alters the content hash but not the ID; reference check match holds only for recorded directory and time
    applicable_tasks:
