  docs/specs/design/DES-006-search.md:
    title: DES-006 Document Search Design
    purpose: Defines the pre-search freshness check against the published ToC, the search result contract, and the search-time re-scan of reference freshness for documents appearing in search results.
    content_details:
      - Pre-search check classifying results as rebuild not needed, rebuild needed, or undecidable
      - Undecidable check treated as a failure that stops search and never silently falls back to the old version
      - "User choice when rebuild is needed: rebuild then search, or search the existing version"
      - "Rebuild scale shown to the user: counts of new, removed, path changed, content changed, ID missing, ID duplicate, and documents needing AI generation"
      - Search takes no lock and reads only confirmed rows; document info shows the latest row while index state comes from the existing version
      - "Search result contract: document ID, recorded path, relevance reason, optional section, management key, ToC version and freshness judgement"
      - Results from an existing version carry a warning that the index may not reflect the current target set
      - Search-time re-scan of reference definitions limited to references in result documents, reported as check impossible on failure
      - Script handles candidate retrieval and version pinning while the relevance evaluation method is undecided
      - Frontmatter parse failure treated as missing ID, and disappearance of a target directory treated as departure requiring rebuild
    applicable_tasks:
