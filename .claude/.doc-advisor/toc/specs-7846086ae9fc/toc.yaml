  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Defines the pre-search staleness judgment, the search result contract, the input copy given to the search AI, and DLID resolution against recorded paths for the search feature
    content_details:
      - Pre-search judgment separating no rebuild needed, rebuild needed, and undecidable, where undecidable is treated as a failure
      - Rebuild-needed case where the user chooses rebuild then search or search the existing version, showing change counts
      - "Search result fields: document ID, recorded path, relevance reason, section, ToC key, ToC version, and freshness flag"
      - Search AI input copy built from the confirmed ToC and document info with IDs, titles, purposes, content details, tasks, keywords and section headings
      - Paths, content hashes, reference relations and check results excluded from the search AI input copy
      - Search AI reads every entry and prefers recall, selecting documents whose relevance is uncertain
      - DLID resolution by recorded path, verifying document ID and section DLID against frontmatter and heading trailer
      - Section content hash returned only when recorded hashes agree across keys, otherwise reported as none
      - Recorded paths that leave the project by literal form rejected as invalid records and not treated as current paths
      - Search and resolve never write the ToC, management state or indexed documents
