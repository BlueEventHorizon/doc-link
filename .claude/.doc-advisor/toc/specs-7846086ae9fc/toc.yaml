  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines the logical information units of doc-link (document identity, index target specification, document info, reference descriptions, reference check results, confirmed ToC, notified hash, build run), their identifiers, relationships, multiplicity, scope, and value freshness, without specifying the physical storage schema.
    content_details:
      - "Information table: document identity by doc_link_id, index target specification, observed index target, document info keyed by ID and shared across keys, reference description with source ID, location, target ID and path, reference check result, confirmed ToC per key, notified hash per target and referrer, build run"
      - Document info stored once per doc_link_id and not copied per key, so all keys see the same latest info
      - Confirmed ToC holds membership, reference relations, reflected hash and check status, but not document info
      - "Multiplicity: one confirmed ToC per key at most, zero before first build; one document can belong to several keys"
      - Section identified by section ID written just before its heading; headings without DLID are not stable identifiers
      - Document ID is fixed at issuance while content hash changes with the observed source, including link path fixes
      - Reference check OK holds only for the recorded directory and check time
      - Documents leaving the index target are removed from the key ToC without searching outside the target range
      - No open relation remains in the model
    applicable_tasks:
