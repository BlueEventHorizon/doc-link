  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines the logical data model of doc-link, covering document identity, document information, reference records, section entries, and confirmed ToC relations, without specifying a physical schema.
    content_details:
      - Document identity is doc_link_id, independent of path and ToC key
      - Index target specification is kept as the last confirmed ToC specification for each key
      - Document information holds ID, current path, title, purpose, summary, applicable tasks, keywords, and content hash, stored once per ID and shared across keys
      - Reference record holds source ID, location, target ID, recorded path, optional section ID, and the content hash recorded in the title
      - Reference check result holds check scope, check time, outcome category, and discovered path
      - Section entry holds owning document ID, section ID, heading, position, and section content hash
      - Final check state holds document ID, check time, and outcome of success, failure, or unprocessed
      - Confirmed ToC holds key, version, target specification, member IDs, reflected hashes, section entries, references, and final check state, with one per key
      - "Multiplicity: one key has many IDs and one ID belongs to many keys; reverse references are derived only from registered sources"
      - "Notification state is not held, and removed documents are dropped from the key's confirmed ToC"
    applicable_tasks:
      - Data model review for doc-link ToC and reference records
      - Implementation of document information and ToC storage structure
      - Modification of reference record or section entry fields
      - Verification of multiplicity rules between keys and document IDs
