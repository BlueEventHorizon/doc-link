    title: DES-007 Reference Inspection and Change Impact Candidate Notification
    purpose: "Defines reference inspection for doc-link: formal reference extraction from reference link titles, directory-scan matching of DLID targets, reverse references and impact candidates via content hashes, and change impact notification."
    content_details:
      - Formal reference extraction from the last word of a Markdown reference link title as the DLID, with the recorded content hash kept from the preceding word
      - Inspection basis keeping referrer ID, position, target ID and link path separately, with directory scan of the specified directory
      - "Match outcomes: match, same ID at a different path, or absent in the specified directory"
      - Fragment resolution against explicit anchors or heading-generated anchors, with fragment mismatch and current anchor reporting
      - "Value format for link_without_dlid: content hash plus DLID read from the current target, not from recorded ToC data"
      - Reverse references and impact candidates comparing recorded content hash with current hash from the confirmed ToC by exact match
      - Targets missing from the confirmed ToC (deleted or moved) excluded from comparison and reported by check-links
      - Change impact notification returning changed ID, current hash, referrer ID, position, reference text and inspection scope
      - "Stateless notification: doc-link writes nothing and repeats the same reference until the project management AI rewrites the recorded hash"
      - Inconsistency inspection categories split into check-dlid, check-links, check-toc and check-impact
