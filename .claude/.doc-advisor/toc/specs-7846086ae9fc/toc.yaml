  docs/specs/design/DES-010-skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: Defines the composition of the eight doc-link SKILLs and one custom Agent, their responsibilities by type, and the per-SKILL sequences among scripts, managed state, agents and Markdown documents.
    content_details:
      - Eight SKILLs embed-dlid index-docs query-docs query-doc-tree check-dlid check-links check-toc check-impact classified as operation, query, or inspection
      - Inspection SKILLs only detect and return results and never rewrite managed state, with processed-marking placement deferred to U-024
      - embed-dlid issues DLIDs to documents and sections and resolves duplicate IDs only after the user confirms the original
      - index-docs checks targets and IDs, detects diffs, delegates generation to the information generation Agent, runs reference checks and finalizes the ToC version in one batch
      - query-docs runs a pre-search rebuild check, offers a two-option rebuild choice, and reports the used version and freshness
      - check-impact returns changed documents with direct referrers, including section-DLID referrers only when that section changed
      - check-links detects broken references, ID and path mismatches, missing sections, missing reference directories and unscannable directories
      - The custom Agent (name undecided) generates purpose, content summary, applicable tasks and keywords per document and holds no verification data beyond the description limit
      - Each SKILL is inherited type running in the caller context and delegates processing to scripts without logic in SKILL.md
    applicable_tasks:
      - SKILL composition design review
      - Responsibility assignment review for doc-link SKILLs and the custom Agent
      - Implementation planning for embed-dlid, index-docs and query-docs
      - Implementation of inspection SKILLs check-dlid, check-links, check-toc and check-impact
      - Review of the index-docs and check-impact sequence flows
      - Change impact review when altering SKILL boundaries or the information generation Agent
