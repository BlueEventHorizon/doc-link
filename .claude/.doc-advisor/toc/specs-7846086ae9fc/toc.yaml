    title: "doc-link Requirements Specification: References and Change Notification"
    purpose: Defines requirements for DLID-based references in Markdown link titles, link inspection, path-fix notification, section references, change impact notification, and integrity checks.
    content_details:
      - "Reference notation: a DLID in the title attribute of a standard Markdown inline or reference link, where the last word matches the DLID format; the target may be a document DLID or a section DLID (FR-007, D-032)"
      - "Link inspection: the DLID is present in title, the target directory search finds a file with that document ID, the link path matches the current path, the relative path resolves, and fragments resolve to an explicit anchor or heading (FR-009)"
      - "Path-correction notification: a stale path is reported only when the current path is confirmed by directory search, with no guessing from stored data; doc-link never edits link definitions (FR-010)"
      - "Section reference option B: each heading gets a section DLID anchor, issued only by the ID assignment operation, with the section range running to the next heading of the same or higher level (13.1, D-033, D-035)"
      - "Change impact candidates: reverse lookup of direct referrers from extracted reference relations, with no judgement on whether a referrer needs a fix (FR-013)"
      - "Change impact notification fields: changed document ID, location, compared hashes, referrer document ID and location, reference text, and the inspected scope (FR-014)"
      - "Change report management: document ID and hash of the reported change, enumerated referrers and scope, and report result; AI fix results are not a processed-state condition (FR-015)"
      - "Integrity inspection list: missing document IDs, headings without section DLID, duplicate IDs, broken references, missing DLID in title for doc_link_id links, ID-path mismatch, unresolved fragments, ToC and file mismatch, references absent from the specified directory, and updated documents with unfinished notification (FR-016)"
      - "Directory search verification: a reference is correct only when the ID is found at the link path; a path mismatch is found elsewhere in the directory; an inaccessible directory is treated as absent; ToC or database data alone never proves validity (AC-028)"
    applicable_tasks:
      - Implementation of link inspection by target directory search
      - Review of the DLID reference notation rules in Markdown link titles
      - Design of section reference identification using section DLIDs
      - Implementation of change impact candidate listing and notification
      - Creation of integrity inspection test cases for broken references and path mismatches
      - Review of path-correction notification behavior (FR-010, AC-004)
    keywords:
      - DLID
      - reference notation
      - title attribute
      - path mismatch
      - section DLID
      - change impact candidate
      - integrity inspection
      - broken reference
      - fragment resolution
      - FR-013
