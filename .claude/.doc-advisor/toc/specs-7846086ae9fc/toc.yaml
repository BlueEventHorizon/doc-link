  docs/specs/design/DES-002-execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Roles
    purpose: Defines which actors (caller and project AI, doc-link Skill, deterministic scripts, information generation AI, user) hold which responsibilities and write permissions, the logical operations each script provides with their failure promises, and the Skill-script connection rules.
    content_details:
      - Responsibility table - caller provides key and complete target set; doc-link Skill orders scripts and internal AI; deterministic scripts own DLID writes and doc-link state updates; information generation AI produces summaries and keywords without changing IDs, hashes or ToC
      - Logical script operations - target expansion, ID check, ID assignment, comparison value acquisition, change judgment, reference extraction and check, AI output validation, candidate check and commit, search read, baseline update, consistency check
      - Write restriction - scripts write DLID only to frontmatter, anchor line and link title, and never modify other body text or links
      - Connection rule - Skill runs as an inherited Skill in caller context, and only the summary generation AI runs in a separate context
      - Connection rule - scripts verify input versions and states and reject forbidden transitions, so a self-reported previous-step success is not trusted
      - Change impact notification - scripts enumerate changed documents and known referrers mechanically without judgment of fix necessity by doc-link
      - Undecided - whether search relevance is judged by script or AI, and rollback of partial ID writes after failure
      - Storage - SQLite via Python sqlite3 with per-document lock and single-run transactions; lock holder identified by session ID placeholder or build ID with process ID as substitute
    applicable_tasks:
      - Implementation of doc-link Skill and script responsibility split
      - Review of write permissions and prohibited actions per actor
      - Design of failure handling for ID assignment partial success
      - Verification of Skill-script connection and state transition guards
