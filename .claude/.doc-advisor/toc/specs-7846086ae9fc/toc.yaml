  docs/specs/requirement/REQ-004_search.md:
    title: "doc-link Requirements Specification: Document Search"
    purpose: "Defines requirements for doc-link document search: per-key ToC lookup, pre-search rebuild checks and user choice when the ToC is stale, failure handling, and required search result fields."
    content_details:
      - "Search routing: --key selects that key's ToC, and the reserved key all in single mode is used when the key is omitted (FR-006)"
      - "Missing ToC: no search is run; the result states that an initial build with a management target specification is required"
      - "Pre-search staleness check: the stored re-interpretable management target specification in the ToC is re-evaluated, and a caller-supplied updated specification takes precedence (FR-006, AC-019)"
      - "Rebuild scale report: counts of new, removed, path-only changed, content-changed, missing-ID, and duplicate-ID documents plus AI summary generation count excluding reusable verified info (D-027)"
      - User choice between rebuilding the ToC before search and searching the existing ToC unchanged
      - Failure stop when permission, read, uninterpretable stored specification, or unreadable state prevents the rebuild judgement; the stale-ToC search option must not be offered (D-026)
      - "Stale-ToC search: index state (membership, references, reflected hashes, check results) comes from the existing ToC version while titles and summaries use the latest document content; the ToC is not re-confirmed (D-024)"
      - "Search result fields: document ID, recorded ToC path, reason for relevance, optional section, and the ToC state used for the search"
