    title: Rules for Markdown parsing, comparison values, and generated information
    purpose: Defines rules for reading and writing document IDs (DLID) in frontmatter and headings, Markdown reference and heading parsing with markdown-it-py, SHA-256 content hash computation, and the rules for AI-generated ToC fields.
    content_details:
      - Frontmatter delimiter detection and minimal top-level key parsing that tolerates YAML syntax errors
      - "DLID recognition: DLID- prefix plus 12-character lowercase Crockford Base32, case-sensitive exact match"
      - "Write scope: only the DLID is written to frontmatter doc_link_id and to the end of heading text, verified by re-parsing with markdown-it-py"
      - Atomic write through a temporary file and os.replace, keeping file permissions and writing through symlinks to their target
      - "Reference link rules following CommonMark: first definition wins, case-folded labels, scheme destinations excluded, inline links excluded"
      - Heading section range from a heading to the next heading of same or higher level
      - GitHub-compatible heading anchor generation with -1, -2 suffixes for duplicates
      - Content hash as SHA-256 of UTF-8 bytes, excluding the hash word recorded in the reference title
      - AI-generated field limits L with floor(L x 1.3) validation and minimum item counts of 5, 1, and 5
