      - "Content change scenario: referrer records keep the old value and check-impact returns the reference on every run until the record is rewritten"
      - "Multi-key scenario: the same DLID in keys A and B, updates to A do not rewrite B ToC, and verified AI information is reused when added to B"
      - "Out-of-scope reference scenario: real directory scan outside the index target with recorded scope and time, without guessing move destinations"
