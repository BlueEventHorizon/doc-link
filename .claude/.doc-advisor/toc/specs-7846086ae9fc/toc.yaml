      - "Value format for DLID-less links: content hash followed by DLID, read from current source text"
      - "Impact notification fields: changed document ID, location, current hash, recorded hash, referrer ID, location, reference text, and inspection scope"
      - "Inspection items: missing or duplicated IDs, broken references, DLID-less links, path mismatch, ToC versus source differences, hash mismatch"
