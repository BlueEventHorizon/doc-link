    content_details:
      - "Build inputs and outputs: management key, complete desired target specification, target Markdown, last published version, and processed comparison baseline"
      - Target expansion from directory patterns with exclusions, reporting documents without an ID or with duplicate IDs without stopping the build
      - "ID issuance operation: duplicate resolution by current path, creation time and content hash, then 60-bit random Crockford Base32 12-character IDs checked against all keys"
      - Section DLID issuance with anchor line writing, and migration that adds referenced DLIDs to existing link titles
      - "Change set categories: new, target departure, same-ID path change, body comparison value change, and reference or physical path change"
      - Generation plan reuses AI-generated information for unchanged documents and asks AI only for new or content-changed documents
      - "Candidate checks: ID uniqueness, target set correspondence, reference and back-reference correspondence, required fields, and consistency with compared content"
      - "Document-level lock protocol: acquire lock, recompare content hash after waiting, generate with AI only on mismatch, verify lock owner before write, then release"
      - Lock rows persist across script runs with session ID, operation, key, stage and timestamps, and forced release requires user confirmation
      - Build never rewrites managed Markdown except DLID anchor writing during ID issuance
