      - Choice between rebuilding the ToC before searching or searching the existing ToC without updating it
      - Search stops as a failure when permission, read error, uninterpretable stored specification, or unreadable state prevents the rebuild judgment (D-026)
      - Search on an existing ToC keeps per-key index state from the old ToC version and uses latest per-document info, with a notice that the ToC may not reflect current documents (D-024)
      - "Search result fields: document ID, ToC path, relevance reason, optional section, and the ToC state used"
      - AC-019 pre-search ToC rebuild confirmation
    applicable_tasks:
