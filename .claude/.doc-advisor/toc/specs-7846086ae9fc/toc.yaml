  docs/specs/design/DES-005_indexing.md:
    title: DES-005 Target Resolution, DLID Assignment and ToC Build Design
    purpose: Defines target resolution and ID check, the DLID assignment operation, change set classification, required information retrieval, candidate confirmation and the write unit rules for building the doc-link ToC.
    content_details:
      - "Argument validation: valid combinations of paths, dirs, exclude and all options, and rejection of a key without targets"
      - "Directory pattern expansion and exclude matching: slash-free exclude names match at any depth, double-star matches zero or more directory levels, and the fixed excluded directory names and .temp are skipped"
      - Path normalization to NFC, case-insensitive .md judgment, symbolic links followed without double counting, and external targets written only for DLID
      - "DLID assignment: duplicate detection, user-confirmed original candidate, 60-bit random Crockford Base32 12-character IDs, and section IDs assigned to all headings"
      - Duplicate check scope limited to DLIDs scanned in the run, so a single occurrence is treated as correct whether moved or copied
      - Change set classification into new, target removal, same-ID path change, content hash change and reference or physical path change, with section-level diff by section ID
      - Information generation only for new documents or changed content hashes, with the script validating required fields and lengths
      - Candidate commit by atomic replacement of per-document info files and per-key ToC files, keeping the last confirmed ToC on failure; reference not found is recorded as a result, not a failure
    applicable_tasks:
      - Implementation of target resolution and exclude pattern matching for index-docs
      - Implementation of the DLID assignment operation including duplicate handling
      - Review of change set classification and section change detection
      - Modification of ToC candidate validation and atomic commit behavior
