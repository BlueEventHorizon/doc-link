      - Change-impact candidates are referrers found by reverse lookup when the current hash differs from the hash recorded in the referrer title; indirect dependents are not listed
      - Change notification keeps no state and repeats the same reference until the project management AI rewrites the title hash
      - "Inconsistency check list: missing or duplicate IDs, sections without IDs, broken references, path and fragment mismatches, ToC versus file differences, and rewrite targets"
      - Rewrite of links only after the user approves the listed targets; doc-link never rewrites documents
