      - Path mismatch fix proposal only when the same ID is uniquely confirmed in the scanned directory
      - Reverse references built from scanned referrers and bound to content hash, scan key, and time
      - Change detection per section DLID against processed baselines, with addition and change classes
      - Notification of direct referrers only, with indirect impact detected one step at a time
      - Processed baseline keyed by target DLID and referrer document ID or no referrer, independent of the scan key
