  docs/specs/design/DES-006-search.md:
    title: DES-006 Document Search Design
    purpose: Designs the pre-search freshness judgment, the rebuild confirmation choice, and the search result contract for key-scoped document search, including the read-only search worker that returns candidates
    content_details:
      - "Search request contract: key (default reserved key all), task or search conditions, and a rebuild-needed result when no confirmed ToC exists"
      - Pre-search check classifying results into no rebuild needed, rebuild needed, and undeterminable, where undeterminable never reads as either
      - Rebuild confirmation offering two choices (rebuild then search, or search the existing version) with counts of new, removed, path changed, content changed, ID unassigned, ID duplicate, and AI generation needed
      - Scan scope and generation time are not shown at the confirmation point because they are unknown at that time
      - Stale-version search using only key-level index state (membership, references, reflected hash, check results) while document information shows the latest row
      - "Undeterminable handling: stop the search, report the target and cause, and never present an old-version search to the user"
      - Frontmatter parse failure treated as ID unassigned, and a removed target directory treated as target removal requiring rebuild
      - "Search result candidate fields: document ID, confirmed path, relevance reason, section if needed, key, ToC version, and freshness judgment"
      - Warning attached to results when the existing version is used, and no assertion of the current path for moved or deleted files
      - Semantic relevance judged by a read-only search worker (custom Agent) over the entire ToC, favoring recall, without supplementing IDs or modifying the ToC
    applicable_tasks:
      - Implementation of pre-search freshness judgment for document search
      - Implementation of the rebuild confirmation prompt with change counts
      - Implementation of the search result contract including freshness and version fields
      - Implementation of the read-only search worker prompt and output handling
      - Review of failure handling when target resolution or file reading fails before search
      - Test design for undeterminable and stale-version search paths
