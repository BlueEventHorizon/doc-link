  docs/specs/design/DES-008_content-rules.md:
    title: Markdown Parsing, Comparison Values and Generated Information Rules
    purpose: Defines Markdown parsing and DLID read and write rules, heading anchor and section range rules, SHA-256 content hash computation, and length and count limits for AI-generated ToC fields
    content_details:
      - Frontmatter delimiter detection that reads only top-level keys so YAML syntax errors do not block reading doc_link_id
      - DLID recognition as DLID- plus 12 lowercase Crockford Base32 characters, case-sensitive; uppercase values are treated as missing document ID
      - Write position limited to frontmatter doc_link_id and the end of heading lines; re-parse with markdown-it-py verifies only the intended DLID changed, otherwise rollback
      - "Reference link rules following CommonMark: undefined label is text, first definition wins, case-folded label matching, scheme destinations ignored, images and autolinks excluded"
      - Section range runs from a heading to the next heading of same or higher level; section ID is the trailing DLID of the heading
      - GitHub-compatible heading anchor generation with Unicode 13.0.0 category removal and -1 -2 suffixes for duplicates
      - Content hash is SHA-256 of raw UTF-8 bytes with no normalization; the recorded hash in a reference title is excluded from the calculation
      - Section content hash covers only the section range; issued ID values are independent of content hashes
      - Test vectors confirm hash changes on body, heading or link target edits and no change when only the recorded hash is rewritten
      - AI-generated fields written in English with limit L, validator accepting up to floor of L x 1.3, and minimum counts of 5 content items, 1 task and 5 keywords
    applicable_tasks:
