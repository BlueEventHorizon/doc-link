    title: DES-005 Target Resolution, ID Embedding, and ToC Build Design
    purpose: Defines how indexing resolves targets, checks and embeds document and section IDs, determines change sets, and publishes ToC candidates atomically, including the input output boundary
    content_details:
      - "Build input and output: management key, complete target spec, source Markdown, last confirmed version, comparison baseline, and output of new confirmed version or failure diagnosis with unprocessed changes and reference check results"
      - Argument validation rules for target spec combinations of paths, dirs, exclude, all, and paths-file, with single mode requiring no key
      - Expansion of directory patterns into a concrete Markdown list with exclusions applied
      - Documents without doc_link_id or with duplicate IDs excluded from the confirmed list and reported, while a read failure stops the build
      - ID embedding operation that checks DLIDs against all keys and offers original candidates to the user when duplicates exist
      - Script-issued document IDs and a section DLID for every heading via anchor lines, with new DLIDs for copied documents
      - DLID issued as 60-bit random Crockford Base32 of 12 characters and saved IDs never recalculated or rolled back
      - Change set categories new, target removed, path change for same ID, content hash change, and reference or physical path change, recorded independently
      - Candidate checks for ID uniqueness, reference consistency, and required fields, with one batch publication of ToC and per-document publication of document info
      - Atomic write via temporary file and os.replace without locks, where concurrent runs converge on rerun
