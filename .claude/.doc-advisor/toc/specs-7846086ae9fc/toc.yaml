      - "ID embedding operation steps: DLID collation against all keys, original-file candidate selection, new doc_link_id issuance, and section anchor line writing"
      - DLID format of a 60-bit random value in 12 Crockford Base32 characters with probabilistic uniqueness (decisions U-001 and U-016)
      - Change set categories (new, target removed, same ID path change, content hash change, reference description or physical path change) recorded independently
      - Distinction between index update targets (compared with the ToC reflected hash) and unreported changes (compared with the processed comparison baseline)
      - "Candidate validation items: ID uniqueness, target set correspondence, reference and back-reference correspondence, and required fields"
      - Document information rows stored independently of keys and confirmed per document, outside the batch publication of key-level index state
      - "Write unit rule: one SQLite transaction per script run with no locking, and convergence by rerun after concurrent execution"
      - "Rerun rule: re-evaluate from confirmed version, comparison baseline, and current files without repeating already-reflected summaries"
