  docs/specs/requirement/REQ-003-toc.md:
    title: "doc-link Requirements: ToC Management"
    purpose: Defines the information that the ToC and processed hash list must hold, change detection against the existing ToC, the ToC build and rebuild steps, and the limits on AI-generated fields.
    content_details:
      - "ToC document entry fields: document ID, current path, title, purpose, content summary, applicable tasks, keywords, document hash, references, and check state"
      - Section entries keyed by section DLID anchors and reference entries taken from ID-based link titles
      - "AI-generated field limits: purpose 200 characters and arrays of 10 items, with internal tolerance H = floor(L x 1.3) hidden from the generator"
