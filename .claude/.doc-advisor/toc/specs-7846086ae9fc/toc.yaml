  docs/specs/design/DES-010-skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: Defines the composition of the 7 doc-link SKILLs and 2 custom Agents, their responsibilities, per-SKILL sequences, write permissions, and data exchange with toc-updater and query-worker.
    content_details:
      - Seven SKILLs embed-dlid index-docs query-docs check-dlid check-links check-toc check-impact, each classified as operation, query, or check
      - "embed-dlid responsibilities: issue document IDs and section DLIDs, add DLIDs to links, resolve duplicate IDs after user confirms the original"
      - "index-docs steps: target confirmation, diff detection, toc-updater requests for generation targets, reference inspection, batch ToC commit"
      - "query-docs flow: pre-search check returns unbuilt, up-to-date, rebuild needed or undecidable; user chooses rebuild or existing version"
      - check-impact returns changed documents with direct referrers; processed unit is the pair of changed document and referrer; indirect referrers excluded
      - Only embed-dlid and index-docs write managed Markdown or state; inspection SKILLs return detections only, except the check-impact processed baseline
      - toc-updater generates purpose, content details, applicable tasks and keywords per document under limit L, returning source_unreadable on read failure
      - query-worker reads the fixed ToC copy read-only, returns document IDs and section DLIDs validated against the ToC version
      - "Exchange rules: script writes requests and results at identifier-based paths, deletes them after processing; missing or undefined exit value is a failure"
    applicable_tasks:
      - Implementation of doc-link SKILL.md files and their script orchestration
      - Design review of SKILL and custom Agent responsibility boundaries
      - Review of per-SKILL sequences for index-docs, query-docs and check-impact
      - Modification of data exchange between SKILLs and toc-updater or query-worker
      - Verification of write permissions per SKILL against the requirements
      - Review of the inspection SKILL detection and follow-up responsibilities
