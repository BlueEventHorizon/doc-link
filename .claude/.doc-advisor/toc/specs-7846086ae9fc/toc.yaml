    title: doc-link Requirements Specification - Index Targets and Document ID
    purpose: Defines Index target specification and list confirmation, doc_link_id and section ID verification, DLID issuance and assignment, and DLID-to-path resolution for the doc-link plugin
    content_details:
      - Index target specification by opaque ToC identification key, with --key, --paths, --dirs, --exclude, and the reserved key all for single mode
      - Fixed exclusion list for directory walks, excluding .git, .claude, .codex, .temp, node_modules, vendor, dist, build, target, coverage, __pycache__, .venv, and cache directories
      - Rule that a key is a complete desired state, so entries missing from the new list are removed without searching outside the target range
      - doc_link_id frontmatter key with the DLID- prefix and a 12-character lowercase Crockford Base32 value from a 60-bit random number
      - Index target list confirmation (section 8) that rejects key-less target arguments, --all combined with targets, and key all given as --key all
      - Document ID confirmation (section 9.1) that reads doc_link_id, reports documents without IDs or with duplicate IDs without stopping, and forms the confirmed target list
      - Detection rules for missing document IDs, headings without section IDs, duplicate document IDs, and duplicate section IDs
      - DLID resolution (FR-018) that returns the recorded current path and recorded content hash, and never searches outside recorded paths
      - DLID assignment operation (section 9.2) that checks duplicates against all keys, issues IDs, writes section IDs to every heading, and reports written and unwritable documents
      - Acceptance criteria AC-005 and AC-012 to AC-031 covering duplicate handling, ID immutability, non-meaning of ID values, multi-key membership, and no document change by ToC build or search
