  docs/specs/design/DES-005_indexing.md:
    title: DES-005 Target Determination, DLID Embedding, and ToC Build Design
    purpose: Designs input and output, target set resolution and validation, DLID embedding operation, change set determination, candidate confirmation, and write units for building the ToC of an indexed document set.
    content_details:
      - "Argument combination rules: target specs require --key, --key all is reserved, --all cannot combine with target specs, and --paths-file cannot combine with other target specs"
      - Directory pattern expansion and exclude matching rules, including fixed exclusion names and the .temp directory exclusion
      - "Path normalization: NFC, reject paths outside project root, match .md case-insensitively, exclude .markdown, follow symlinks without double counting"
      - Documents without doc_link_id or with duplicate IDs are left out of the confirmed Index target list, and the build continues; an unreadable document stops the build
      - DLID embedding operation resolves duplicate DLIDs by showing original candidates to the user and issuing new DLIDs for copies
      - New DLIDs are 60-bit random Crockford Base32 12 characters, issued by script and never by the user or AI
      - Section IDs are assigned to every heading lacking one at the end of the heading line; links and link titles are not rewritten
      - Change set categories (new, removed from target, same-ID path change, content hash change, reference description or physical path change) are recorded independently
      - Verified document information is reused by document ID and content hash; AI generation runs only for new or changed documents
      - Atomic writes through a temporary file and os.replace; no lock is set, and partial failure keeps saved document information
