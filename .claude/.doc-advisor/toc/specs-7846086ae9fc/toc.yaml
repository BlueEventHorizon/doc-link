  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Defines pre-search rebuild judgment, the search result contract, and DLID resolution, including the rule that an undeterminable state is never treated as up to date and never falls back to the old version silently.
    content_details:
      - Pre-search judgment outcomes rebuild not needed, rebuild needed, and undeterminable, which are kept distinct
      - Choice between rebuild then search and search on the existing version when a rebuild is needed, with counts of new, removed, path-changed, content-changed, unassigned-ID, and duplicate-ID documents
      - Undeterminable state from failed target expansion or file reads stops the search and reports the cause without using the old version
      - Search results carry document ID, recorded path, relevance reason, section, key, ToC version, and freshness judgment
      - Semantic relevance is judged by a read-only search worker reading the whole ToC, favoring broad recall
      - The search worker never fills missing IDs, corrects index paths, or modifies the ToC or management state
      - resolve-dlid resolves DLIDs without a key, using recorded paths and file contents
      - Section DLIDs resolve through published ToC entries of all keys, listing every recorded owning document as a candidate when keys disagree
      - A recorded path that is missing is reported as missing without searching other locations
      - Search reads only confirmed files and never writes the ToC, management state, or Markdown
