    title: DES-006 Document Search Design
    purpose: "Describes document search design: the pre-search ToC freshness check, the search result contract, the search AI candidate selection from a ToC copy, and DLID resolution by resolve-dlid"
    content_details:
      - Pre-search check classifying a confirmed ToC as rebuild-not-needed, rebuild-needed, or undeterminable by comparing IDs, paths, and comparison values
      - Rebuild confirmation offering rebuild-then-search or search-existing-version, with counts of new, removed, path-changed, content-changed, unassigned-ID, and duplicate-ID documents
      - "Search result contract: document ID, recorded path, relevance reason, section, ToC identification key, ToC version, and freshness judgment"
      - "Search AI copy composition: document ID with title, purpose, content summary, applicable tasks, keywords; section IDs with headings; no paths, content hashes, reference relations, or check results"
      - "resolve-dlid behavior: document DLID resolved via recorded current path, section DLID matched against trailing DLID of heading, with heading anchor and content hash"
      - Recorded paths that are unreadable or mismatched reported as not at recorded path; symlinks resolved to real file; paths escaping project root rejected
      - Undeterminable judgment treated as failure that stops search, never silently falling back to the old version
      - Management state read failure fails the whole DLID resolution
