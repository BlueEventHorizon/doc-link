  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Designs the pre-search freshness judgement, the search result contract, and DLID resolution against recorded paths; search and resolution never write to ToC or management state
    content_details:
      - Pre-search judgement that distinguishes no-rebuild-needed, rebuild-needed and undeterminable results using the stored target spec
      - Two-choice confirmation when a rebuild is needed (rebuild then search, or search the existing version), with change counts shown
      - "Undeterminable results treated as failures: search stops and the old version is not offered"
      - "Search result contract: document ID, recorded path, relevance reason, section, key, ToC version and freshness state"
      - Search AI reads the whole ToC and judges meaning-based relevance with broad recall
      - Worker must not fill in missing IDs, correct index version or paths, or change ToC and management state
      - DLID resolution for documents and sections, matching doc_link_id and anchor DLID against recorded paths
      - "Multiple recorded candidates: only matching candidates resolved, and no other locations searched"
      - DLID resolution fails as a whole when management state is unreadable; DLIDs absent from all records reported as no record
