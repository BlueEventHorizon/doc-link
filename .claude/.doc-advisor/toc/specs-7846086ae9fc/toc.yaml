  docs/specs/design/DES-010_skill-composition.md:
    title: SKILL and Custom Agent Composition
    purpose: Defines the eight SKILLs and two custom Agents of doc-link, their write and state boundaries, per-SKILL responsibilities and sequences, and data exchange with toc-updater and query-worker.
    content_details:
      - Composition table of eight SKILLs (embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact) with write and state-change columns, where all check SKILLs leave managed state unchanged
      - "Two custom Agents: toc-updater generates information for up to 3 documents per launch, and query-worker performs read-only search over the confirmed ToC"
      - "embed-dlid responsibilities: issue DLIDs to documents without one, issue section IDs to headings lacking one, and resolve duplicate IDs with the original confirmed by the user"
      - "index-docs responsibilities: target confirmation, diff detection, toc-updater dispatch with result validation, real directory scan, and batch confirmation of ToC candidates"
      - "check-impact result shape: changed documents with direct referrers, each showing recorded hash versus current hash, an empty list with scope when none, and indirect referrers excluded"
      - "check-impact follow-up: the management AI judges and fixes referrers, rewrites the recorded hash only for checked references, and repeats until the report is empty"
      - "check-links detection list: broken references, ID and path mismatch, missing section, unresolved fragment, missing target, and links with a DLID-less title"
      - "check-toc detection: unbuilt state, new, removed, moved, and content-changed entries, with recorded hash compared excluding the title hash"
      - "resolve-dlid outcomes: resolved path with content hash, DLID absent from recorded path, or no record, with failure when management state is unreadable"
      - "Data exchange rules: the script writes requests and results under a per-skill directory in .temp, deletes them after completion, and treats a missing or undefined exit value as failure"
    applicable_tasks:
      - Implementation of SKILL and custom Agent boundaries for embed-dlid, index-docs, and query-docs
      - Implementation of check SKILL detection logic for check-dlid, check-links, check-toc, and check-impact
      - Modification of toc-updater or query-worker data exchange and result validation
      - Review of write permissions and managed state changes per SKILL
      - Creation of SKILL.md orchestration steps for the check-impact update loop
