    title: DES-001 System Overview Design
    purpose: Defines the doc-link system boundary, the inputs, outputs and write boundaries of each operation, the overall ToC build and impact notification sequence, and common invariants.
    content_details:
      - "System boundary: doc-link replaces DocAdvisor and manages DLID, ToC, search, reference checks and change impact candidates"
      - "Write boundary: DLID is written only to frontmatter doc_link_id, the anchor line before a heading, and the title attribute of reference links (D-031)"
      - "Operation table: ID assignment, ToC build and rebuild, document search, reference check, change impact notification, consistency check with inputs, outputs and write boundaries"
      - "ToC build steps: target resolution, ID check, change detection, data acquisition, reference check, candidate check, commit; documents without ID or with duplicate ID are excluded and reported (D-036)"
      - "Overall sequence: index-docs followed by check-impact as a separate operation"
      - "Common invariants: document ID is independent of path, body and key; issued IDs are not reissued; no partial candidate is exposed as confirmed; content hash and processed baseline are kept separate; reverse references stay within the scanned range; other keys are not modified"
      - Unreadable reference target directory is recorded as absent without blocking confirmation (D-025)
      - "Items deferred to individual design docs: SQLite storage, multi-key visibility, baseline unit, handling of unreadable reference directories"
