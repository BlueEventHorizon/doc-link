      - "Change set categories recorded independently: new, target removed, same-ID path change, body comparison value change, reference or physical path change"
      - Per-document lock with content hash recheck after waiting, holding one lock at a time, stored as SQLite lock rows
      - Document information row kept independently of keys and confirmed per document, not rolled back on build failure
