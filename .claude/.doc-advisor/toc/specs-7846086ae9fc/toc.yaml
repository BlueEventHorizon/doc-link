      - Expansion of directory patterns into Markdown lists with recursive collection and ** matching zero or more directory levels
      - Exclude rules matching names at any level or paths, plus fixed exclusion of names such as .temp in all-mode scans
      - Path normalization to NFC, case-insensitive .md matching, and symlinks counted once by real file
      - Documents without doc_link_id or with duplicate IDs left out of the confirmed target list and reported
