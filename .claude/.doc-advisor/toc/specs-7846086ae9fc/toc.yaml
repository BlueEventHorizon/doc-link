    title: References Inspection and Change Impact Candidate Notification
    purpose: Describes design for formal reference extraction by DLID, reference checking against a directory scan, inverse references, change detection against processed comparison baselines, and change impact candidate notification.
    content_details:
      - "Formal reference extraction: Markdown links whose title last word is a DLID, with referrer ID, position, target ID and link path kept separately"
      - "Reference check results: match, same ID at different path, absent in specified directory, fragment mismatch"
      - Fragment resolution to explicit a-id anchors or heading-generated anchors, referencing DES-008 section 2
      - Inverse reference built from scanned referrers, tied to target pre and post content hash, scan key, target spec and time
      - Change detection per section DLID against processed comparison baseline, distinguishing additions from changes
      - Notification keyed by target DLID and referrer doc ID or no-referrer pair, with baseline advanced only when report is returned
      - Stale baselines of removed sections dropped silently; path mismatch fix target notified only when uniquely confirmed in the scanned directory
      - Indirect referrers not enumerated; propagation detected one level at a time
      - check-dlid, check-links, check-toc and check-impact SKILL split with check-impact as the only state-writing check
