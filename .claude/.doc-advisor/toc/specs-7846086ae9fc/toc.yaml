  docs/specs/design/DES-010_skill-composition.md:
    title: SKILL and Agent composition
    purpose: Defines the eight SKILLs and two custom Agents of doc-link, their responsibilities, the write and state rules for each, the sequences of key SKILLs, and the data exchange with toc-updater and query-worker.
    content_details:
      - Eight inherited SKILLs embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact, each delegating logic to scripts
      - "Write and state table: only embed-dlid writes DLID to indexed documents and only index-docs changes the document information and ToC version"
      - toc-updater launched with up to 3 documents from the same directory, up to 10 concurrent runs, returning purpose, content_details, applicable_tasks, keywords
      - query-worker read-only search over the whole confirmed ToC returning related documents with reasons and never adding IDs absent from the ToC
      - embed-dlid issuing DLID for documents without an ID and section IDs for headings without one
      - check-impact listing changed documents with direct referrers by comparing title-recorded content hash with current hash, excluding indirect referrers
      - check-links and check-toc follow-up actions for broken references, path mismatch, fragment mismatch and stale ToC
      - resolve-dlid returning path, content hash, and section heading with anchor, or recorded-path-missing and no-record states
      - Data exchange via script-determined .temp paths carrying identification values only, with error value source_unreadable
    applicable_tasks:
      - Implementation of SKILL.md wiring and script calls for the eight SKILLs
      - Implementation of toc-updater batch dispatch and result validation
      - Implementation of query-worker search with ID validation against the fixed ToC
      - Review of responsibility boundaries between write-capable and check-only SKILLs
      - Modification of the check-impact follow-up procedure for title content hash rewriting
      - Design review of the index-docs sequence and dispatch concurrency limits
