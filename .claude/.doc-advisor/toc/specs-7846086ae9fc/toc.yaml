  docs/specs/design/DES-010_skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: Defines the responsibilities of the 8 SKILLs and 2 custom Agents of doc-link, the per-SKILL sequences, how check SKILL findings are handled, the use cases, and the data exchange with Agents.
    content_details:
      - 8 SKILLs (embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact) with their write permissions to Index target documents and managed state
      - toc-updater agent handles up to 3 documents from the same directory per launch and generates purpose, content details, applicable tasks and keywords per document
      - query-worker agent reads the whole confirmed ToC, returns relevant documents with reasons, and is read-only
      - embed-dlid and index-docs write DLID only and never rewrite links or titles; index-docs runs at most 3 documents per Agent and 10 Agents concurrently
      - check-dlid, check-links, check-toc and check-impact return findings without rewriting managed state; check-impact lists changed documents with their direct referrers
      - "Standard flow: check-dlid, embed-dlid, check-links, index-docs, then check-impact, repeated from check-dlid after document body changes"
      - Agent data exchange uses script-generated identifiers under .temp/doc-link/<skill>/ and error value source_unreadable for toc-updater
