  docs/specs/requirement/REQ-001-overview.md:
    title: doc-link Requirements Specification - Overview
    purpose: Defines purpose, background, scope, responsibility boundary, and common non-functional requirements of doc-link, a document-ID-based successor to DocAdvisor. Holds decision and open-item registers.
    content_details:
      - "Background limits of DocAdvisor: path-based ToC keys, whole-file hashes, and non-unified reference styles"
      - "Purpose: task-related document search, move and rename tolerant tracking, reference graph, and impact notification to the project management AI"
      - "Initial setup flow: ID assignment operation first, then ToC build, then search and change notification from the last confirmed ToC"
      - "Search flow: rebuild-needed check, user choice between rebuilding and searching the existing ToC, and disclosure that a stale ToC is not current"
      - "Scope: Markdown only, managed key with desired-state target specification, and exclusions such as semantic impact judgement and source code dependency analysis"
      - "Responsibility boundary: doc-link reports changes and referrers without judging edits, the project management AI decides and edits, and doc-link writes only DLID"
      - "NFR-004 write boundary: doc_link_id in frontmatter, section anchor line before each heading, and title attribute of reference links, verified by post-write diff"
      - "Common NFRs NFR-001 to NFR-008: ToC rebuild consistency, determinism, idempotency, scalability, resumable processing, and separation of generation limit from validation limit"
      - Error candidates in 17.1 that block normal completion, and non-blocking findings in 17.2 recorded in the ToC such as missing reference targets and file-name references
      - Decision register D-001 to D-046 and open items U-001 to U-024, all decided
