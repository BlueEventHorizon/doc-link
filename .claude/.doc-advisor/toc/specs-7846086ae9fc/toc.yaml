  docs/specs/design/DES-010-skill-composition.md:
    title: SKILL and Agent Composition
    purpose: Defines the composition of seven SKILLs and two custom Agents, including each SKILL responsibility, its write and state effects, check outputs, sequences, and data exchange with the Agents.
    content_details:
      - Seven SKILLs (embed-dlid, index-docs, query-docs, check-dlid, check-links, check-toc, check-impact), all inherited type, each delegating logic to scripts and not holding logic in SKILL.md
      - "Write and state effects: embed-dlid writes only DLID to managed Markdown, index-docs writes document info rows and ToC version, and check-impact alone advances the processed comparison baseline keyed by (changed document, referrer) pairs"
      - "Two custom Agents: toc-updater generates purpose, content details, applicable tasks and keywords per document under limit L, and query-worker reads the fixed ToC read-only and returns related documents with reasons"
      - "embed-dlid responsibilities: issue DLID for documents without ID, section DLIDs and anchor lines for all headings, candidate presentation for duplicate IDs, and DLID added to link titles during migration"
      - "index-docs responsibilities: target confirmation, ID check excluding documents without ID or with duplicate ID, diff detection, toc-updater requests only for documents needing generation, reference scan, and one batch ToC confirmation"
      - Check SKILLs detect and return without changing managed state, including ToC mismatch for check-toc, broken references and path or fragment mismatch with current path or anchor for check-links
      - check-impact returns changed documents with arrays of direct referrers only, excludes indirect referrers, and detects propagation one step at a time
      - Sequence diagrams per SKILL, including query-docs branches for unbuilt, undeterminable and rebuild-required states with the user choice
      - "Agent exchange: script-generated identifier values, script writes request and result, result read by absolute path, normal exit value is 0, and files removed after processing"
    applicable_tasks:
      - Implementation of embed-dlid, index-docs and query-docs SKILLs with script delegation
      - Implementation of check-dlid, check-links, check-toc and check-impact check SKILLs
      - Implementation of toc-updater and query-worker request and result handling
      - Review of SKILL and Agent responsibility boundaries and write permissions
      - Creation of query-docs sequence and failure branch handling for the rebuild choice
