  docs/specs/design/DES-008_content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines design rules for reading and writing DLIDs in Markdown, parsing reference links and heading sections, computing content hashes, and AI-generated ToC fields.
    content_details:
      - Frontmatter delimiter detection and minimal top-level doc_link_id reading that tolerates YAML syntax errors
      - "DLID format: 60-bit random value as 12-character lowercase Crockford Base32 with DLID- prefix, case-sensitive match"
      - "Write rules: only the DLID is written to frontmatter doc_link_id and heading ends, verified by re-parsing with markdown-it-py, written via atomic os.replace that keeps permissions and symlink targets"
      - "Reference link rules: CommonMark label matching, first definition wins, title whose last word is a DLID marks a formal reference, scheme URLs and images excluded"
      - Heading section scope runs from the heading to the next heading of same or higher level, with the section ID taken from the trailing DLID
      - Heading anchor generation equivalent to github-slugger v2.0.0, with duplicate suffixes -1, -2
      - Content hash is SHA-256 of raw UTF-8 bytes without normalization, excluding the title of formal reference definitions
      - Section content hash covers only the section range and is independent of the issued DLID and the ToC-recorded hash
      - AI-generated field limits L with validator upper bound floor(L x 1.3) hidden from the model, minimum counts 5 / 1 / 5, values written in English
