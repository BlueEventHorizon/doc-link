  docs/specs/design/DES-007-references-impact.md:
    title: DES-007 Reference Checks and Change Impact Notification
    purpose: Defines DLID-based formal reference extraction, directory-scan reference check results, reverse reference construction, and change impact candidate notification with processed baselines.
    content_details:
      - "Formal reference: Markdown link whose title last word is a DLID; reference source ID, position, target ID and relative link path are kept separately"
      - "Reference check results: match, path mismatch within the same directory, absent in the specified directory, and fragment mismatch against current anchors"
      - "Target resolution: relative link path resolved and the specified directory scanned; unreadable directory treated as absent"
      - Duplicate DLID found in the scanned directory is a duplicate diagnosis, not an inferred current path
      - Path mismatch fix target is notified only when the same ID instance is uniquely confirmed by the scan
      - Reverse references built from scanned sources; change candidates from content hash changes of document or section DLIDs
      - Impact notification returns changed document, referring sources and scanned range; doc-link does not judge fix necessity or edit links
      - Processed baseline kept per pair of target DLID and source ID or no-referrer, advanced only when reported; ToC confirmation alone does not advance it
