    title: DES-004 State Machines and Permitted Transitions
    purpose: Defines the permitted state transitions of the ToC public state, ToC build and rebuild runs, embed-dlid runs, and check-impact runs, and states that the transition tables are normative for what the script accepts.
    content_details:
      - ToC public state transitions P-01 to P-03 between Unbuilt and Published, where a failed candidate never replaces the published version
      - ToC build and rebuild run transitions B-01 to B-09 from scope fixing through candidate inspection to Finished or Failed
      - "Failure rule B-08: a failed stage publishes no candidate and keeps the previous published version"
      - Reference inspection result classes match, path mismatch, and absent in the designated directory, recorded as results that do not block confirmation (U-020)
      - "Freshness rule: later changes to source files do not automatically update saved inspection results"
      - embed-dlid run transitions E-01 to E-07 including the duplicate DLID branch that waits for original confirmation
      - E-05 is the only transition that writes DLIDs into managed Markdown
      - check-impact run transitions N-01 to N-05 where only N-03 advances the processed comparison baseline
      - Test coverage requirement in DES-009 for every permitted transition, guard failure, unlisted event, and retry
