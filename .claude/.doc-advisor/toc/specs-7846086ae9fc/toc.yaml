      - Change set classes for new, target removed, ID path change, content hash change, and reference or physical path change
      - Section-level change detection by section ID as added, removed, moved, heading changed, or body changed
      - Atomic publication through temporary files and os.replace, keeping the previous confirmed ToC on failure
