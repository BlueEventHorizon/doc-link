  docs/specs/design/DES-004-state-machines.md:
    title: State Machines and Permitted Transitions
    purpose: Defines permitted state transitions for the ToC published version, ToC build runs, ID embedding runs, and check-impact reporting; scripts reject transitions outside the tables.
    content_details:
      - ToC published version states Unbuilt and Published with transitions P-01 to P-03 and the rule that failed candidates are never published
      - ToC build run transitions B-01 to B-09 from Started through scope, ID, change, data, reference check, and candidate stages to Finished or Failed
      - Reference check result classes match, path mismatch, and absent in the specified directory, with a fragment reachability flag
      - On build failure the previous published version is kept and already confirmed document information is not returned
      - ID embedding run transitions E-01 to E-07 where DLID is written only in E-05 after re-parse confirms only DLID differences
      - Duplicate DLID handling through E-03 original confirmation wait and E-04 original decision
      - check-impact transitions N-01 to N-05 where the comparison baseline is advanced only at N-03
      - Test coverage requirements for every permitted transition, guard failure, unlisted event, and retry, referenced to DES-009
