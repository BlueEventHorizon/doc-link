      - "FR-009 link checks: DLID in title, file with that DLID found in the specified directory, path matches current path, relative path resolves, fragment resolves to anchor or heading"
      - Directory search completed without a DLID match is recorded as absent in the specified directory, not as nonexistence
      - FR-010 path correction notice only when a real directory search confirms the current path; never guessed from saved data; doc-link does not update link definitions
      - "Section 13.1 section ID: every heading line ends with a section ID issued only by the DLID assignment operation"
      - "FR-013 change impact candidates: reverse lookup of direct references whose recorded content hash differs from the current hash, including references without a recorded hash"
      - "FR-014 and FR-015 notification: changed ID, hash values, direct referrers, reference text and scanned scope; no notification state stored; repeated until the caller rewrites the recorded hash"
      - "FR-016 integrity inspection: missing doc IDs, headings without section ID, duplicate IDs, broken references, path and fragment mismatches, ToC-file mismatches"
      - "Rewrite confirmation: the caller shows document, line and value to the user and rewrites only approved items; check-links does not rewrite documents"
