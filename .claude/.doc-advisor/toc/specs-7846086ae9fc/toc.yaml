  docs/specs/design/DES-004-state-machines.md:
    title: DES-004 State Model and Permitted Transitions
    purpose: Defines the separated states of ToC publication, ToC build and rebuild runs, DLID embedding runs, and impact reporting runs, with the permitted transitions, guards, and failure outcomes that the script must enforce. Rejected transitions change nothing.
    content_details:
      - "ToC publication state per key: Unbuilt or Published with a confirmed version, transitions P-01 to P-03"
      - ToC build run states B-01 to B-09 from start through scope, ID confirmation, change set, data, reference check, candidate check, to finished or failed
      - Build run writes no managed Markdown; ID embedding is a separate operation
      - DLID embedding run states E-01 to E-07; only E-05 writes DLIDs into Markdown under a per-document lock with a diff check
      - Impact reporting run states N-01 to N-05; only N-04 advances the processed comparison baseline
      - "Reference check result classes: match, path mismatch, absent within specified directory, check impossible, retained with directory and check time"
      - Retry after failure (B-09, E-07) re-evaluates incomplete processing; already written DLIDs are not rolled back
      - Transition table is normative; transitions absent from the table are rejected without changing the confirmed version or baseline
    applicable_tasks:
      - State machine implementation for ToC build and rebuild
      - Implementation of DLID embedding run states and failure handling
      - Review of permitted transitions and guards for impact reporting
      - Design of retry and failure recovery for build runs
      - Test design for transition table coverage
