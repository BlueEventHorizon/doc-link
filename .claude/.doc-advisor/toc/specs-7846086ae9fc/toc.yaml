  docs/specs/design/DES-010-skill-composition.md:
    title: DES-010 SKILL and Agent composition
    purpose: Defines the seven SKILLs and two custom Agents (toc-updater, query-worker) that compose doc-link, their responsibilities, the sequence of each SKILL, and the data exchange rules between SKILLs and Agents
    content_details:
      - Composition table of seven SKILLs (embed-dlid, index-docs, query-docs, check-dlid, check-links, check-toc, check-impact) with kind, managed Markdown writes, and managed state writes
      - Only check-impact writes managed state among the inspection SKILLs, advancing the processed comparison baseline for each (changed document, direct referrer) pair
      - "Responsibilities of embed-dlid: issuing DLIDs, writing frontmatter and section anchor lines, resolving duplicate IDs with the user, and migrating existing links"
      - "Responsibilities of index-docs: target confirmation, diff detection, toc-updater requests, reference scan, and batch confirmation of the ToC version"
      - "Responsibilities of query-docs: pre-search check with unbuilt, rebuild-needed, undecidable outcomes and the two-choice rebuild confirmation"
      - Detected states and follow-up actions of check-dlid, check-links, check-toc, and check-impact, including the current path and current anchor hints
      - check-impact returning the same result as check-toc when the ToC is stale, and reporting only direct referrers
      - toc-updater generates purpose, content summary, applicable tasks, and keywords per document with only the length limit L as validation
      - query-worker reads the confirmed ToC read-only and returns document IDs and reasons, with an empty set as its non-error outcome
