  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overall Design
    purpose: Defines doc-link system boundary, the write limit to DLID only, the operation table with inputs, outputs and write boundaries, the index-docs and check-impact sequence, and common invariants.
    content_details:
      - "System boundary: doc-link replaces DocAdvisor and handles document IDs, ToC, search, DLID resolution, reference checks, and change impact notification"
      - "Write limit: doc-link writes only DLID, in frontmatter doc_link_id and as a section ID at the end of heading lines; no link or link title writes (D-031, D-042)"
      - "Operation table: DLID assignment, ToC build, search, DLID resolution, reference check, change impact notification, integrity check, each with inputs, outputs, and write boundaries"
      - "ToC build order: target determination, ID check, change detection, data acquisition, reference check, candidate check, and confirmation; documents with missing or duplicate IDs are excluded and reported (D-036)"
      - "Sequence: index-docs builds the ToC, then check-impact runs as a separate operation only when a referenced document content differs from the referrer record"
      - Change impact notification changes nothing; the project management AI updates the referrer title content hash
      - "Common invariants: document IDs are independent of path, body, and key and are never reissued for path or body changes alone"
      - Reference existence is never asserted without a real directory scan of the recorded path
      - Partial ToC candidates are never published as confirmed state; updating one key never changes another key ToC
      - Unreadable reference directories are recorded as absent and do not block ToC confirmation (D-025)
