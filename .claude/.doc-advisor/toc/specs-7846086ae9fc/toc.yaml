    title: "doc-link Requirements: ToC Management"
    purpose: Defines the information doc-link manages in each ToC, including document info, section and reference entries, AI-generated field limits, hash-based change detection, and the rebuild and confirmation flow.
    content_details:
      - "ToC information requirements: document info with document ID, current path, title, purpose, summary, applicable tasks, keywords, content hash, sections, references, and check state"
      - Saved normalized Index target specification per ToC that is re-interpreted at search time, and a differing specification forces a rebuild
      - Section entries with a section ID on every heading and a section-level hash computed from the raw section text
      - Reference entries built from formal references, with referrer document ID, target document ID, title-recorded content hash, and reference kind
      - "AI-generated field limits: purpose up to 200 characters and arrays up to 10 items, with a tolerance kept out of generation instructions and counted in Unicode code points"
      - "Change categories: new, body change, reference change, move or rename, removal from Index target, and unchanged"
      - Content hash as SHA-256 of raw text without normalization, excluding the title of formal references, and a reported hash updated only on confirmation
      - "Rebuild order: confirm document IDs, build the change set against the existing ToC, fetch only needed information, then confirm the candidate ToC as a whole"
      - Reference check by real directory search, where a missing target is recorded and does not block rebuild, and a failed candidate keeps the last confirmed ToC
      - Acceptance criteria AC-001, AC-002, AC-010, AC-011, AC-017, AC-018, AC-020, AC-026, and AC-027 on move handling, rebuild, and failure safety
