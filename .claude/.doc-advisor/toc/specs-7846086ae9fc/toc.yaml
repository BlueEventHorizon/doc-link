  docs/specs/requirement/REQ-002-document-id.md:
    title: doc-link Requirements Managed Documents and Document ID
    purpose: Defines managed Markdown targets per management key and desired-state specification, and the rules for issuing, validating and assigning document IDs stored as doc_link_id in frontmatter
    content_details:
      - Management key as opaque key with desired-state target specification and DocAdvisor-compatible arguments such as --paths, --dirs, --exclude and --all
      - Documents absent from the new target set leave the key ToC without scanning outside the target scope
      - Rules forbidding guessing document type from key names, and rejecting --key all and target specification without a key
      - doc_link_id frontmatter key with DLID- prefix and 12-character lowercase Crockford Base32 value part
      - ID issuance only by the ID assignment operation, with collision check against existing IDs before saving
      - Document ID never recomputed from body, filename, path, title or summary
      - Missing, null, empty or unrecognized doc_link_id classified uniformly as document ID does not exist
      - Duplicate ID detection and original candidate judgment by recorded path, creation time and recorded content hash
      - ToC build confirmation stage that excludes documents without ID or with duplicate ID and reports them by path
      - "ID assignment operation steps: issue IDs, write section anchors and add DLID to reference link titles"
