  docs/specs/design/DES-005-indexing.md:
    title: DES-005 Target Confirmation, ID Assignment, and ToC Build Design
    purpose: Defines the design of target confirmation, DLID assignment, change set classification, candidate validation, and document-level locking for building a ToC, including its input-output boundary and rerun behavior.
    content_details:
      - "Build inputs: management key, complete target specification, target Markdown, last confirmed version, processed comparison baseline; outputs: confirmed version or diagnostics, unreported changes, reference check results"
      - Target confirmation expands directory patterns and exclusions; documents without doc_link_id or with duplicate IDs are excluded and reported, and read failures stop progress
      - ID assignment runs separately from build, is started explicitly, and that start counts as write approval
      - "Duplicate ID original resolution order: current path, file creation time with newer treated as copy, content hash; user confirms the original"
      - "New DLID generation: 60-bit random value as 12-character Crockford Base32, checked against IDs of all keys and the scanned set"
      - "Change set kinds recorded independently: new, target departure, path change with same ID, body comparison value change, reference and physical path change"
      - Candidate check covers ID uniqueness, target correspondence, reference and backlink consistency, required fields; only a checked candidate is published at once
      - Document information rows updated under a per-document lock with hash recomparison after the lock is acquired; lock rows stored in SQLite; forced release needs user confirmation
      - Key lock taken at build start and document locks taken after it, fixed order to avoid deadlock
      - Reference absence, path mismatch, and check impossible are recorded as candidate results, not build failure
