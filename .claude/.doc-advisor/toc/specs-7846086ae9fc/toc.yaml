  docs/specs/requirement/REQ-005_references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for document ID based references, link checks, change impact candidate listing and notification, section references, and integrity checks; doc-link never writes to user documents except DLIDs
    content_details:
      - "Markdown reference format: the reference definition title holds the referenced content hash and DLID, with the DLID as the last word"
      - "Link check: DLID in title, unique match in the searched directory, path matches current path, relative path resolves from the referencing document"
      - "Fragment check: fragment resolves to an explicit anchor or heading anchor, or to the section whose section ID is in the title"
      - "Path mismatch notice: referencing ID, referencing path, problem location, old path, and confirmed current path, without guessing paths from saved data"
      - "Section references: every heading carries a section ID issued only by the DLID issuing operation, and a section's scope runs to the next heading of same or higher level"
      - "Change impact candidates: referencing documents found by reverse lookup when the current hash differs from the hash recorded in the title, including references with no recorded hash"
      - "Notification content: changed ID and location, compared hashes, referencing ID and location, reference text, and scanned scope"
      - "Repeated reporting: no notification state is stored, so the same reference is reported until the project management AI rewrites its title hash"
      - "Integrity checks: missing IDs, headings without section IDs, duplicate IDs, broken references, ToC and file mismatch, and hash mismatch"
      - "Write boundary: doc-link writes only DLIDs, and the project management AI rewrites links after listing document, line, and value for user confirmation"
