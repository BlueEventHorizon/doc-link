    title: DES-001 System Overview Design
    purpose: Defines doc-link system boundary, its operations with inputs, outputs and write boundaries, the ToC build and impact-check sequence, and common invariants.
    content_details:
      - "System boundary: replaces DocAdvisor and takes a complete desired-state target set from the caller, without reading Forge config directly"
      - DLID write positions limited to frontmatter doc_link_id, heading anchor line, and reference link title attribute
      - "Operation table: ID assignment, ToC build and rebuild, document search, reference check, change impact notice, consistency check"
      - ToC build does not rewrite managed Markdown; only doc-link management state is committed
      - "ToC build order: target resolution, ID check, change detection, information acquisition, reference check, candidate check, commit"
      - Unreadable reference destination is recorded as absent and does not block confirmation
      - "Common invariants: ID independent of path, body and key and never reissued for a change reason alone"
      - No partial candidate ToC is published as the current confirmed state; key update leaves other keys untouched
