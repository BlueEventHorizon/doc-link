  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines the responsibilities and write permissions of the caller, doc-link skills, deterministic scripts and AI roles, the logical script operations with their failure rules, and the rules that connect skills to scripts.
    content_details:
      - "Responsibility table: the caller passes the ToC identification key and target specification, the doc-link skill orders scripts and internal AI, only scripts write DLID, and the information generation AI and search AI have no write rights"
      - "Logical script operations: target expansion, ID check, DLID assignment, comparison value retrieval, difference judgment, reference extraction and check, AI output validation, candidate check and commit, DLID resolution and consistency check"
      - Search relevance is judged by a read-only search AI custom agent reading the ToC; scripts supply the version, key, document ID and path
      - Skills run inheritance-type in the caller context, and a script rejects forbidden transitions regardless of a prior success claim
      - The information generation AI receives only the target document content and the public limit L; the internal upper limit H is never passed to it
      - The change impact notice mechanically lists changed documents and known referrers without judgment; a re-check after the project AI fix is a new operation
      - An interrupted DLID assignment keeps issued IDs fixed and reuses them on rerun; verified writes are not rolled back
      - Managed state is stored as JSON files, one per document and one per key, written with fixed byte output and temporary files under .temp/doc-link
    applicable_tasks:
      - Responsibility assignment review for doc-link skills and scripts
      - Implementation of script operations for ID check and reference check
      - Design review of skill-to-script connection rules
      - Modification of AI output validation and information boundary handling
