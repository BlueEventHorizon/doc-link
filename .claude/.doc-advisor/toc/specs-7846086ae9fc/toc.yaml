  docs/specs/design/DES-003-data-model.md:
    title: Logical Data Model (DES-003)
    purpose: "Defines the logical data model of doc-link: document identity, document info, references, inspection results, confirmed ToC versions, processed comparison baselines, builds and document locks."
    content_details:
      - "Logical information table: document identity (doc_link_id), management target spec, observation, document info, reference description, reference inspection result, confirmed ToC version, processed baseline, build execution, document lock"
      - Document info is stored as one row per doc_link_id and not copied per key; all keys reference the same latest row (D-024, old R-001)
      - "Confirmed ToC version holds only per-key index state: membership, reference relations, reflected hash, inspection results"
      - Processed baseline is keyed by section or document ID x referrer ID, independent of the reflected hash and of the scan key (old R-002)
      - Document lock per target (document ID, or path if unassigned) with holder build ID, stage and timestamps; one build holds at most one lock; forced release needs user confirmation (old R-004)
      - "Multiplicity: a document belongs to several keys, has several references, and reverse references are derived only from registered referrers"
      - At most one confirmed ToC version per key, none before the first build; candidate versions are never public
      - Section identified by the DLID placed directly above its heading; heading text is never a permanent ID (D-033)
      - A path-only change of a link target does not count as a body change; reference comparison values detect path changes (D-039)
      - Inspection match holds only for the recorded directory and time; document and reference target freshness are independent; documents leaving scope are removed from the confirmed version
    applicable_tasks:
