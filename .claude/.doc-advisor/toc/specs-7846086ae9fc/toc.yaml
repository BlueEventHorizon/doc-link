  docs/specs/design/DES-006-search.md:
    title: Document Search Design
    purpose: Defines the pre-search freshness check with three outcomes, the user choice when rebuild is needed, and the result contract for document candidates returned by the read-only search worker.
    content_details:
      - Pre-search check classifying results as rebuild not needed, rebuild needed, or undeterminable by comparing IDs, paths, and comparison values with the published version
      - Undeterminable result when target expansion or file reading fails, treated as a failure that stops search and never as up to date
      - Rebuild scale counts shown to the user for new, removed, path changed, content changed, missing ID, duplicate ID, and AI generation needed
      - "Two user choices when rebuild is needed: rebuild then search, or search the existing version marked as possibly stale"
      - Search result contract where each candidate carries DLID, recorded path, relevance reason, optional section, key, ToC version, and freshness judgment
      - Read-only search worker judging semantic relevance over the whole ToC, casting broadly to avoid omissions, and never modifying ToC or management state
      - Stale-version search using key-level index state while document info is shown at its latest version
      - Frontmatter parse failure treated as missing ID, and disappearance of a target directory classified as rebuild needed
