  docs/specs/requirement/REQ-005-references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for formal document references by DLID in Markdown link titles, link inspection against real directory search, notification of stale link paths, change impact candidate listing, reference queries, and integrity checks.
    content_details:
      - "FR-007 formal reference: Markdown link whose title ends with a DLID, targeting a document DLID or section DLID, with no same-key or managed-status requirement (D-032)"
      - "FR-009 link inspection: derive target directory from link path and verify DLID presence, matching path, and relative path resolution by real directory search, not stored ToC or DB records"
