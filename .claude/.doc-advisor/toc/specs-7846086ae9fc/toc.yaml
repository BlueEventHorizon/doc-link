  docs/specs/design/DES-008_content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines document ID read and write rules, Markdown reference parsing and heading anchor generation, content hash computation with formal reference title exclusion, and limits for AI generated fields.
    content_details:
      - Frontmatter detection and minimal top-level read of doc_link_id, with DLID format of DLID- prefix plus 12 lowercase Crockford Base32 characters
      - Write limited to frontmatter doc_link_id and heading ends, verified by re-parsing with markdown-it-py
      - Atomic write via temporary file and os.replace, keeping file permissions and writing through symlinks to their targets
      - "Reference definition rules following CommonMark: first definition wins, label case fold, decoded title and href"
      - Formal reference as a reference definition whose last title word is a DLID, with recorded content hash and location
      - Section range from a heading to the next heading of same or higher level, with section ID from the last heading word
      - Heading anchor generation matching github-slugger v2.0.0, with duplicate suffixes -1 and -2
      - Content hash as SHA-256 of raw UTF-8 bytes, recorded value as first 12 characters, formal reference title excluded
      - Test vectors for hash changes on body, heading, and link edits, and hash stability under title rewrites and quote style changes
      - "AI generated field limits: title from first H1, content details at least 5, applicable tasks at least 1, keywords at least 5, validator bound floor of L times 1.3"
