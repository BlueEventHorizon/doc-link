  docs/specs/design/DES-008-content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines reading and writing of document IDs, Markdown reference parsing and positions, comparison values and hashing, and generation rules for AI-written ToC fields.
    content_details:
      - Reading DLID from frontmatter doc_link_id; missing, empty, null, unparseable, or unrecognized values are all classified as no document ID
      - DLID format is a 60-bit secrets random value in 12 lowercase Crockford Base32 characters with DLID- prefix, matched case-sensitively
      - Writable positions limited to frontmatter doc_link_id, the heading anchor line, and the reference link title suffix
      - Post-write re-parse with markdown-it-py verifies only the designated DLID diff, otherwise the write is rolled back and reported (D-031)
      - Formal references taken from inline and reference link definition titles whose last word is a DLID (D-032)
      - Section DLID taken from the anchor line before a heading, with range up to the next heading of same or higher level (D-033)
      - Migration resolves heading anchors by GitHub rules; unresolvable links are reported without adding a DLID (D-034)
      - Comparison values distinguish document ID, relative path, reference description, and body semantic content; ID issuance is independent of content comparison
      - AI-generated fields (title fallback, purpose, content details, applicable tasks, keywords) with per-field limits pending (U-013, U-014)
