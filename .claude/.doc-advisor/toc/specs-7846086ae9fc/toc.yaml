  docs/specs/design/DES-008-content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Value and Generated Information Rules
    purpose: Defines how doc-link reads and writes DLID values in Markdown, computes the content comparison value by SHA-256 after removing management-only text, and constrains AI-generated ToC fields.
    content_details:
      - DLID read from frontmatter doc_link_id as a single case-sensitive DLID-prefixed 12-character string; missing or unrecognizable values classified as no document ID
      - Issued ID is a 60-bit random value from secrets encoded as lowercase Crockford Base32 (decision U-001)
      - Only DLID is written, at frontmatter doc_link_id, heading anchor line or reference link title; code and HTML blocks excluded
      - Post-write re-parse with markdown-it-py verifies only intended DLID positions changed, otherwise the write is rolled back
      - Formal references are links whose title ends with a DLID; section range runs to the next heading of same or higher level
      - Relative link paths resolved from the referrer file location; target ID and physical path never propagated to each other
      - Heading anchors resolved by GitHub-compatible slug rules during migration; unresolvable links reported without adding a DLID
      - Content comparison value is SHA-256 of UTF-8 text after removing DLID writes; link path-only edits and newline differences do not change it
      - Removal uses markdown-it-py token positions for frontmatter, anchor HTML block and link title, then re-parses to verify
      - AI-generated fields limited by per-field length L with a hidden validator tolerance; the hard boundary is not disclosed to the generating AI
    applicable_tasks:
      - Implementation of DLID read and write logic for frontmatter, anchor line and link title
      - Implementation of markdown-it-py based reference and section range parsing
      - Implementation of content comparison value calculation
      - Creation of test vectors for comparison value invariance and change detection
      - Review of write-back verification and rollback behavior
      - Implementation of length and count validation for AI-generated ToC fields
    keywords:
