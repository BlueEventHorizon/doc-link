  docs/specs/design/DES-001-system-overview.md:
    title: DES-001 System Overall Design
    purpose: Defines the doc-link system boundary, the operation-level inputs and outputs with their write boundaries, the ToC build and search and reference-check and change-impact flows, common invariants, and items left undecided in this document.
    content_details:
      - System boundary - doc-link manages document IDs, ToC, search, reference checks and change-impact notification for Markdown, with the target set given by the caller as a complete desired state
      - Write boundary - doc-link writes only the DLID to frontmatter doc_link_id, the heading anchor line and the reference link title attribute (D-031)
      - Operation table - ID assignment, ToC build and rebuild, document search, reference check, change-impact notification and consistency check, each with main inputs, downstream results and write boundary
      - ToC build order - target resolution, ID check, change detection, information acquisition, reference check, candidate check, commit, with documents lacking or duplicating IDs excluded and reported (D-036)
      - Sequence - index-docs builds the ToC, and check-impact runs as a separate operation only when unreported changes exist
      - Common invariants - IDs are independent of path, body and key and are not reissued for change reasons; unconfirmed partial ToC is never exposed; confirmed ToC hash and impact baseline are kept separate
      - "Reference scope - reverse references and impact reporting stay within registered referrers, and a key update does not touch other keys' ToC"
      - Undecided scope - storage (SQLite with per-document lock), search-time reference recheck freshness and scan failure handling are decided in individual design documents
    applicable_tasks:
