  docs/specs/design/DES-005_indexing.md:
    title: DES-005 Target Confirmation, DLID Assignment, and ToC Build Design
    purpose: Defines how doc-link confirms Index targets per key, assigns DLIDs and section IDs, computes change sets, and builds and atomically publishes the confirmed ToC.
    content_details:
      - "Build input and output boundary: key, complete target spec, target Markdown, last confirmed ToC; outputs the new confirmed ToC or failure diagnostics, change set, and reference check results"
      - "Argument validation: --paths and --paths-json, --dirs and --dirs-json, --exclude and --exclude-json combine; target specs require --key; --all and --paths-file exclusive rules"
      - "Path expansion: NFC normalization, glob patterns in --dirs where ** matches zero or more directory levels, exclude matching by bare name or path with pattern support"
      - Fixed exclusion of named directories such as .temp during walks and --dirs expansion, not applied to explicitly given file paths; .md extension matched case-insensitively
      - Symlinks followed and counted once by resolved project path; files outside the project are read, and DLID writes go to the real file location
      - "DLID assignment operation: 60-bit random Crockford Base32 12-character IDs issued by script, section IDs issued for every heading line end, duplicate DLID check limited to the scanned set"
      - "Change set categories: new, target removal, same-ID path change, content hash change, reference or physical path change, and section add, delete, move, heading change, body change matched by section ID"
      - "Candidate validation before publish: ID uniqueness, target list correspondence, reference and back-reference consistency, required fields; atomic publish via os.replace keeps the old ToC on failure"
      - Unchanged documents reuse verified document info; only new or content-changed documents are regenerated by AI, with script checks on required values and length
