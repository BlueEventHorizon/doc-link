  docs/specs/design/DES-002-execution-responsibilities.md:
    title: Execution Responsibilities and Processing Duties (DES-002)
    purpose: Defines the responsibilities and write permissions of each executor (caller, doc-link Skill, deterministic scripts, content generation AI, search AI, user) and the logical operations scripts provide, with their failure promises and Skill-script connection rules.
    content_details:
      - "Responsibility table per executor: caller provides key and target spec, Skill orders scripts and AI, scripts own DLID writes and management state, generation AI produces summaries without changing IDs or ToC, search AI reads confirmed ToC only"
      - "Logical script operations: target expansion, ID check, ID assignment, comparison value retrieval, diff judgement, reference extraction and check, AI output validation, candidate check and commit, search and reverse lookup, baseline update, consistency check"
      - Each operation has defined inputs, success results and side effect or failure promises
      - "Duplicate ID handling: user confirms original, copy receives new ID after confirmation"
      - Skills are inherited (run in caller context); generation AI is the only part split into a separate context
      - Generation AI input is limited to target content and public length limit L; internal limit H is never disclosed to it
      - "Impact notification: scripts list changed documents and known referrers mechanically without AI judgement on fix necessity"
      - After project AI fixes documents, re-check is a new operation; doc-link never edits body or links directly
      - After partial DLID write failure, written IDs are kept and reported as issued, not rolled back
      - Management state is stored in SQLite via Python sqlite3 standard library
    applicable_tasks:
      - Design review of executor responsibilities and write permissions
      - Implementation planning for script operations and their failure handling
      - Modification of Skill-to-script connection rules
      - Review of the generation AI context boundary and internal limit H isolation
      - Verification of the change impact notification scope and its no-judgement rule
