  docs/specs/requirement/REQ-005_references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: "Specifies reference and link inspection requirements (FR-007, FR-009, FR-010, FR-013 to FR-016): ID-based links, path checks, section IDs, change impact notice, and integrity checks"
    content_details:
      - "Formal reference notation: a standard Markdown link whose title attribute ends with a DLID, pointing to a document DLID or a section ID, valid regardless of ToC key membership"
      - "Link inspection of formal references: DLID present in the title, target-ID file found in the specified directory, link path matches the current path, relative path resolves from the source"
      - "Fragment check: fragment resolves to an explicit anchor or heading-generated anchor in the target, and to the section heading when the title is a section ID"
      - Directory not found or not searchable is recorded as target absent within the specified directory, which does not stop ToC confirmation
      - Path-mismatch notice to the project management AI with source ID, source path, problem location, stale path, and confirmed current path, sent only when directory search confirms the current path; doc-link never edits link definitions
      - "Section reference design: section ID anchor line before every heading, issued and written only by the ID assignment operation, section range runs to the next heading of same or higher level"
      - Change impact candidate listing by reverse lookup of extracted references, one level per detection, with changed item, hash pair, direct referrers, and reference text; no judgment on whether referrers need fixes
      - "Change impact notice content: changed document ID and location, compared values, referrer IDs and locations, reference text, and scanned scope; report records of hash, enumerated referrers, scope, and result"
