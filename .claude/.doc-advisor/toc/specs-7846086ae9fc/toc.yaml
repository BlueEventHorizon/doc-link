  docs/specs/design/DES-003-data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines logical information of doc-link (document ID, references, check results, confirmed ToC, processed baseline), their relations, multiplicities and value freshness, without physical schema.
    content_details:
      - "Information table: document identity by doc_link_id, managed target observation, document info, reference description, reference check result, confirmed ToC version, processed baseline, build execution"
      - Document info is stored once per doc_link_id and not copied per key; the ToC holds only per-key index state
      - Processed baseline is keyed by DLID and referrer ID, is independent of the ToC hash, and is removed when a document belongs to no key
      - "Multiplicity: a document may belong to several keys; a document may have several reference descriptions; a key has at most one confirmed ToC version"
      - Sections are identified by the DLID of their heading anchor; a section without DLID has no stable identity and heading text is not a permanent ID
      - Reverse references are derived only from registered referrers, not an exhaustive list of all references
      - Document ID is fixed at issuance while content hash changes with the observed source, including link path changes
      - "Reference check result 'match' holds only for the recorded directory and check time; current correctness needs a re-scan"
      - "Documents leaving management are dropped from the key's confirmed ToC without searching outside the scope"
    applicable_tasks:
      - Data model design review for doc-link
      - Implementation of confirmed ToC version and processed baseline storage
      - Review of document info identity and key sharing rules
      - Verification of reference check freshness handling
