    title: Requirement Coverage and Design Verification (DES-009)
    purpose: Defines the test norms for state-transition tables and for check-impact, check-links and reference behavior, and maps each requirement to its design element and acceptance criteria
    content_details:
      - "Test norm: each row of the DES-004 transition table is tested for source state, event, guard and expected next state and effect"
      - Rejection tests for failed guards, unlisted events and events from other states, verifying the confirmed ToC is unchanged
      - Absent reference targets are recorded as absent so the candidate confirmation guard still passes (decision U-020)
      - "check-impact checks: no writes, mismatched and unrecorded hashes returned, same reference returned until the record is rewritten"
      - Rewriting only the recorded hash does not cascade notifications and does not make check-toc report a stale ToC
      - DLID references respond to any change in the document, section ID references only to changes in that section range
      - "check-links tests: inline links with DLID titles are reported, and the title word before the DLID is read as a record only in the recorded word form (D-058)"
      - Requirement-to-design traceability table mapping FR and NFR items to DES-002 through DES-008 with acceptance criteria numbers
