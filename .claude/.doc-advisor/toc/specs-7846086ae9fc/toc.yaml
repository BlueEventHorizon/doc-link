  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines duties and write permissions of each executor (caller, doc-link Skill, deterministic scripts, information generation AI, search AI, user), the logical operations scripts provide, and Skill-script connection rules.
    content_details:
      - "Executor table: caller and project management AI, doc-link Skill, deterministic scripts, information generation AI, search AI, and user, with duties and write prohibitions for each"
      - Scripts write only DLID (frontmatter and end of heading lines) and doc-link management state; DLID writes are limited to the DLID assignment operation
      - "Logical operation table: target spec expansion, ID check, DLID assignment, comparison value acquisition, difference judgement, reference extraction and check, AI output validation, candidate check and confirmation, search and reverse lookup, DLID resolution, integrity check"
      - AI output validation rejects generation results against the internal limit H, which is never disclosed to the information generation AI
      - Skills run inheritance-type in the caller context; only the information generation AI is separated into another context
      - "Skill ordering rule: scripts verify input version and state and reject disallowed transitions, never advancing on a self-reported prior success"
      - "Change impact notification: scripts enumerate changed documents and known referrers mechanically; doc-link makes no fix-necessity judgement or fix proposal"
      - Management state is stored under .doc-link/ as JSON with deterministic output, split into one document info file per DLID and one confirmed ToC file per key
      - Temporary files go under .temp/doc-link/ inside the project; no files outside the project
      - If DLID assignment fails after partial writes, issued IDs are kept and reused on rerun; no rollback, and failures are reported per document
