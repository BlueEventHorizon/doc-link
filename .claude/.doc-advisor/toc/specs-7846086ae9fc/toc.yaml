  docs/specs/requirement/REQ-005-references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for ID-based document references, link path verification by directory search, change impact candidate notification, change report management, and integrity checks
    content_details:
      - "Reference notation: DLID placed in the title attribute of a standard Markdown link, with the last word of the title matching the DLID format (FR-007)"
      - Reference target may be a document DLID or a section DLID (D-032)
      - Link display text and path stay human-readable; path validity is checked by actual directory search
      - "Link check (FR-009): DLID present in title, file with the DLID found in the specified directory, link path matches current path, relative path resolves from the source document"
      - Directory search not finding the DLID is recorded as absent from the specified directory and does not block ToC confirmation (D-025)
      - "Path correction notice (FR-010): reported only when the current path is confirmed by directory search; never guessed from stored data; doc-link never updates link definitions"
      - "Section reference: section DLID anchor line before every heading, issued only by the ID assignment operation (D-035); section scope runs from a heading to the next heading of the same or higher level (D-033)"
      - "Change impact candidates (FR-013, FR-014): reverse lookup of direct referrers with reference text and scanned scope; no judgment on referrer changes, no indirect dependencies, referrers never modified"
      - "Change report management (FR-015): target document ID and hash, listed referrers and scope, and report execution result"
      - "Integrity checks (FR-016): missing IDs, headings without section DLID, duplicate IDs, broken references, links lacking DLID title, ToC and file mismatch, references not found in the searched directory"
    applicable_tasks:
      - Implementation of ID-based reference parsing and validation from Markdown link title attributes
      - Implementation of link path verification using directory search and path mismatch detection
      - Implementation of change impact candidate listing and notification to the project management AI
      - Implementation of integrity check listing covering FR-016 inconsistency types
      - Review of section reference design and section DLID placement rules
      - Review of acceptance criteria AC-003, AC-004, AC-006 through AC-009, and AC-028
      - Creation of test cases for reference correctness and path correction notification
    keywords:
      - DLID
      - title attribute
      - section DLID
      - directory search
      - path mismatch
      - broken reference
      - change impact candidate
      - reverse lookup
      - referrer
      - integrity check
