  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines the logical information model of doc-link, covering document identity, references, ToC confirmed versions, comparison baselines, and how their versions and freshness are handled.
    content_details:
      - "Logical information table: document identity by doc_link_id, managed target spec, observed targets, document info, reference descriptions, reference inspection results, ToC confirmed version, processed comparison baseline, and build execution"
      - Document info is stored once per doc_link_id as one file shared by all keys, and is not copied per key
      - ToC confirmed version holds key-specific index state such as membership, reference relations, reflected hash, and inspection results, and excludes document info
      - Processed comparison baseline is keyed by target DLID and referrer ID, independent of ToC hash and key membership, and removed when no key owns the document (D-046)
      - "Multiplicity: one key has several document IDs, one document belongs to several keys, one document has several reference descriptions, and each key has at most one confirmed ToC"
      - Section identity is the DLID of the anchor line before a heading, and sections without a DLID have no stable identity, so heading text is never a permanent ID (D-033)
      - "doc_link_id and content hash differ: the ID is fixed at issuance, while the hash changes with observed source, including link path fixes (D-039)"
      - Reference inspection match holds only for the recorded directory and inspection time, so current correctness requires a rescan
      - A document leaving the managed targets is removed from the key confirmed version without searching outside the scope
    applicable_tasks:
      - Data model review for ToC and document info storage
      - Implementation of per-ID document info files and key-specific index state
      - Design of processed comparison baseline keying and removal rules
      - Freshness and validity assessment of reference inspection results
      - Review of section identity handling for DLID-anchored headings
    keywords:
