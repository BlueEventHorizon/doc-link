  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Defines the pre-search judgement of whether a ToC rebuild is needed, the search result contract, the read-only search agent input, and DLID resolution against recorded paths.
    content_details:
      - "Pre-search judgement classes: rebuild not needed, rebuild needed, and undeterminable, where undeterminable is treated as a failure and never as either of the other two"
      - Confirmation choice between rebuilding then searching and searching the existing version, with counts of new, removed, path-changed, content-changed, unassigned-ID, duplicate-ID, and AI-generation-needed documents
      - "Search result fields: document ID, recorded path, relevance reason, section, key, ToC version, and freshness judgement"
      - Search agent input copy built from ToC and document information, excluding paths, content hashes, reference relations, and check results
      - Selection policy that favors not missing documents, so documents with uncertain relevance are included
      - "DLID resolution: document path from document information, section ID through all keys confirmed ToC entries, and all recorded parent documents kept as candidates"
      - Resolution returns the resolved path and content hash only on match, otherwise reports the recorded path as absent and does not search elsewhere
