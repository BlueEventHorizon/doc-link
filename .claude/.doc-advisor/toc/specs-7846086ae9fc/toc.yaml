  docs/specs/design/DES-002-execution-responsibilities.md:
    title: DES-002 Execution Responsibilities
    purpose: Defines which actor (caller, Skill, deterministic scripts, content AI, search AI, user) owns each responsibility, its write permissions, and the logical operations scripts provide with their failure promises.
    content_details:
      - Responsibility table for caller, doc-link Skill, deterministic scripts, content generation AI, search AI, and user with write permissions and prohibitions
      - Scripts are the only writers of DLID in frontmatter, anchor line, and link title; DLID writing is limited to the ID assignment operation
      - "Logical script operations: target expansion, ID check, ID assignment, comparison value fetch, diff judgement, reference extraction and check, AI output validation, candidate check and commit, search and reverse lookup, processed baseline update, consistency check"
      - Failed ID assignment keeps already written DLIDs and reports them as issued; re-run reuses them
      - check-impact advances processed baseline when returning its report, while check Skills never rewrite management state
      - Content AI input excludes internal acceptance limit H, coefficients and margin
      - Change impact notification enumerates referrers mechanically without judgement or fix proposal
      - Skills are inherited type running in caller context; only summary generation AI runs in a separate context
      - Management state stored in SQLite via Python standard sqlite3 module
      - Python scripts run through uv with PyYAML and markdown-it-py
