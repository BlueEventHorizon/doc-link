  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines which actor (caller, doc-link Skill, deterministic scripts, content generation AI, search AI, user) takes which responsibility and write permission, the logical operations scripts provide with their side effects and failure rules, and the connection rules between Skills and scripts.
    content_details:
      - "Responsibility table: caller provides key and complete target specification; Skill orders operations and internal AI; scripts own traversal, parsing, ID management, DLID resolution, diff, hashing, reference check, AI output validation and ToC candidate commit; content AI does not change ID, hash or ToC; search AI is read-only"
      - "Logical script operations: target expansion, ID check, DLID issuance, comparison value fetch, diff decision, reference extraction and check, AI output validation, candidate check and commit, search read, DLID resolution, notified hash update, consistency check"
      - On ID issuance failure, already written DLID is kept and reported, not rolled back, and re-run reuses it
      - "Skill and script connection rules: inherited Skill runs in caller context; content AI gets only the needed input with limit L and never the internal limit H"
      - check-impact advances notified hash only when it returns notifications; check operations never rewrite the management state otherwise
      - Management state is JSON under .doc-link/ split into per-ID document info, per-key confirmed ToC, and one notified hash file; output is deterministic UTF-8 with sorted keys
      - Temporary files go under .temp/doc-link/ inside the project
