  docs/specs/design/DES-006-search.md:
    title: DES-006 Document Search Design
    purpose: Defines the pre-search judgment that decides whether a ToC rebuild is needed, the search result contract with document IDs and freshness, and the re-scan of reference checks for search result documents.
    content_details:
      - Pre-search judgment returning no rebuild needed, rebuild needed, or undecidable, and the handling of each result
      - Initial build required instead of search when the key has no published ToC
      - User choice between rebuild then search and search on the existing version when a rebuild is needed, with rebuild scale counts
      - "Undecidable state treated as failure: search stops and reports targets and cause, and never falls back silently to the old version"
      - "Search result contract: DLID, recorded path, relevance reason, section, key, ToC version and freshness judgment"
      - Rule that a path from an old index is not asserted as the current physical path when the document was moved or deleted
      - Read-only search worker (custom agent) judging semantic relevance over the whole ToC with a recall-first policy
      - Search worker must not supply nonexistent IDs or modify the ToC or management state
      - Re-scan of reference descriptions only for documents in search results, and scan failure reported as unverifiable
