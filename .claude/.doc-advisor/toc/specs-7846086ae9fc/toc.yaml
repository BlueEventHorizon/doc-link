  docs/specs/design/DES-003-data-model.md:
    title: DES-003 Logical Data Model
    purpose: "Defines the logical information model of doc-link: document identity, references, reference check results, ToC confirmed versions, and processed comparison baselines, with their sources, relations and freshness."
    content_details:
      - Document identity keyed by doc_link_id, independent of path and key, with one row per document shared by all keys
      - "Reference record fields: referrer ID, location, target ID, stated path, optional section ID, one referrer may hold multiple references"
      - Reference check result tied to inspected range, observation time and result category
      - One confirmed ToC version per key, carrying target specification, document entries, references, reverse references and check status
      - Processed comparison baseline keyed by DLID and referrer ID, separate from ToC content hash and not keyed by management key
      - Baseline removal rule for documents that belong to no key and for sections no longer in ToC (D-046)
      - Sections identified by DLID placed immediately before headings; headings are never used as permanent IDs (D-033)
      - "Multiplicity rules: one key many IDs, one document many references, reverse references derived only from registered referrers"
      - "Freshness rules: reference check match valid only for recorded directory and time; document and target freshness are independent attributes"
      - Documents leaving a key are removed from its confirmed version without searching outside the target scope
