  docs/specs/requirement/REQ-003-toc.md:
    title: doc-link Requirements ToC Management
    purpose: Defines ToC information requirements, change detection against the existing ToC and processed hashes, ToC build with atomic confirmation, and length limits for AI generated fields
    content_details:
      - Information per ToC document entry including document ID, current path, title, purpose, summary, applicable tasks, keywords, hash, sections, references and check status
      - Information sources classified as user written, machine extracted, AI generated, or plugin managed, with the ToC storing a re-interpretable normalized target specification
      - Processed hash list kept separate from the ToC, advanced only after the change report completes, and removed entries retained until residual references are checked
      - Change categories new, body change, reference change, move or rename, removal from management and unchanged, which are not mutually exclusive
      - Logical content hash excluding managed frontmatter, reference definition physical paths, generated metadata, line endings and trailing spaces
      - Build order of document ID check, change set creation, then fetching only the needed information and updating the ToC
      - Reference check by actually searching designated directories, recording not found, path mismatch and unverifiable results without blocking the build
      - AI generated fields where the generator receives only the description limit L and the validator uses an internal allowance limit H equal to floor of L times 1.3 that is never disclosed
      - Reuse of existing summaries when the logical body is unchanged, with AI analysis skipped for unchanged documents
      - Partial failure handling where a ToC candidate is discarded and the last confirmed ToC is kept, never exposing intermediate state
