  docs/specs/design/DES-007_references-impact.md:
    title: Reference Check and Change Impact Notice Design (DES-007)
    purpose: Specifies formal reference extraction from DLID-bearing link titles, reference checks against scanned directories, reverse references, change impact candidates and the inconsistency check
    content_details:
      - Formal reference extraction from reference-link definitions whose title ends with a DLID, with an optional 64-character lowercase hex content hash before it
      - Reference record kept as referring ID, location, referenced ID and relative link path, with the fragment excluded from identity decisions
      - "Reference check outcomes: match, path mismatch within the directory, absence in the specified directory, and fragment mismatch resolved against the current anchor"
      - Path mismatch fix target notified only when the same ID is confirmed by a real scan, never inferred from saved paths
      - Value form for links without a DLID in the title, built from the document ID or section ID and the content hash read from the current file
      - Reverse references built from scanned referrers, with change detection by comparing the title hash record against the current hash in the confirmed ToC
      - Indirect referrers not listed, so indirect impact is detected one step at a time
      - Change impact notice drawn from confirmed ToC reference relations, returning changed ID, location, current hash, referrer and scan scope without judgment or edits
      - Notice state not held by doc-link, so the same reference is returned until the project management AI rewrites the title hash
      - Inconsistency check split into check-dlid, check-links, check-toc and check-impact skills, none of which rewrite management state
    applicable_tasks:
