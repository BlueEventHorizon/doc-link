      - "Section-level change detection by section ID: addition, deletion, move, heading change, and body change"
      - Candidate verification of ID uniqueness, reference consistency and required fields before atomic publication via os.replace, keeping the old ToC on failure
      - Document information saved once per document outside the batch publication, and not rolled back when construction fails later
