  docs/specs/design/DES-002-execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines responsibilities and write permissions of each actor (caller, Skill, scripts, generation AI, search AI, user), logical script operations, and Skill-script connection rules.
    content_details:
      - "Actor table: caller passes key and full target set; Skill orders operations; only scripts write DLID and doc-link management state"
      - "Prohibited actions: caller does not issue IDs or edit ToC directly; Skill does not overwrite ToC or check results with free text"
      - "Logical script operations: target expansion, ID check, ID assignment, comparison value acquisition, diff judgment, reference extraction and check, AI output validation, candidate check and commit"
      - "AI output validation: generation AI is never told the internal upper limit H, coefficient or margin"
      - Search AI is a read-only custom Agent that judges semantic relevance by reading the confirmed ToC
      - check-impact advances the processed baseline when it returns a report; other checks write no management state
      - Interrupted ID assignment keeps issued DLIDs without rollback and reruns to process the rest
      - Management state stored as JSON under .doc-link with one file per document ID, one per key, and one global processed baseline file
