  docs/specs/design/DES-003-data-model.md:
    title: DES-003 Logical Data Model
    purpose: "Defines the logical data model of doc-link: information identities, relations, versions and primary sources, and the multiplicity and freshness rules that bind them. Excludes physical storage schema."
    content_details:
      - Document identity by doc_link_id, independent of path and key
      - "Logical information table: document identity, management target specification, target observation, document information, reference description, reference check result, ToC confirmed version, processed comparison baseline, build execution, lock"
      - Document information stored once per doc_link_id as one row and not duplicated per key
      - Reference description keeps relative link paths without DLID to detect logical target changes (D-045)
      - Processed comparison baseline kept per referrer, independent of ToC hashes, retained after key departure until reported (D-046)
      - "Lock model: one document lock per document and one key lock per key, released on release, forced release needs user confirmation"
      - Section identity by DLID placed before the heading; headings without DLID are not stable identifiers (D-033)
      - Body hash and reference path comparison values kept separate; path-only link changes are not reported as body changes (D-039)
      - Documents leaving a key scope removed from its confirmed version without searching outside the scope
    applicable_tasks:
