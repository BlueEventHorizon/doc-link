  docs/specs/design/DES-004_state-machines.md:
    title: DES-004 State Machines and Allowed Transitions
    purpose: Defines the state model and allowed transitions for ToC build and rebuild runs, the confirmed ToC publication states, and embed-dlid DLID assignment runs. Search, resolve, and check are stateless.
    content_details:
      - "Public states of the confirmed ToC per key: Unbuilt and Published, with transitions P-01 to P-03"
      - ToC build run transitions B-01 to B-09, from scope fixing through candidate verification to publication or failure
      - "Failure rule: keep the previous confirmed ToC, publish no candidate, and report the failed document, field, and reason"
      - A failed build is not retried automatically and restarts only on an explicit re-run (B-09)
      - Reference check results (match, path mismatch, target directory absence) are recorded results, not run states
      - embed-dlid run transitions E-01 to E-07, including the original confirmation wait state for duplicate DLIDs
      - Only transitions from the plan-confirmed state write to Index target documents, and written DLIDs are not rolled back
