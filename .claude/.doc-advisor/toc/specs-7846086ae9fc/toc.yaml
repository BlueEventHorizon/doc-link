    title: doc-link Requirements Specification — Managed Documents and Document ID
    purpose: "Defines doc-link's managed Markdown files, the doc_link_id document ID format, target list confirmation, document ID checks, the ID assignment operation, and DLID resolution."
    content_details:
      - "Management key and target specification: --key, --paths, --dirs, --exclude, --all, with desired-state semantics per key (FR-017)"
      - "Rejected inputs: --key all, --all combined with targets, and targets given without --key"
      - "DLID format: DLID- prefix plus a 12-character lowercase Crockford Base32 value from a 60-bit random number (D-028)"
