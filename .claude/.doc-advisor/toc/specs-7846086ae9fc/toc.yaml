      - "Section entries: section DLID anchor placed before every heading and a section-level SHA-256 hash of the raw text"
      - Reference entries built from ID-based references whose target DLID is written in the link title attribute, with reference kind and inspection state
      - Processed-hash list keyed by document ID independent of management keys, kept until the change report completes, and purged only when no key still holds the document
      - Change kinds new, body change, reference change, move or rename, removal from management, and unchanged, which are not mutually exclusive
      - "Build order: confirm document IDs, compare with the existing ToC, acquire only the information needed, and commit the ToC all at once"
      - Reference inspection by searching the designated directory, with absence recorded as an inspection result and never blocking the ToC commit
      - "AI-generated field limits: purpose 200 characters and list fields of 10 items, with an internal tolerance of floor(L times 1.3) not disclosed to the generator"
      - Acceptance criteria AC-001, AC-002, AC-010, AC-011, AC-017, AC-018, AC-020, AC-026, AC-027
