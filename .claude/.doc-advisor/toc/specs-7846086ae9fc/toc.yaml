  docs/specs/requirement/REQ-005_references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Specifies DLID-based reference notation in reference-link titles, reference link checks, path mismatch notification, section references, change impact candidate notification, and integrity checks.
    content_details:
      - Formal reference notation in reference-link definitions whose title is content hash followed by DLID, with the last word as the DLID and the preceding 64-digit lowercase hex as the recorded content hash
      - Reference link check (FR-009) that searches the specified target directory and verifies the DLID, the path, relative path resolution, and fragment resolution to a heading or section ID
      - Path change notification (FR-010) that reports only paths confirmed by directory search and never guesses paths from stored data
