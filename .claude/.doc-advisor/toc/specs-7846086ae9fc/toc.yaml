    title: State Machines and Permitted Transitions
    purpose: Defines permitted state transitions for ToC publication, ToC build execution, ID assignment operation, and change impact reporting, plus freshness rules for reference check results.
    content_details:
      - ToC publication states unbuilt and published with transitions P-01 to P-03
      - Build execution transitions B-01 to B-09 from scope fixing through candidate verification to finalization
      - ID assignment operation transitions E-01 to E-07 including the original confirmation wait for duplicate DLIDs
      - Impact report transitions N-01 to N-05 and the rule that N-03 alone advances the processed baseline
      - Failed build keeps the previous published version and does not roll back committed document information rows
      - Reference check results match, path mismatch, or absent in specified directory, recorded with fragment reachability and inspected directory and time
      - Rule that the script rejects any event, guard, or state combination not in the transition tables
      - Rebuild required is a comparison judgment result, not a persistent ToC state
