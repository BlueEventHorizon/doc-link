  docs/specs/design/DES-008-content-rules.md:
    title: Markdown Parsing, Comparison Value, and Generated Field Rules Design
    purpose: Defines how document IDs are read and written, how Markdown structure and references are parsed with markdown-it-py, how SHA-256 content hashes are computed, and length limits for AI-generated ToC fields
    content_details:
      - "DLID recognition rule: exact match of DLID- prefix with 12 lowercase Crockford Base32 characters, case-sensitive, with issuance via secrets 60-bit random value"
      - Write positions limited to frontmatter doc_link_id, anchor line <a id=DLID-...> before headings, and reference link title attribute, with post-write re-parse verification
      - Section DLID from anchor line followed by heading, with section range from that heading to next heading of same or higher level
      - Formal reference extraction from inline and reference link titles whose last word is a DLID
      - Content hash as SHA-256 over raw UTF-8 bytes of document or section range, without normalization
      - Heading anchor resolution following GitHub slug rules for fragment verification
      - "Generated field length limits: generator receives only L, script validator accepts up to floor(L x 1.3)"
      - Frontmatter parse failure leads to report without writing
