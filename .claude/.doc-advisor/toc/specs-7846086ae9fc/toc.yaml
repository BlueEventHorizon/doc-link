  docs/specs/design/DES-008_content-rules.md:
    title: DES-008 Markdown Parsing, Comparison Values and Generated Information Rules
    purpose: Defines doc-link rules for reading and writing document IDs, parsing Markdown reference links and headings, generating heading anchors, computing content hashes for comparison, and limits for AI-generated ToC fields.
    content_details:
      - Frontmatter detection between opening and closing three-dash lines, reading only the top-level doc_link_id key with minimal parsing
      - DLID format with DLID- prefix and 12 lowercase Crockford Base32 characters from a 60-bit random value, matched case-sensitively
      - Write restriction to the doc_link_id frontmatter value and heading line ends, verified by re-parsing with markdown-it-py and atomic replacement
      - Reference link rules following CommonMark for label matching, first definition wins, title and href after escape expansion, scheme destinations excluded
      - Heading section range from the heading to the next heading of the same or higher level, with section ID taken from the last word
      - GitHub-compatible heading anchor generation removing punctuation and symbols, replacing spaces with hyphens, and numbering duplicates with -1 -2 suffixes
      - Content hash as SHA-256 of UTF-8 bytes, with the title record keeping the first 12 characters and the reference link title excluded from the parent hash
      - Section content hash over the section range, independent of the issued DLID value
      - "AI-generated fields: title from the first H1, purpose, content details, applicable tasks and keywords with soft limits, minimum counts 5, 1 and 5, and English output"
    applicable_tasks:
