  docs/specs/design/DES-001-system-overview.md:
    title: System Overall Design (DES-001)
    purpose: Defines the system boundary of doc-link as the DocAdvisor replacement, the inputs, outputs and write boundaries of each operation, the common sequence of ToC build and change impact check, and the common invariants that all processing must keep.
    content_details:
      - "System boundary: doc-link manages document IDs, ToC, search, reference checks and change impact notification for managed Markdown"
      - Writable scope limited to DLID at doc_link_id frontmatter, anchor line before headings and reference link title attributes (D-031)
      - Operation table covering ID assignment, ToC build and rebuild, document search, reference check, change notification and consistency check
      - "ToC build order: target fixing, ID check, change detection, data retrieval, reference check, candidate check and commit"
      - index-docs and check-impact are separate operations; ToC commit does not advance the comparison baseline
      - "Common invariants: IDs are not reissued for change reasons alone, unscanned references are not asserted, partial candidates are never published"
      - An update for one key never modifies or deletes ToC of other keys; reverse reference reporting stays within scanned referrers
      - Unreadable reference target directory is recorded as absent without blocking commit (D-025)
    applicable_tasks:
