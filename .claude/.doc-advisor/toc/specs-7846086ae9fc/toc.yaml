      - Detection rules for missing document IDs, headings without section IDs, duplicate document IDs, and duplicate section IDs
      - DLID resolution (FR-018) that returns the recorded current path and recorded content hash, and never searches outside recorded paths
      - DLID assignment operation (section 9.2) that checks duplicates against all keys, issues IDs, writes section IDs to every heading, and reports written and unwritable documents
