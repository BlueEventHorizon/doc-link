  docs/specs/design/DES-003-data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines the identity, relations, versions and primary sources of doc-link information, including document info, reference records, reference check results, ToC confirmed versions, processed comparison baselines, build executions and document locks, without specifying a physical schema.
    content_details:
      - Document identity - doc_link_id as the identifier independent of path and key, with one document info row per ID shared by all keys
      - Document info - ID, current path, title, purpose, content summary, applicable tasks, keywords and content hash, from mechanical extraction and AI generation
      - Reference records - referrer ID, location, referenced ID, referenced path and optional section ID, plus check results with scope, time and result class
      - ToC confirmed version - one public version per key holding target spec, document entries, references, reverse references and check status
      - Processed baseline - per target ID or section and referrer ID, the reported hash, kept independent of the ToC hash and of the scan key
      - Build execution and document lock - build ID, session ID, operation, key and start time, with one document lock per locked document, released by deletion
      - Multiplicity - one key has many document IDs, one ID belongs to many keys, one document has many reference records, and at most one current confirmed ToC per key
      - Freshness - reference check result is valid only for the recorded directory and time, and target document freshness and reference target freshness are independent attributes
    applicable_tasks:
      - Implementation of doc-link data model and storage schema
      - Review of relations between document ID, ToC version and processed baseline
      - Design review of document lock and build execution information
      - Verification of freshness and scope of reference check results
