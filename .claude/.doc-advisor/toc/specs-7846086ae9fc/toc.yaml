  docs/specs/design/DES-007_references-impact.md:
    title: Reference Inspection and Change Impact Candidate Notification Design
    purpose: Defines formal reference extraction from DLID-bearing link titles, directory-scan reference inspection, reverse references, and change impact candidate notification without writing to documents.
    content_details:
      - Formal reference extraction from reference link definitions whose title ends with a DLID, with an optional preceding 64-digit lowercase hex content hash
      - "Reference record kept separately: referrer ID, location, target ID, and relative link definition path"
      - Reference resolution by directory scan, matching document DLID against frontmatter doc_link_id and section ID against the DLID at the end of a heading
      - "Inspection results: match, same ID at a different path, or not found in the specified directory, including missing or unreadable directories"
      - Fragment check that resolves fragments to explicit anchors or heading-generated anchors, reporting fragment mismatch with the current anchor attached
      - Duplicate IDs reported as duplicate diagnosis without guessing a unique current path
      - Reverse references built from scanned referrers, comparing the recorded content hash with the current hash taken from the confirmed ToC
      - Change impact candidates listed when the recorded hash differs or is absent, excluding references to IDs missing from the confirmed ToC
      - Change impact notification with changed document ID, location, current hash, referrer ID, location and reference text, without storing notification state
      - Link without DLID in title reported with a suggested title value taken from the live target, while the link text itself is never written by doc-link
