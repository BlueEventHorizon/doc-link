  docs/specs/design/DES-003-data-model.md:
    title: Logical Data Model (DES-003)
    purpose: "Defines the logical information model of doc-link: document identity, managed target specs, document information, reference records, inspection results, ToC confirmed versions and processed comparison baselines, with their multiplicities, scopes and value freshness rules."
    content_details:
      - Document identity by doc_link_id, independent of path and key; document information stored once per ID and shared by all keys
      - Separation of current source observation, last confirmed index and processed comparison baseline as distinct information
      - Reference records with referrer ID, location, referenced ID, stated path and optional section ID
      - Reference inspection result tied to inspected scope, observation time and result category
      - "ToC confirmed version: one final version per key with target spec, document entries, references and inspection state"
      - Processed baseline recorded per referrer, independent of ToC hash, retained across key departure until no key owns the document (D-046)
      - Section identity by DLID placed before each heading; sections added later without DLID have no stable identity
      - Content hash differs from ID; path fix also changes content hash (D-039)
      - Inspection match holds only for recorded directory and time; removed documents excluded from key confirmed version
    applicable_tasks:
      - Design review of the logical data model and entity relationships
      - Implementation planning for the storage schema derived from the model
      - Modification of ToC confirmed version or document information structure
      - Review of processed baseline retention and removal rules
      - Verification of section identity and reference inspection freshness semantics
