  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: "Defines the logical information model of doc-link: document identity, document info, reference descriptions, section entries, check results, and confirmed ToC, with their cardinality, scope, and value freshness."
    content_details:
      - "Information table: document identity by doc_link_id, Index target spec, Index target observation, document info, reference description, reference check result, section entry, final check state, confirmed ToC, and build execution"
      - Document info is stored once per doc_link_id and shared by all keys, never copied per key
      - Confirmed ToC holds membership, reflected hashes, section entries, references, reverse references, and final check state, but not document info
      - Notification state is not held (D-038)
      - "Cardinality: one key has many document IDs, one document ID can belong to many keys, and a key publishes at most one confirmed ToC"
      - Sections are identified by a section ID at the end of the heading line; headings without DLID have no stable identity and heading text is not a permanent ID (D-033)
      - "Document ID and content hash differ: the ID is fixed at issuance, while the content hash changes with the observed text, including link path edits (D-039)"
      - A reference check match holds only for the recorded directory and check time; current correctness needs a fresh scan
      - Documents that leave the target are dropped from the confirmed ToC without searching outside the target scope
      - No open relations remain; ID issuance and uniqueness were decided in D-028 and D-030
    applicable_tasks:
      - Implementation of the confirmed ToC and document info storage structure
      - Review of data ownership between document info and per-key ToC
      - Design of reference description and reference check result records
      - Handling of section identity when headings lack a DLID
      - Review of freshness semantics for reference check match results
      - Schema review confirming notification state is excluded
