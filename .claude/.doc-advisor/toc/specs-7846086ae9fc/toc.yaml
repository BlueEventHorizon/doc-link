  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Roles
    purpose: Defines the responsibilities and write permissions of each executing actor, the logical operations that scripts provide, and the connection rules between Skills and scripts in doc-link.
    content_details:
      - "Responsibility table: project AI supplies the ToC identification key and full target specification, doc-link Skill orders operations and scripts, deterministic scripts write only DLID and management state"
      - Content AI generates purpose, summary, and keywords only and never changes ID, hash, check state, or ToC directly
      - Search AI reads the whole confirmed ToC and returns related documents without changing the index
      - "Script operations: target expansion, ID check, DLID assignment, comparison value fetch, difference judgment, reference check, AI output validation, candidate commit, DLID resolution, consistency check"
      - Skills are inherited type running in the caller context and scripts enforce input version and state guards
      - Content AI input is limited to target content and the description limit L, and the internal upper limit H is never disclosed
      - Change impact notification is a mechanical listing with no judgement or fix proposal inside doc-link
      - Reference check Skills and check-impact never rewrite management state
      - Interrupted DLID assignment keeps issued IDs, reports failed documents, and resumes on retry
      - Management state is stored as JSON under the doc-link directory, one file per document information and one per confirmed ToC
