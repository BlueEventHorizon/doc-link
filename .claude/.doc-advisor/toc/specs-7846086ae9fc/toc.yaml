    title: Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines how the DLID and frontmatter doc_link_id are read and written, how Markdown reference links and headings are parsed, how content hashes are computed for comparison, and the length and count limits for AI-generated ToC fields.
    content_details:
      - Frontmatter delimiter detection and minimal top-level doc_link_id parsing that tolerates YAML syntax errors elsewhere in the frontmatter
      - "DLID recognition rule: DLID- prefix plus 12 lowercase Crockford Base32 characters, case-sensitive exact match"
      - DLID write positions limited to the frontmatter doc_link_id and the end of heading lines, verified by re-parsing with markdown-it-py
      - Atomic write through a temporary file and os.replace that preserves the original file permissions
      - "Formal reference rule: a reference-link definition whose title last word is a DLID, excluding inline links, images, and autolinks"
      - "CommonMark label matching: first definition wins, Unicode case fold, full-width and half-width characters treated as different"
      - Heading anchor generation matching github-slugger v2.0.0, with duplicate anchors suffixed -1, -2
      - Content hash as SHA-256 of the UTF-8 source bytes, excluding the recorded hash word from reference titles before computing
      - Section scope running from a heading to the next heading of the same or higher level
      - "AI-generated field limits: upper bound L with validator tolerance floor(L x 1.3), minimum counts 5 for content_details, 1 for applicable_tasks, 5 for keywords"
