  docs/specs/requirement/REQ-005-references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for ID-based document references, link checks in designated directories, section references, and notification of change impact candidates to the project management AI.
    content_details:
      - "Formal reference notation: DLID in the title attribute of standard Markdown links, where the last word of the title matches the DLID format (FR-007, D-032)"
      - "Link checks (FR-009): DLID presence in title, ID found in the designated directory, path match, relative path resolution, and fragment resolution"
      - Results not found in a designated directory recorded as absent there, not as globally absent, and saved after the search (D-025)
      - "Reference path correction notice (FR-010): notified only when the current path is confirmed by actual directory search; doc-link never updates link definitions"
      - "Section reference design: option B chosen, a DLID anchor line before every heading, scope up to the next heading of same or higher level (D-033)"
      - "Change impact candidate identification (FR-013): reverse lookup of extracted references, direct referrers only, no judgement of necessity"
      - "Change impact notification (FR-014): changed document ID, location, compared values, referrer IDs, reference descriptions, and scanned scope"
      - "Change report management (FR-015): recorded changed ID and hash, referrers, scope, and result; project management AI results are not a processing condition"
      - "Consistency inspection (FR-016): list of inconsistency kinds such as missing ID, duplicate DLID, broken reference, and title without DLID"
      - Acceptance criteria AC-003 to AC-028 for path mismatch, section scoping, and directory-based verification
    applicable_tasks:
      - Implementation of reference notation parsing from Markdown link title attributes
      - Implementation of link checks based on designated directory search results
      - Implementation of change impact candidate enumeration and notification
      - Review of reference and section reference requirements
      - Creation of acceptance test cases for reference path mismatch and section scoping
      - Review of consistency inspection item coverage
