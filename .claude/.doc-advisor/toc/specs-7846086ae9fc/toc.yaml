  docs/specs/design/DES-004-state-machines.md:
    title: DES-004 State Machines and Permitted Transitions
    purpose: Defines permitted transitions for ToC publication state and ToC build execution, separating the publication state from build progress and fixing how reference check results are kept fresh at search time.
    content_details:
      - Per-key publication states unbuilt and published with transitions P-01 to P-03
      - Build execution transitions B-01 to B-09 from scope fixing through ID fixing, change fixing, data fixing, reference check and candidate check to atomic publication
      - "Failure rule: a failed build never publishes its candidate and keeps the previous published version and comparison baseline"
      - "Re-execution rule: after failure, an explicit restart returns to the start state and re-evaluates unfinished work (B-09)"
      - Mermaid stateDiagram for build execution with states ScopeReady IdsReady ChangesReady DataReady RefsReady CandidateReady Finished Failed
      - Document-level lock waits are not states but waits inside ID issue (B-02) and document info row confirmation (B-04)
      - Forced lock release makes the build fail at write time, and already confirmed document info rows are not rolled back
      - "Reference check result classes: match, path mismatch, absent in designated directory, check impossible, each kept with directory and timestamp"
      - Search-time re-scan of reference definitions limited to references appearing in search results
      - "Test requirement: all permitted transitions, guard failures, undefined events, failure and re-execution per DES-009"
