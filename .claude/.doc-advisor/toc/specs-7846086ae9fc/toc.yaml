  docs/specs/requirement/REQ-002-document-id.md:
    title: doc-link Requirements Managed Targets and Document ID
    purpose: Defines managed Markdown targets and management key rules, the DLID document ID format and issuance, missing and duplicate ID checks, and the ID assignment operation
    content_details:
      - Management key as an opaque key with desired state target specification options paths dirs exclude and all
      - Forbidden combinations such as all with a target specification, key all, and target specification without key, all rejected as ambiguous input
      - Forge resolves the external file doc_structure yaml and passes rules or specs keys, while doc-link never reads that file
      - doc_link_id frontmatter key with DLID prefix and a 12 character lowercase Crockford Base32 value from a 60 bit random number
      - Issued ID is never recalculated from body file name path title or summary and is never reused for another document
      - Missing ID classification unifying null empty whitespace unreadable and unrecognized values with no separate format error class
      - Duplicate ID detection with original candidate order by recorded current path creation time and recorded content hash
      - ToC build stage 9.1 that reports documents with missing or duplicate IDs without writing files or failing
      - ID assignment operation steps checking all keys, issuing IDs, adding section anchors for referenced headings, and adding DLID to existing link titles
      - Document ID independence from management keys so one document can belong to several keys without reissue
