  docs/specs/design/DES-001-system-overview.md:
    title: System Overall Design (DES-001)
    purpose: Defines doc-link system boundaries, the six operations with their inputs, outputs and write boundaries, the index-docs and check-impact sequence, and common invariants.
    content_details:
      - "Write boundary: doc-link writes only DLID to frontmatter doc_link_id, the anchor line above headings, and reference link title attributes (D-031)"
      - "Six operations: ID assignment, ToC build/rebuild, document search, reference check, change impact notification, consistency check"
      - "ToC build order: target confirmation, ID check, change detection, required info fetch, reference check, candidate check, commit"
      - ID check excludes documents with missing or duplicate IDs and reports them without stopping the build (D-036)
      - Search and impact notification are separate operations after ToC commit; report success does not equal ToC update success
      - Mermaid sequenceDiagram of index-docs then check-impact among ProjectAI, DeterministicScripts, ContentAI, ProjectDocs
      - Processed comparison baseline is not advanced at ToC commit; it advances only after the change and referrer report (see DES-007)
      - "Invariants: IDs are independent of path, body and key and are not reissued for change reasons alone"
      - "Invariants: reference existence or path match is never asserted without a real directory scan; unscannable target directories are recorded as uncheckable and do not block commit (D-025)"
      - "Invariants: no partial ToC candidate is published as current state; updating one key never changes ToC of other keys"
