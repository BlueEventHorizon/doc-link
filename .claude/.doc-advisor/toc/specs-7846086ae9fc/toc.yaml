  docs/specs/design/DES-008-content-rules.md:
    title: Markdown Parsing, Comparison Values and Generated Information Rules
    purpose: Defines the rules for reading and writing document IDs in Markdown, locating references and sections, computing content hashes for comparison, and constraining AI-generated ToC fields.
    content_details:
      - "DLID reading rule: the doc_link_id frontmatter value is accepted only as an exact match of DLID- plus 12 lowercase Crockford Base32 characters, and missing or unrecognized values are classified as no document ID"
      - DLID write positions limited to frontmatter doc_link_id, the heading anchor line directly before a heading, and the reference link title attribute, excluding code blocks and HTML blocks
      - Post-write verification by re-parsing with markdown-it-py, reverting the write and reporting when any difference other than the intended DLID is found
      - Section DLID range from a heading to the next heading of the same or higher level, and reference detection by the last title word of inline and reference link definitions
      - Relative link path resolution based on the referencing file location, with target ID and physical path kept as independent values that are not propagated to each other
      - Content hash defined as SHA-256 of raw UTF-8 bytes with no normalization, and section hash defined over the original text of the section range
      - Reproducible test vectors from input string to content hash, covering changes to body, heading, link display text, link target, title and DLID insertion
      - AI generation limit L per field, with validator acceptance up to floor(L x 1.3) and rejection above that, plus element count checks for array fields
    applicable_tasks:
      - Implementation of document ID reading and writing in Markdown files
      - Implementation of reference and section parsing with markdown-it-py
      - Implementation of content hash computation and test vector creation
      - Review of DLID write positions and post-write verification rules
      - Modification of AI-generated field limits and validator behavior
