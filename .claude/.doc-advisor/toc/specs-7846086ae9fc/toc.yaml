  docs/specs/design/DES-010_skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: "Defines the composition of the 8 doc-link SKILLs and 2 custom Agents (toc-updater, query-worker), each SKILL's responsibilities and sequences, and the data exchange rules between SKILLs and Agents."
    content_details:
      - 8 SKILLs (embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact) classified as operation, query or inspection with their managed-state write scope
      - Only index-docs rewrites managed state (document info and ToC version); inspection SKILLs only detect and return results, and check-impact does not rewrite anything
      - toc-updater handles up to 3 documents from the same directory per launch and generates purpose, content overview, applicable tasks and keywords per document independently, with no verification data beyond the field limit L
      - query-worker reads the whole confirmed ToC, selects relevant documents with reasons, is read-only and must not supplement IDs that do not exist
      - "index-docs sequence: a single entry script drives the stages, toc-updater runs up to 10 launches concurrently, and the reference check and candidate confirmation run afterward"
      - "check-impact sequence: a stale ToC returns the same result as check-toc, otherwise it lists changed documents with their direct referrers and the recorded and current content hashes"
      - Inspection responsibility table for check-dlid, check-links, check-toc and check-impact with the detected states and the follow-up action for each
      - "Agent data exchange: only script-generated identifiers under .temp/doc-link/<skill>/, with source_unreadable as the toc-updater error value and an empty set for query-worker errors"
    applicable_tasks:
      - Implementing SKILL.md files and their script invocations for doc-link
      - Implementing toc-updater and query-worker custom Agent definitions
      - Reviewing the responsibility boundaries between SKILLs and custom Agents
      - Modifying the index-docs orchestration flow and its toc-updater dispatch limits
      - Reviewing the detection and follow-up actions of the inspection SKILLs
      - Verifying the Agent data exchange identifiers and error values
