  docs/specs/design/DES-008-content-rules.md:
    title: Markdown Parsing, Comparison Values, and Generated Information Rules
    purpose: Defines document ID reading and writing, Markdown reference and section parsing with markdown-it-py, content hash computation, and limits for AI-generated ToC fields.
    content_details:
      - Reading doc_link_id from frontmatter as a single string; missing, empty, null, or unrecognized values classified as no document ID
      - "Issued ID format: 60-bit random value from secrets encoded as 12 lowercase Crockford Base32 characters with DLID prefix"
      - Case-sensitive recognition of the DLID prefix and exact 12 lowercase characters; reference label matching follows CommonMark case-insensitivity
      - Write locations limited to frontmatter doc_link_id, the anchor line before a heading, and the reference link title attribute
      - Post-write markdown-it-py re-parse verifies that only the intended DLID changed, otherwise the write is reverted and reported
      - Section DLID taken from an anchor line followed by a heading; section range ends before the next heading of same or higher level
      - Relative link paths resolved from the referring file location; migration resolves heading anchors by GitHub rules
      - Content hash as SHA-256 of the raw UTF-8 bytes of the original text, with no normalization and per-section ranges
      - "AI-generated fields: generator receives only the soft limit per field, while the validator enforces a hard limit with margin above it"
      - Array fields validated by element count against the limits
