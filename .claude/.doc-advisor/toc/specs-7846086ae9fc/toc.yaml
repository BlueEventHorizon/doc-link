    title: DES-010 SKILL and Agent Composition
    purpose: Defines the 7 SKILLs and 2 custom Agents of doc-link with their responsibilities, write scopes, per-SKILL sequences, detected states of check SKILLs, and follow-up actions after checks.
    content_details:
      - Seven SKILLs embed-dlid index-docs query-docs check-dlid check-links check-toc check-impact and two custom Agents toc-updater and query-worker with their responsibilities table
      - All SKILLs are inheriting type running in the caller context and delegate processing to scripts without logic in SKILL.md
      - "Write scope per SKILL: embed-dlid writes DLID to Markdown and lock rows, index-docs writes document info rows and ToC version, check-impact advances processed comparison baseline"
      - Check SKILLs other than check-impact only detect and return results without rewriting management state
      - Detected states and follow-up actions per check SKILL, e.g. check-links handles missing title DLID via embed-dlid and link fixes by the project management AI
      - check-impact returns changed documents with direct referrers, the processed unit is the pair of changed document and referrer, and indirect referrers are excluded
      - Use case diagram showing user, project management AI and upper skills calling operations and checks, with query-docs asking for rebuild choice
      - Per-SKILL sequence diagrams for embed-dlid index-docs query-docs check-dlid check-links check-toc and check-impact
