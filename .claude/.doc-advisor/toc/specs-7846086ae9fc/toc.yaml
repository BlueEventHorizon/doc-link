  docs/specs/requirement/REQ-005-references.md:
    title: "doc-link Requirements Specification: References and Change Notification"
    purpose: Defines requirements for DLID-based references in Markdown link titles, link checks by real directory search, stale path notices, section references, and change impact candidate notices to the project management AI.
    content_details:
