    title: DES-007 Reference Check and Change Impact Candidate Notification
    purpose: Specifies formal reference extraction from DLID-bearing link titles, directory-scan target checks, reverse references and change impact candidates from confirmed ToC hashes, and the consistency check scope.
    content_details:
      - Formal reference extraction from Markdown reference link definitions whose title ends with a DLID (D-032)
      - Recorded content hash taken from the word before the DLID when it is 64 lowercase hex characters, otherwise recorded as no record
      - Target check by real scan of the specified directory with results match, same ID at a different path, or absent (including nonexistent or unreadable directory)
      - Fragment resolution against explicit anchor or heading-generated anchor, with fragment mismatch and a current anchor hint for section IDs
      - Value form for link_without_dlid titles as content hash followed by DLID, taken from the current target content and not from stored ToC records
      - Reverse references built only from referrers scanned in the confirmed ToC, limited to documents and sections of that ToC
      - Change impact candidates by comparing the recorded content hash in the title with the current hash from the confirmed ToC, exact 64-character match, including records absent
      - Change impact notification returning changed ID, location, current hash, recorded hash, referrer ID, location, reference text, and inspection scope, without indirect referrers
      - Notification state kept outside doc-link, the same reference returned repeatedly until the project management AI corrects the title hash
      - Consistency check categories (ID missing or duplicated, broken reference, link without DLID, path mismatch, ToC versus source difference) split across check-dlid, check-links, check-toc and check-impact with no write-back
