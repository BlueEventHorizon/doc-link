      - GitHub-compatible heading anchor generation with punctuation and symbol removal and duplicate suffixes
      - Content hash as SHA-256 of raw UTF-8 bytes, title record uses first 12 hex characters, title part excluded from referrer hash
      - "AI-generated ToC fields: title from H1, purpose, content details, applicable tasks, keywords, with length limits L and H equals floor of L times 1.3"
      - "Minimum element counts: content details 5, applicable tasks 1, keywords 5, values in English"
