      - "FR-015 change report management: reported document ID and hash, enumerated referrers and scope, and report execution result, excluded from processed judgment"
      - "FR-016 integrity inspection list: missing IDs, headings without section DLID, duplicate IDs, broken references, ID-path mismatch, missing fragment targets, ToC versus file mismatch, unreported updates"
      - "AC-028 verification: references judged correct only by actual directory search, with ToC or database records never used as the basis"
