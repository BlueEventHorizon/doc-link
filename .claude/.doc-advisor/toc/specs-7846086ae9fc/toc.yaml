    title: doc-link Requirements Overview
    purpose: Defines the purpose, background, scope, responsibility boundaries, and common non-functional requirements of doc-link, the document search and index management plugin that replaces DocAdvisor.
    content_details:
      - "Purpose of doc-link: identifying documents by permanent document ID instead of path-based ToC keys"
      - "Limits of the DocAdvisor path-based approach: path changes on move or rename, unified reference methods missing, changed section scope unknown"
      - "Overall flow: ID assignment, then ToC build, then change detection and notification to the project management AI (D-035, D-036)"
      - "Document search flow: ToC rebuild check, user choice to rebuild or search the existing ToC, and disclosure that a stale ToC is not current"
      - "Terms: document ID, section ID (DLID), ToC, management key, management target specification, content hash"
      - "Scope: Markdown only, opaque management keys, no source code dependency analysis, no semantic impact judgement by scripts"
      - "Responsibility boundary: doc-link never decides edit necessity and writes only DLID into managed Markdown (D-031)"
      - "Common NFRs: ToC rebuild consistency, determinism, idempotence, write boundary, diagnosability, resumption, scalability, separation of generation instructions and verification limits"
      - Error candidates and non-blocking detections recorded in the ToC without stopping its confirmation
      - Decision records D-001 to D-046 and open item records U-001 to U-024 with their resolutions
