    title: DES-007 Reference Inspection and Change Impact Candidate Notification
    purpose: Defines formal reference extraction from DLID-titled reference links, target existence checks by directory scan, change impact candidate detection by hash comparison, and notification rules; doc-link writes nothing.
    content_details:
