  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines responsibilities and write permissions of the project management AI, doc-link Skill, deterministic scripts, content generation AI, and search AI, plus the logical script operations and the Skill-script connection rules
    content_details:
      - "Responsibility table: who handles ToC key and target spec, Skill, scripts, content generation AI, search AI, and user, with write permissions and prohibitions"
      - Scripts write only DLID in frontmatter and at the end of heading lines plus doc-link management state; DLID writes limited to the DLID assignment operation
      - "Logical script operations table: target expansion, ID check, DLID assignment, comparison value fetch, change detection, reference extraction and check, AI output validation, candidate check and commit, search read, DLID resolution, consistency check"
      - Search relevance is judged by the read-only search AI custom Agent reading the ToC; scripts supply confirmed data and the search AI does not change index state
      - "Skill-script rules: Skills are inherited type running in caller context; content generation AI gets only the target content and the description limit; internal upper limit must not be disclosed"
      - check-impact lists changed documents and known referrers mechanically and never judges fix necessity; re-check after caller fixes is a new operation
      - Interrupted DLID assignment keeps issued IDs as immutable and reuses them on re-run; files are created only inside the project and written deterministically with UTF-8 and sorted keys
      - Management state is stored as JSON under the project root .doc-link directory, one file per document info and one file per confirmed ToC per key
