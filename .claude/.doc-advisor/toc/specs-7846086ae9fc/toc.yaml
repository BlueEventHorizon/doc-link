      - "Search flow in section 3.2: rebuild-needed check, user choice between rebuilding and searching the existing ToC, and a stale warning when the existing ToC is used"
      - "Terminology table in section 4: ToC candidate, confirmed ToC, document info, AI generated fields, current hash, applied hash, index target specification and list"
      - "Responsibility boundary in section 5.3: doc-link writes only DLID to documents while the project management AI decides and performs document revisions"
      - "Non-functional requirements NFR-001 to NFR-008: rebuild consistency, determinism, idempotency, DLID-only write boundary, diagnosability, resumable processing, scalability, and separation of generation limit from validation limit"
      - Error candidates and non-blocking detections in section 17, where missing IDs and reference mismatches are recorded without stopping ToC confirmation
