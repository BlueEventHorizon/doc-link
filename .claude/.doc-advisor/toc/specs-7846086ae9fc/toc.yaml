  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overview Design
    purpose: Defines the system boundary of doc-link, the seven operations with their inputs, outputs and write boundaries, the normal sequence of ToC indexing and change impact notification, and the common invariants shared by all operations.
    content_details:
      - System boundary where doc-link replaces DocAdvisor and handles ID assignment, ToC, search, DLID resolution, reference check and change impact notification
      - Only DLID is written to managed Markdown, at the doc_link_id frontmatter, the anchor line before a heading, or the title attribute of a reference link
      - Table of seven operations listing main inputs, results passed downstream and write boundaries for each
      - ToC build order of target fixing, ID check, change detection, data retrieval, reference check, candidate check and commit
      - ID check excludes documents without ID or with duplicate IDs, reports them, and does not stop the build
      - Normal sequence diagram of index-docs followed by the separate check-impact operation
      - Processed comparison baseline is not advanced at ToC commit and only advances after change and referrer reporting
      - Unreadable reference target directory is recorded as absent and does not block the commit
      - Six common invariants including ID independence from path and no re-issue, and per-key update isolation
      - Undecided details deferred to DES-002, DES-003, DES-005, DES-006 and DES-007 with recorded rationale
