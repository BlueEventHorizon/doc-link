  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines the responsibilities and write permissions of each actor in doc-link, the logical operations that scripts provide with their failure promises, and the connection rules between Skills and scripts.
    content_details:
      - Responsibility table of the project AI, doc-link Skill, deterministic scripts, information generation AI, search AI and user with write permissions and prohibitions
      - Deterministic scripts are the only writers of DLID to frontmatter, anchor line and link title, and they never edit other body text or links
      - Logical operations of target expansion, ID check, ID assignment, comparison value retrieval, diff judgment and reference extraction and check
      - Logical operations of AI output validation, candidate check and commit, search and reverse lookup reading, DLID resolution, processed baseline update and consistency check
      - ID assignment writes DLID only, verifies the diff afterward, and issues a new ID to a duplicate copy after the user confirms the original
      - Processed baseline is not updated by ToC commit alone and keeps the old baseline when its update fails
      - Skill runs as an inherited type in the caller context, and only the summary generation AI is separated into another context
      - Summary generation AI input excludes the internal upper limit, coefficients and margin of the validator
      - Change impact notification lists changed documents and known referrers mechanically, with no impact judgment or fix proposal inside doc-link
      - Management state is saved as JSON under .doc-link split into per-document ID files, per-key index state files and one processed baseline file
    applicable_tasks:
