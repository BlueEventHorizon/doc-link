    title: DES-007 Reference Inspection and Change Impact Candidate Notification
    purpose: Defines how formal references are extracted from reference link titles, how the script inspects reference targets by scanning a specified directory, how reverse references and change impact candidates are derived by comparing recorded content hashes with current hashes, and how inconsistency inspection is scoped without modifying any managed state.
    content_details:
      - "Formal reference extraction: last word of a Markdown reference link title is the target DLID, with the preceding recorded content hash kept or marked as no record"
      - "Inspection result classification: match, same ID at a different path, or absent within the specified directory"
      - "Directory scan rules: the specified directory is scanned even if its name is an excluded name, and excluded names are skipped only during Index target list building"
      - Fragment verification against explicit anchor or heading-generated anchor, with fragment mismatch and current anchor reporting
      - "Link without DLID: value suggestion of content hash and DLID taken from the live target, with reasons when no value can be given"
      - Reverse references built from the scanned referrers, comparing recorded title hash with current hash from the confirmed ToC section entries
      - Impact candidates listed on mismatch or missing recorded hash, while references to IDs absent from the confirmed ToC are excluded
      - Change impact notification returns changed document ID, location, current hash, recorded hash, referrer info and scope, and repeats until the project management AI rewrites the title hash
      - "Inconsistency inspection categories: missing or duplicate IDs, broken references, links without DLID, path mismatch, ToC versus source drift"
