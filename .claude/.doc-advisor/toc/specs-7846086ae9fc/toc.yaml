  docs/specs/design/DES-006-search.md:
    title: DES-006 Document Search Design
    purpose: Defines pre-search freshness judgement, the search result contract with candidate fields, and DLID resolution that verifies recorded paths without writing to any store.
    content_details:
      - Pre-search judgement distinguishing rebuild not required, rebuild required, and undecidable, where undecidable is treated as a failure and never as either of the others
      - Rebuild-required choice presented to the user as rebuild then search or search the existing version, with script-counted rebuild scale shown
      - Existing version search uses old key-level index state while showing latest document info, and the old version is stated explicitly
      - Search results contain DLID, recorded path, relevance reason, optional section, key, ToC version, and freshness judgement
      - Semantic relevance judged by a read-only search worker (custom Agent) reading the entire ToC, with broad recall to avoid misses
      - Search worker must not fill missing IDs, correct index paths, or modify ToC and management state
      - DLID resolution looks up the current path from document info and section entries across all key ToCs
      - Recorded path verified by matching frontmatter doc_link_id or anchor DLID, with mismatch or missing file reported as absent at the recorded path
      - "Multiple candidates: only matched ones are resolved, and when none match all recorded paths are listed without searching elsewhere"
      - Frontmatter parse failure treated as missing ID and deleted target directory as rebuild required, with resolution never writing anywhere
