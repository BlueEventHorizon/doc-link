  docs/specs/design/DES-007-references-impact.md:
    title: DES-007 Reference Inspection and Change Impact Candidate Notification
    purpose: Defines how doc-link inspects DLID-based references within a scanned directory, notifies change impact candidates to the managing AI, and advances the processed comparison baseline.
    content_details:
      - Formal reference extraction from Markdown links whose title ends with a DLID, keeping source ID, position, target ID and link path separately
      - Directory scan classification into match, same ID at a different path, absent in the scanned directory, or unreadable directory
      - Same ID found multiple times is reported as a duplicate diagnostic with no unique current path inferred
      - Fix-target path notified only when the same ID is uniquely confirmed by a real scan
      - Path mismatch, absence and unreadable results do not block ToC confirmation (U-020, D-025)
      - Reverse references built from scanned referrers bound to comparison value, scanned key and time
      - Direct referrers listed; section-DLID referrers notified only on section change, document-DLID referrers on any change
      - Comparison value ignores DLID writes and link path-only edits (D-039); indirect referrers are not listed
      - Processed baseline kept per (target ID, referrer ID) pair and advanced only after the report is returned successfully
      - Inspection split into check-dlid, check-links, check-toc, check-impact; only check-impact writes management state and no inspection modifies Markdown
