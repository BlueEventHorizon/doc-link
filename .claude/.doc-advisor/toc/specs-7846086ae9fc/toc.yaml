  docs/specs/design/DES-006_search.md:
    title: DES-006 Document Search Design
    purpose: Designs pre-search judgment, the search result contract, the search AI input copy, and DLID resolution, covering freshness reporting of the confirmed ToC without changing any state.
    content_details:
      - Pre-search judgment distinguishes no rebuild needed, rebuild needed, and undeterminable; undeterminable is treated as a failure and never as up to date
      - When a rebuild is needed, the user chooses between rebuild then search and search the existing version, with counts of new, removed, path-changed, content-changed, unassigned-ID, and duplicate-ID documents
      - When the existing version is used, the whole result is marked as possibly not reflecting the current Index target list
      - Each search candidate carries document ID, recorded path, relevance reason, section, ToC key, ToC version, and freshness
      - Search AI input copy holds per document ID the title, purpose, content summary, applicable tasks, and keywords, and per section ID the heading; paths, content hashes, references, and check results are excluded
      - Search AI reads all entries of the copy and does not narrow by keyword matching; the script attaches paths from the confirmed ToC
      - resolve-dlid resolves DLIDs against recorded paths and returns resolved, not at recorded path, or no record, without searching other locations
      - Section DLID resolution checks every key, and if a section moved between documents with only some keys rebuilt, all recorded owning documents become candidates
      - Content hashes are attached from recorded values and never computed from current files; a mismatch returns without a hash
      - Search and resolve-dlid never write the ToC, management state, or Index target documents
    applicable_tasks:
      - Implementing pre-search rebuild judgment and the two-choice confirmation
      - Implementing search result composition with freshness information
      - Implementing search AI input copy generation from the confirmed ToC
      - Implementing resolve-dlid DLID resolution against recorded paths
      - Writing tests for undeterminable judgment and stale-version search
      - Reviewing the search result contract and candidate path handling
    keywords:
