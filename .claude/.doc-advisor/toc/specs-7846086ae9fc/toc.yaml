  docs/specs/design/DES-007-references-impact.md:
    title: Reference Inspection and Change Impact Candidate Notification Design
    purpose: Defines how formal references are extracted by DLID and inspected by directory scan, how reverse references and impact candidates are derived, and how processed comparison baselines gate change notifications to the project management AI
    content_details:
      - Formal reference extraction only from Markdown links whose title ends with a DLID, keeping referrer ID, position, referee ID, and link path separately
      - Directory-scan resolution of link paths, matching document DLIDs against frontmatter doc_link_id and section DLIDs against anchor lines, with results Match, Path mismatch, Not found
      - Fragment verification against explicit anchor or heading-generated anchor, reporting fragment mismatch with current anchor
      - Duplicate ID diagnosis instead of guessing a current path; no path inference from saved ToC or other keys
      - Reverse reference and impact candidates for changed content hashes at document and section DLID granularity
      - Addition, change, and removal distinctions against processed comparison baselines keyed by (target DLID, referrer ID or no-referrer)
      - Baseline advance only when reporting, with error JSON and no report when advance fails; ToC confirmation alone does not advance baselines
      - Consistency check categories split into check-dlid, check-links, check-toc, check-impact; only check-impact writes management state
    applicable_tasks:
      - Implementation of check-links reference inspection script
      - Implementation of check-impact change impact notification and baseline management
      - Review of reference resolution and fragment verification logic
      - Design review of reverse reference and impact candidate derivation
      - Modification of processed comparison baseline handling
      - Verification of DLID-based link validity and path mismatch detection
