    purpose: Defines managed Markdown targets, management key and desired-state specification, document ID format and issuance, ID verification, and the ID assignment operation of doc-link.
    content_details:
      - "Management key rules: opaque key, independent ToC per key, and no inference of document type from key names"
      - "Target specification options: --key, --paths, --paths-json, --paths-file, --dirs, --dirs-json, --exclude, --exclude-json, and --all"
      - "Desired-state semantics: entries absent from the key target set are removed from that key ToC without searching outside the target range"
      - "Argument rejections: --all combined with targets, --key all, targets without --key, and no-argument run treated as --all"
      - "External config boundary: Forge resolves .doc_structure.yaml and doc-link never reads it"
      - doc_link_id in frontmatter with DLID- prefix and a 12-character Crockford Base32 value from a 60-bit random number
      - "Document ID invariants: issued once, never recomputed from body, file name, path, title, or summary, and never reused"
      - Verification of missing, unrecognized, and duplicate IDs across files and sections, plus headings without a section DLID
      - "ID assignment operation steps: check against all-key DLID records, issue IDs, write section anchors and reference link titles, and resolve duplicates with an original candidate"
      - "Document ID confirmation stage of ToC build: excludes unassigned and duplicate documents with reporting, and fails on read error"
