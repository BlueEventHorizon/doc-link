    title: DES-008 Markdown Parsing, Comparison Values and Generated Information Rules
    purpose: Defines how document IDs are read and written in frontmatter, anchors and reference titles, Markdown reference parsing per CommonMark, content hashes, and the limits for AI-generated ToC fields.
    content_details:
      - Frontmatter delimiter detection and minimal top-level-key parsing so that YAML syntax errors do not block reading
      - DLID recognition as an exact DLID- prefix plus 12 lowercase Crockford Base32 characters, case-sensitive
      - "DLID write positions: frontmatter doc_link_id, anchor line before a heading, and reference link title, verified by re-parsing"
      - Atomic file write through a temporary file and os.replace, preserving file permissions
      - Formal reference extraction from link titles whose last word is a DLID, excluding images, autolinks and scheme URLs
      - Reference label matching by Unicode case fold, first definition wins, and percent-decoded href resolution
      - Section ID from an anchor line followed by a heading, with section range up to the next heading of same or higher level
      - Content hash as SHA-256 of raw UTF-8 bytes per document and per section range, without normalization
      - Test vectors confirming hash changes on body, heading, link text, link target, title and DLID changes
      - AI-generated fields (H1 title, purpose, content details, applicable tasks, keywords) with limit L, validator bound floor of L times 1.3, and minimum counts 5, 1 and 5
