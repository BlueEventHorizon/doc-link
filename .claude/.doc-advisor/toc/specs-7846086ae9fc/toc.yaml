  docs/specs/design/DES-002_execution-responsibilities.md:
    title: DES-002 Execution Responsibilities and Processing Duties
    purpose: Defines the responsibilities and write permissions of each executing party, the logical operations that scripts provide, and the connection rules between skills and scripts.
    content_details:
      - "Responsibility table: the caller passes the key and complete target spec, the doc-link skill sequences scripts and AI, deterministic scripts own DLID writes and management state updates, and content AI generates summaries without touching IDs or the ToC"
      - Search AI is read-only and judges semantic relevance from the confirmed ToC, while the user chooses between a stale or updated search and confirms the original for duplicate IDs
      - "Logical script operations: target expansion, ID check, ID assignment, comparison value retrieval, diff judgment, reference extraction and inspection, and AI output validation"
      - Candidate inspection and confirmation keep the last confirmed version on failure, and DLID resolution returns a current path only after verifying the recorded path
      - Processed comparison baseline is updated only by check-impact when it reports, and kept unchanged when the update fails
      - "Skill-script rules: skills run in the caller context as inheriting type, and scripts verify input version and state and reject unpermitted transitions"
      - Summary generation AI receives only target content and the public display limit L, and the internal upper limit H is never disclosed to it
      - After a partial ID assignment failure, issued DLIDs are kept as-is, reported as issued, and reused on rerun without rollback
      - Management state is stored as git-tracked JSON split into per-document info, per-key index state, and one global comparison baseline file
    applicable_tasks:
      - Responsibility allocation review among skills, scripts, and AI agents
      - Implementation of script logical operations for ID assignment and ToC candidate confirmation
      - Design of the skill-to-script call sequence and state transition guards
      - Review of write permission boundaries for DLID and management state
      - Input restriction design for summary generation AI
