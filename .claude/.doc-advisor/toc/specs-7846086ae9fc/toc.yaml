  docs/specs/design/DES-010_skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: "Defines the composition of doc-link's eight SKILLs and two custom Agents, the responsibilities and sequences of each SKILL, the operational flow for introduction and changes, and data exchange with Agents."
    content_details:
      - Eight SKILLs embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact, each with its kind (operation, query, inspection) and what it writes
      - embed-dlid writes DLID to frontmatter and section IDs to headings, and asks the user to confirm the original document when IDs are duplicated
      - index-docs detects the diff against the confirmed ToC, dispatches toc-updater for documents needing generation, and confirms the ToC version in one batch after reference checks
      - query-docs runs a pre-search check returning uninitialized, no rebuild needed, rebuild needed, or undecidable, then asks the user to choose rebuild or existing version
      - check-impact returns changed documents with their direct referrers, comparing the content hash recorded in the referrer title with the current hash, excluding indirect referrers
      - check-links lists broken references, path mismatches, missing sections, fragment mismatches, and title values to write, rewriting only after user approval
      - "Operational flow in section 3.9: check-dlid, embed-dlid, check-links, index-docs, check-impact, restarting from check-dlid after body changes"
      - toc-updater generates purpose, content overview, applicable tasks and keywords for up to 3 documents from the same directory per launch, with error value source_unreadable
      - query-worker reads the whole fixed ToC read-only and returns related document IDs with reasons, and the script rejects IDs absent from the fixed ToC version
      - Agent data exchange carries only script-generated identifiers under .temp/doc-link/<skill>/, with exit value 0 for success
    applicable_tasks:
      - Design review of doc-link SKILL and Agent composition
      - Modification of SKILL responsibilities or per-SKILL sequences
      - Implementation planning of SKILL.md and script division for doc-link
      - Review of the operational flow for introduction and post-change runs
      - Design of data exchange between SKILLs and custom Agents
      - Impact analysis when adding or removing a doc-link SKILL or Agent
