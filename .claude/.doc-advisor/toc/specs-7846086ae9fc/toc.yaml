      - Confirmed ToC transitions P-01 to P-03 for initial publish, rebuild switch, and failure keeping the old version
      - ToC build run transitions B-01 to B-09 from scope fixing through candidate check to batch confirmation
      - "Failure rule B-08: candidate not published, previous confirmed ToC kept, failed document, field and reason reported"
      - Reference check results classified as match, path mismatch, or absent in the specified directory, recorded without blocking confirmation
      - DLID embedding run transitions E-01 to E-07 including duplicate DLID detection and original confirmation wait
      - Only transitions from plan confirmation (E-05 or E-06) may write to index target documents
      - Failure keeps already written DLIDs and reports written count plus per-document path, location and cause
      - Transitions missing from the table are rejected by the script and no new confirmed ToC is created
