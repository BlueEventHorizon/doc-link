      - Review of data ownership between document info rows and per-key ToC versions
      - Design of processed comparison baseline keys and change report bookkeeping
      - Modification of the document lock schema and forced release handling
      - Review of reference inspection result freshness and validity conditions
      - Verification of section identity rules for headings without a DLID
