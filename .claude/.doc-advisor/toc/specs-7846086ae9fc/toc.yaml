  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overview Design
    purpose: Defines the doc-link system boundary as the replacement of DocAdvisor, the overall operations and their handoffs, the write boundary limited to DLID, shared invariants, and matters deferred to individual design documents
    content_details:
      - System boundary covering index target document IDs, ToC, search, DLID resolution, reference check, and change impact candidate notification
      - "Write boundary: only DLID in frontmatter doc_link_id and the section ID at the end of heading lines; links and link titles are not written"
      - Operations table with main inputs, handoff results, and write boundary for DLID assignment, ToC build and rebuild, search, DLID resolution, reference check, change impact notification, and consistency check
      - "ToC build order: target determination, ID check, change detection, required info retrieval, reference check, candidate check, then commit; documents without ID or with duplicate ID are excluded and reported"
      - "Overall sequence: index-docs builds the ToC, then check-impact runs as a separate operation when a referenced content differs from the recorded hash"
      - "Common invariants: document ID is independent of path, body, and ToC key and is not reissued for path change alone; reference existence is not asserted without directory scan"
      - "Common invariants: unconfirmed new ToC candidates are never published as current state; updating one key never changes ToC of other keys"
      - Notification keeps no state; the only baseline is the content hash recorded in the referrer title; unreadable reference directory is recorded as absent without blocking commit
