  docs/specs/requirement/REQ-004_search.md:
    title: doc-link Requirements Specification - Document Search
    purpose: "Defines requirements for document search (FR-006): ToC search by key, pre-search ToC rebuild check with user choice, stop on undeterminable rebuild need, and required search result fields."
    content_details:
      - "FR-006 document search: search the ToC of the given --key, or the reserved key all single-mode ToC when omitted"
      - "Pre-search ToC check: reinterpret the saved Index target specification to detect whether a rebuild is needed"
      - "Rebuild choice: rebuild the ToC then search, or search the existing ToC without updating it"
      - "Rebuild scale report: counts of new, removed, path-only changed, content changed, missing DocID, duplicate DocID documents, and AI summary generation count excluding reusable verified metadata (D-027)"
      - "Failure stop: halt search with cause when rebuild need cannot be determined; existing-ToC search must not be offered (D-026)"
      - "Existing-ToC search notice: reuse ToC structure but use latest per-document metadata (D-024)"
      - "Search result fields: DocID, recorded ToC path, relevance reason, section, ToC state"
      - AC-019 acceptance conditions for pre-search rebuild confirmation
    applicable_tasks:
      - Implementation of the doc-link document search flow
      - Review of the pre-search ToC rebuild confirmation behavior
      - Modification of required search result fields
      - Acceptance test creation for AC-019
      - Design of failure handling when rebuild need cannot be determined
    keywords:
      - FR-006
      - AC-019
      - document search
      - ToC rebuild confirmation
      - "--key all"
      - D-024
      - D-026
      - D-027
      - stale ToC
      - search result
  docs/specs/requirement/REQ-005_references.md:
    title: doc-link Requirements Specification - References and Change Notification
    purpose: Defines requirements for DLID-based cross-document references in reference-link titles, link inspection against specified directories, section references, change impact candidate listing and notification, and integrity checks.
    content_details:
      - "FR-007 formal reference notation: reference-link definition whose title holds the content hash and DLID, with inline links not treated as formal references"
      - Reference target may be a document DLID or a section ID (13.1), with the content hash of the referenced document or section
      - "FR-009 ID link inspection: DLID in title, file with matching DocID found in the specified directory, path match, relative path resolution, and fragment resolution"
      - "FR-010 path-correction notice: reported only when the current path is confirmed by directory search; doc-link never updates link definitions"
      - "Section references: every heading gets a section ID appended after its text, issued only by the DLID assignment operation (D-035)"
      - Section scope runs from a heading to the next heading of the same or higher level (D-033)
      - "FR-013 change impact candidates: reverse lookup of direct referrers whose recorded content hash differs from the current hash"
      - "FR-014 and FR-015 notification: same reference reported on every run until the project management AI rewrites the recorded hash"
      - "FR-016 integrity inspection: missing DocID, headings without section ID, duplicate IDs, broken references, path mismatch, ToC mismatch, unresolved fragments"
    applicable_tasks:
      - Implementation of reference link inspection against specified directories
      - Review of the reference notation rule with DLID in the reference-link title
      - Implementation of change impact candidate listing and notification
      - Implementation of section ID assignment and section reference handling
      - Creation of acceptance tests for AC-003, AC-004, AC-006 to AC-009, and AC-028
      - Implementation of integrity inspection reporting (FR-016)
    keywords:
      - FR-007
      - FR-009
      - FR-013
      - FR-016
      - section ID
      - content hash
      - reference link title
      - change impact
      - DLID
      - AC-028
