    title: DES-008 Markdown Parsing, Comparison Values and Generated Information Rules
    purpose: Defines how document IDs are read and written in frontmatter and headings, how Markdown references and section anchors are parsed with markdown-it-py and CommonMark rules, how content hashes and title-recorded hash prefixes are computed, and which fields the AI-generated ToC entries must contain and their length limits.
    content_details:
      - Frontmatter delimiter detection and minimal top-level doc_link_id reading, treating invalid values as missing ID
      - "Document ID format: DLID- prefix with 12 lowercase Crockford Base32 characters from 60-bit secrets randomness, case-sensitive match"
      - "Write rules: only DLID is written in frontmatter or heading end, with post-write markdown-it-py verification and atomic os.replace"
      - Formal reference extraction from reference link definitions whose title last word is a DLID, excluding inline links
      - Heading section ID range from heading to next heading of same or higher level
