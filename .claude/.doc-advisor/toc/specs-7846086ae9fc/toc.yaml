  docs/specs/design/DES-004-state-machines.md:
    title: DES-004 State Machines and Allowed Transitions
    purpose: Defines public ToC states, build and rebuild execution transitions, ID assignment operation transitions, and change impact reporting transitions, with script rejection of any unlisted transition.
    content_details:
      - Separation of ToC public state from build execution progress, where judgement results such as rebuild required are not persistent states
      - "Public ToC transitions P-01 to P-03: first publish, republish switch, and keeping the current state on failure"
      - Build execution transitions B-01 to B-09 from target fixing through candidate check to atomic confirmation
      - Build failure keeps the old published version and rerun re-evaluates unfinished processing
      - Reference check results classified as match, path mismatch, or absent in designated directory, kept as results without blocking confirmation
      - ID assignment transitions E-01 to E-07 covering duplicate detection, original confirmation wait, and plan confirmation
      - ID assignment writes Markdown only at E-05, and written DLIDs are not rolled back on failure
      - Change impact reporting transitions N-01 to N-05, where only N-03 advances the processed comparison baseline
      - check-impact failure keeps the old baseline and returns an error JSON without a report
      - Script rejects any event, state, or guard combination absent from the tables and never guesses an undecided guard
