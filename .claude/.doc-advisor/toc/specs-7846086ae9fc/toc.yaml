    title: "doc-link Requirements: Document Search"
    purpose: Defines requirements for doc-link document search by ToC key, including recall-first matching, pre-search ToC rebuild check with user choice, failure stop when rebuild need is undeterminable, and minimum result contents.
    content_details:
      - Search by --key ToC, or by the reserved key all single-mode ToC, using the same ToC identifier key as index build
      - "Recall-first policy: keep documents whose relevance is uncertain, exclude only clearly unrelated ones, and leave reading choice to the requester"
      - "Missing ToC: stop search and report that initial build from Index target specification is required"
      - Pre-search inspection of existing ToC by re-interpreting its stored Index target specification to decide rebuild need
      - "Rebuild confirmation counts: new, removed, path-only changes, content changes, documents without DLID, duplicate DLID, and documents needing AI summary generation"
      - "User choice: rebuild ToC then search, or search with existing ToC unchanged and report possible staleness"
      - Failure stop when rebuild need cannot be decided (permission, read error, uninterpretable stored spec); no stale-search option offered
      - Existing ToC search uses its structure, references, reflected hashes, and inspection results, but latest per-document info for titles and summaries
      - "Search result fields: DLID, ToC recorded path, relevance reason, section if needed, ToC state used"
