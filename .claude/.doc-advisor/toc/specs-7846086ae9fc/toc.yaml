  docs/specs/design/DES-010_skill-composition.md:
    title: DES-010 SKILL and Agent Composition
    purpose: Defines the responsibilities of the eight doc-link SKILLs and two custom Agents, the follow-up actions of each check SKILL, use cases, per-SKILL sequences, and data exchange with the Agents.
    content_details:
      - Eight SKILLs embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact and two custom Agents toc-updater and query-worker
      - embed-dlid issues DLIDs to documents without an ID and section IDs to headings without one, and asks the user only to confirm the original when IDs are duplicated
      - index-docs confirms targets and IDs, detects the diff against the confirmed ToC, dispatches toc-updater for documents needing generation, then runs reference checks and a batch ToC commit
      - index-docs dispatches toc-updater in batches of up to 3 documents with at most 10 running at once
      - query-docs pre-search check returns unbuilt, no rebuild needed, rebuild needed, or indeterminate, and offers a two-choice rebuild confirmation to the user
      - check SKILLs only detect and return results and never rewrite managed state, and check-impact does not rewrite the title content hash
      - check-impact returns changed documents with their direct referencing documents, recorded hash and current hash, and the project management AI updates title hashes until the report is empty
      - check-links asks the project management AI to add the target DLID and content hash to a reference title and to convert inline links to reference-style definitions
      - resolve-dlid returns the current path after confirming the DLID is still there, with section heading and anchor and the recorded content hash, or reports a missing path or no record
      - SKILLs pass identification values only through a script-decided temp directory, and the normal exit value is 0 while the read failure value is source_unreadable
    applicable_tasks:
      - Implementing the SKILL and custom Agent split of doc-link
      - Reviewing the responsibilities of each doc-link SKILL against the requirements
      - Implementing the index-docs flow with toc-updater dispatch and batch ToC commit
      - Implementing the query-docs pre-search check and rebuild choice flow
      - Implementing the check SKILL follow-up actions and the check-impact hash update flow
      - Implementing data exchange between SKILLs and custom Agents
      - Reviewing the change impact notification flow of check-impact
    keywords:
      - embed-dlid
      - index-docs
      - query-docs
      - resolve-dlid
      - check-impact
