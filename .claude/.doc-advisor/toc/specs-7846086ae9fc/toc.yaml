  docs/specs/design/DES-010-skill-composition.md:
    title: DES-010 Composition of SKILLs and Custom Agents
    purpose: Defines the seven SKILLs and two custom Agents of doc-link, their responsibilities, the state each may change, and the data exchange between SKILLs and Agents
    content_details:
      - Composition of seven inheriting SKILLs and two custom Agents, where each SKILL delegates processing to scripts and holds no logic in SKILL.md
      - Table of each SKILL kind, its writes to managed Markdown, and its changes to managed state, with embed-dlid writing only DLIDs and check-impact advancing the comparison baseline
      - Check SKILLs check-dlid, check-links, and check-toc detect and return results without rewriting managed state
      - toc-updater Agent generating purpose, content overview, applicable tasks, and keywords one document at a time, with length checks done by script
      - query-worker Agent reading the confirmed ToC read-only and returning relevant document IDs and reasons, never IDs absent from the ToC
      - embed-dlid responsibilities for issuing document IDs and section DLIDs, anchor lines, reissuing IDs for duplicate copies after the user confirms the original, and adding DLIDs to title-less links
      - check-impact returning changed documents with direct referrers, with the pair of changed document and referrer as the baseline unit and indirect referrers excluded
      - Sequences of embed-dlid, index-docs, and query-docs, including the rebuild need check and the binary choice shown to the user before search
      - Data exchange with Agents limited to script-generated identifiers in a per-skill directory, with requests and results written by scripts and deleted after completion
