  docs/specs/design/DES-006-search.md:
    title: Document Search Design
    purpose: Defines the pre-search freshness judgment, the rebuild choice presented to the user, and the search result contract including candidate fields, stale-version notice, and the read-only search worker role.
    content_details:
      - Pre-search judgment classifying results as rebuild not required, rebuild required, or judgment impossible
      - Judgment impossible treated as a failure that stops search and never silently falls back to the old version
      - Rebuild choice between rebuilding before search and searching the existing version, with counts of new, departed, path changed, content changed, unassigned ID, and duplicate ID documents
      - Stale version search using per-key index state while showing the latest document information rows
      - Search result candidates holding document ID, recorded path, relevance reason, section, key, ToC version, and freshness judgment
      - Results flagged when the existing version may not reflect the current target set, without asserting stale paths as current
      - Read-only search worker judging semantic relevance over the whole ToC and barred from supplying absent IDs or modifying the ToC
      - Frontmatter parse failure treated as missing ID and directory disappearance treated as target departure, not judgment impossible
    applicable_tasks:
