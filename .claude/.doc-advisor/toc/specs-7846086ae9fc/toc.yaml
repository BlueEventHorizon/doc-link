  docs/specs/design/DES-007_references-impact.md:
    title: Reference Inspection and Change Impact Candidate Notification
    purpose: Defines formal reference extraction from DLID-titled link definitions, directory-scan target inspection, and content-hash based change impact candidates notified to the managing AI
    content_details:
      - "Formal reference extraction: last word of a reference link title is the target DLID, and the preceding 64-digit lowercase hex word is the recorded content hash or no record"
      - Reference targets are documents or section IDs; source ID, location, target ID and relative link path are held separately
      - Target resolution by scanning a specified directory with outcomes match, same ID at a different path, or absent; an unreadable or missing directory counts as absent
      - Fragment verification against explicit anchor or heading-generated anchor; fragment mismatch reports the current anchor for section IDs
      - Path mismatch fix proposed only when the actual scan uniquely confirms the same ID; current paths are never guessed from stored data
      - Reverse references built from scanned sources; candidates are references whose recorded hash differs from the current hash in the confirmed ToC
      - References to targets absent from the confirmed ToC are excluded from comparison and left to check-links
      - Change impact notification returns changed IDs, locations, current hash, recorded hash, source IDs, reference descriptions and inspection scope
      - doc-link writes nothing and does not edit source documents; the managing AI updates the recorded hash and the same reference repeats until fixed
      - Inconsistency inspection split into check-dlid, check-links, check-toc and check-impact skills without changing managed state
    applicable_tasks:
