  docs/specs/requirement/REQ-005-references.md:
    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for DLID-based document references, link verification by directory search, path correction notification, change impact candidate listing and notification, and integrity checks for the doc-link plugin
    content_details:
      - Markdown reference notation with DLID in the link title attribute, where the last word of the title matches the DLID format and may target a document or section (FR-007, D-032)
      - "Link verification by directory search: DLID present in title, file with that DLID found in the referenced directory, link path matches current path, relative path resolves from the referencing document (FR-009)"
      - "Found, not-found, and unverifiable outcomes: a completed search without the DLID is recorded as absent from the specified directory, and an unsearchable directory is recorded as unverifiable (FR-009, D-025)"
      - Path correction notification to the project management AI only when the current path is confirmed by directory search; doc-link never rewrites link definitions (FR-010)
      - Section reference via a DLID anchor line placed before each heading, with section scope running to the next heading of the same or higher level (13.1, D-033, D-035)
      - Change impact candidates by reverse lookup of extracted references; indirect dependencies are excluded and detected one level at a time (FR-013, D-043)
      - "Change impact notification fields: changed document ID and location, compared hashes, referrer ID and location, reference text, and scanned scope (FR-014)"
      - "Change report management: reported DLID and hash, enumerated referrers and scope, and report execution result, with AI judgement excluded from processed-state conditions (FR-015)"
      - "Integrity check items: missing or duplicate IDs, broken references, missing title DLID, path mismatch, missing section, ToC and file mismatch, and not-found or unverifiable references (FR-016)"
      - Acceptance criteria AC-003, AC-004, AC-006 to AC-009, and AC-028 covering path mismatch, path correction notification, impact listing, and directory-search verification
    applicable_tasks:
