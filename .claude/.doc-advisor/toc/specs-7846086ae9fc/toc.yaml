  docs/specs/design/DES-003_data-model.md:
    title: DES-003 Logical Data Model
    purpose: Defines the identity, relations, versions, and primary sources of doc-link logical information such as document identity, document info, reference records, check results, section entries, and the confirmed ToC, without specifying a physical schema
    content_details:
      - Document identity keyed by doc_link_id, independent of path and key
      - Document info held once per document ID with path, title, purpose, content, tasks, keywords, and content hash, shared by all keys
      - Reference record with referrer ID, location, referee ID, recorded path, optional section ID, and title-recorded content hash
      - Reference check result with check scope, time, result class, and discovered path, tied to the observed time
      - Section entry with owning document ID, section ID, heading, position, and section content hash taken from heading line DLID
      - Final check state per document ID and the confirmed ToC per key with target spec, member documents, reflected hashes, references, and reverse references
      - "Multiplicity: a key has many document IDs and a document has many keys; a key has at most one confirmed ToC at a time, and candidates are not confirmed"
      - Document ID differs from content hash; ID is fixed at issue while content hash follows observed text, and link path fix also changes the content hash
      - Items removed from the Index target are dropped from the confirmed ToC without searching outside scope; remaining reference records are checked by their recorded directory
    applicable_tasks:
      - Data model review for doc-link ToC and document info
      - Schema design review for reference records and reverse reference derivation
      - Data identity and freshness semantics verification for search results
      - Confirmed ToC structure review per key
      - Section identity handling review for DLID-marked headings
