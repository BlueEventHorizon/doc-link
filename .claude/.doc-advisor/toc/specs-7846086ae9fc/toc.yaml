  docs/specs/design/DES-001_system-overview.md:
    title: DES-001 System Overview Design
    purpose: Defines the doc-link system boundary, the operation table with inputs, results and write boundaries, the index-docs and check-impact sequence, and common invariants for document IDs, ToC builds and reference handling.
    content_details:
      - "System boundary: doc-link replaces DocAdvisor and writes only DLID values (frontmatter doc_link_id and section IDs on heading lines) to indexed documents"
      - Operation table covering DLID assignment, ToC build and rebuild, document search, DLID resolution, reference check, change impact notice and consistency check with inputs, outputs and write boundaries
      - "ToC build order: target confirmation, ID check, change detection, required information retrieval, reference check, candidate check and confirmation"
      - Sequence where index-docs runs first and check-impact is a separate later operation that only lists affected referrers
      - Change impact notice writes nothing; the project management AI updates the content hash in the referrer title
      - "Common invariants: document ID is independent of path, body and ToC key and is not reissued for change reasons"
      - Reference existence is never asserted without a directory scan; unreadable reference directories are recorded as absent and do not block confirmation
      - An update for one key never updates or deletes the ToC of another key; search and DLID resolution are separate operations after confirmation
