  docs/specs/design/DES-002-execution-responsibilities.md:
    title: Execution Actors and Responsibilities (DES-002)
    purpose: Defines responsibilities, write permissions and prohibitions of each execution actor, the logical operations scripts provide, and the connection rules between Skills and scripts.
    content_details:
      - "Actor table: caller AI, doc-link Skill, deterministic scripts, content-generation AI, search AI and user, each with write permissions and prohibitions"
      - Scripts provide 11 logical operations including target expansion, ID check, ID assignment, diff judgement, reference check, AI output validation, and candidate check and commit
      - Unreadable comparison value is never treated as unchanged; ID check excludes unassigned or duplicate-ID documents and reports them (D-036)
      - Processed baseline is not advanced by ToC commit; an undeliverable report keeps the old baseline
      - Summary-generation AI receives only target content and output limit L; internal limit H, coefficients and margins are never passed to it
      - Impact notification enumerates changed documents and referrers mechanically; no fix-necessity judgement, rationale or fix proposal inside doc-link
      - Inspection Skills never write management state; check-impact is the exception that advances the baseline (D-038); check and ID assignment are not combined in one Skill
      - "Partial ID-assignment failure: issued DLIDs stay immutable, are reported as issued, are not rolled back, and are reused on rerun (NFR-003, NFR-006)"
      - Management state is stored in SQLite (sqlite3 standard library) with per-document locks; ID assignment and document info update run in one transaction per script run
      - Lock holder display uses the CLAUDE_SESSION_ID substitution variable (to be verified before implementation), falling back to build ID and process ID
    applicable_tasks:
      - Implementation of the script operation split and responsibility assignment for doc-link
      - Review of write permissions and prohibitions for each actor (caller AI, Skill, scripts, AI)
      - Design of Skill-script connection rules and state transition guards
      - Modification of failure handling for partially written DLIDs during ID assignment
      - Modification of the input boundary and internal limit isolation for the summary-generation AI
      - Review of which Skill may write management state (check versus ID assignment separation)
