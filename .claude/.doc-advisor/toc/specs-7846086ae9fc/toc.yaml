  docs/specs/design/DES-010-skill-composition.md:
    title: DES-010 Composition of SKILLs and Custom Agents
    purpose: Defines the eight SKILLs and two custom Agents of doc-link, their responsibilities and write boundaries, the detection and follow-up of check SKILLs, per-SKILL sequences, and data exchange with agents.
    content_details:
      - Composition table of eight SKILLs (embed-dlid, index-docs, query-docs, resolve-dlid, check-dlid, check-links, check-toc, check-impact) with kind, writes to managed Markdown and management state, and related requirements
      - Check SKILLs return detections without rewriting state; check-impact is the only exception and advances the processed baseline per (changed document, referrer) pair
      - toc-updater generates purpose, content_details, applicable_tasks and keywords per document under the length limit L only; query-worker reads a fixed ToC snapshot read-only and must not return IDs absent from it
      - check-toc detects new, removed, moved and content-changed documents; check-links detects broken references, path mismatch with current path, missing section and fragment mismatch with the current anchor
      - check-impact returns the check-toc result when ToC is stale, and otherwise lists changed documents with direct referrers only, with empty referrer arrays for unreferenced changes
      - embed-dlid asks the user only to confirm the original document when IDs are duplicated, and writes DLID only with a post-write diff check
      - Data exchange under .temp/doc-link/skill/ carries only script-generated identifiers, with source_unreadable as the toc-updater error value
      - Use case flow where check-toc or resolve-dlid detection leads to re-running index-docs or embed-dlid
