      - embed-dlid run transitions E-01 to E-07 including the duplicate DLID branch that waits for original confirmation
      - E-05 is the only transition that writes DLIDs into managed Markdown
      - check-impact run transitions N-01 to N-05 where only N-03 advances the processed comparison baseline
