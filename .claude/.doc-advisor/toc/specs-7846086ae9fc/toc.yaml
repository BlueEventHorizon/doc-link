  docs/specs/design/DES-001-system-overview.md:
    title: DES-001 System Overview Design
    purpose: Defines doc-link system boundary, its six operations with inputs, outputs and write boundaries, common invariants, and the normal index-docs and check-impact sequence.
    content_details:
      - Caller passes the complete desired-state target set; doc-link does not read Forge config files directly
      - DLID write positions limited to frontmatter doc_link_id, heading anchor line, and reference link title attribute (D-031)
      - DLID assignment is the only write operation on managed Markdown; ToC build and search never rewrite documents (D-035)
      - "Six operations: ID assignment, ToC build and rebuild, document search, reference check, change impact notification, consistency check"
      - "ToC build order: target confirmation, ID check, change detection, data acquisition, reference check, candidate check, commit"
      - Documents without ID or with duplicate ID are excluded and reported without stopping the build (D-036)
      - Unreadable reference target directory is recorded as absent and does not block ToC commit (D-025)
      - Six common invariants including ID independence from path, body and key, and no ToC update for keys not specified
      - Processed baseline for change reporting is not advanced at ToC commit but after the report
      - Search and impact notification are separate operations that run after ToC commit
