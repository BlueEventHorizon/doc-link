    title: "doc-link Requirements: References and Change Notification"
    purpose: Defines requirements for DLID-based references, reference link inspection, path-fix notification, section references, change-impact candidate notification, and integrity inspection.
    content_details:
      - "Formal reference notation: title of a reference link definition holds the content hash and DLID, and inline links are not formal references"
      - Reference target may be a document DLID or a section ID, with the content hash of the referenced document or section
      - Only the project management AI writes the content hash into the title; doc-link never writes it
      - "Link check by searching the specified reference directory: DLID in title, matching file, current path, relative path resolution, fragment resolving to anchor or heading"
      - Path mismatch notification with referencing DLID, path, problem location, old path, and confirmed current path, with no guessing from stored data
      - Section IDs on every heading, issued only by the DLID assignment operation, with section scope up to the next heading of same or higher level
      - Change-impact candidates by reverse lookup when current hash differs from title hash, with no indirect dependencies and no fix judgment
      - Stateless notification that repeats each report until the title hash is rewritten to the current hash
      - Integrity inspection categories including missing DLID, duplicate IDs, broken references, fragment mismatch, ToC and file mismatch, and not found in specified directory
      - "Confirmation before rewriting: the AI lists document, line, and value to the user and rewrites only approved items; check-links never rewrites"
    applicable_tasks:
      - Implementation of formal reference notation checks in check-links
      - Design review of reference path mismatch notification
      - Implementation of change-impact candidate listing in check-impact
      - Review of section reference and section ID rules
      - Verification of integrity inspection categories
      - Modification of the rewrite confirmation flow for the project management AI
    keywords:
      - formal reference
      - reference link definition
      - content hash
      - section ID
      - path mismatch
      - check-links
      - check-impact
      - change impact candidates
      - integrity inspection
      - fragment
