<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <title>文書を移動・改名したときの違い。パスで管理するとリンク切れになり、DLID で管理すると同じ文書として追跡できる</title>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">文書を移動・改名しても、同じ文書として追跡できる</text>

  <!-- 左: パスで管理 -->
  <rect x="24" y="64" width="416" height="288" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="232" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">従来：パスで管理</text>

  <rect x="48" y="130" width="110" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="103" y="159" text-anchor="middle" font-size="15" fill="#0f172a">設計書</text>

  <rect x="290" y="130" width="130" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="355" y="159" text-anchor="middle" font-size="15" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/b.md</text>

  <line x1="160" y1="154" x2="288" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="224" y="145" text-anchor="middle" font-size="12" fill="#475569">リンク（パス）</text>

  <line x1="355" y1="180" x2="355" y2="238" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="365" y="214" font-size="12" fill="#475569">移動・改名</text>

  <rect x="290" y="240" width="130" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="355" y="269" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/old/b.md</text>

  <path d="M103 180 L103 264 L288 264" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="114" y="254" font-size="14" font-weight="700" fill="#dc2626">✕ リンク切れ</text>

  <text x="232" y="326" text-anchor="middle" font-size="14" fill="#b91c1c">パスが変わると、索引も作り直しになる</text>

  <!-- 右: DLID で管理 -->
  <rect x="460" y="64" width="416" height="288" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="668" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">doc-link：DLID で管理</text>

  <rect x="488" y="130" width="110" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="543" y="159" text-anchor="middle" font-size="15" fill="#0f172a">設計書</text>

  <rect x="730" y="122" width="130" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="148" text-anchor="middle" font-size="15" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b.md</text>
  <text x="795" y="170" text-anchor="middle" font-size="13" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DLID-…</text>

  <line x1="600" y1="154" x2="728" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="664" y="145" text-anchor="middle" font-size="12" fill="#475569">title に DLID</text>

  <line x1="795" y1="188" x2="795" y2="238" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="805" y="218" font-size="12" fill="#475569">移動・改名</text>

  <rect x="730" y="240" width="130" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="795" y="266" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/old/b.md</text>
  <text x="795" y="288" text-anchor="middle" font-size="13" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DLID-…（同じ）</text>

  <path d="M543 180 L543 272 L728 272" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="554" y="262" font-size="14" font-weight="700" fill="#16a34a">✓ 同じ文書として追跡</text>

  <text x="668" y="334" text-anchor="middle" font-size="14" fill="#15803d">パスでなく、文書 ID でたどる</text>
</svg>
