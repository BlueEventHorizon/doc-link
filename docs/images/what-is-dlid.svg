<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <title>DLID とは。文書の frontmatter に文書 ID、見出し行の末尾にセクション ID として付ける、恒久的な識別子</title>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="388" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DLID とは：文書と見出しに付ける、恒久的な名札</text>

  <!-- 文書の例 -->
  <rect x="24" y="64" width="520" height="250" rx="12" fill="#0f172a"/>
  <text x="44" y="86" font-size="12" fill="#94a3b8">design.md</text>

  <rect x="24" y="114" width="520" height="30" fill="#78350f" fill-opacity="0.55"/>
  <rect x="24" y="192" width="520" height="30" fill="#78350f" fill-opacity="0.55"/>
  <rect x="24" y="244" width="520" height="30" fill="#78350f" fill-opacity="0.55"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="44" y="108" fill="#94a3b8">---</text>
    <text x="44" y="134" fill="#e2e8f0">doc_link_id: <tspan fill="#fbbf24" font-weight="700">DLID-7k3m9q2x4p8r</tspan></text>
    <text x="44" y="160" fill="#94a3b8">---</text>
    <text x="44" y="212" fill="#e2e8f0"># 設計方針 <tspan fill="#fbbf24" font-weight="700">DLID-3n8q2v5x7c9d</tspan></text>
    <text x="44" y="238" fill="#64748b">本文…</text>
    <text x="44" y="264" fill="#e2e8f0">## 手順 <tspan fill="#fbbf24" font-weight="700">DLID-9f4h6j1k8m0p</tspan></text>
    <text x="44" y="290" fill="#64748b">本文…</text>
  </g>

  <!-- 注釈 1: 文書 ID -->
  <rect x="588" y="103" width="288" height="52" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <text x="604" y="126" font-size="16" font-weight="700" fill="#b45309">文書 ID</text>
  <text x="604" y="145" font-size="13" fill="#475569">文書ひとつを表す（frontmatter）</text>
  <line x1="586" y1="129" x2="550" y2="129" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- 注釈 2: セクション ID -->
  <rect x="588" y="194" width="288" height="78" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <text x="604" y="219" font-size="16" font-weight="700" fill="#b45309">セクション ID</text>
  <text x="604" y="239" font-size="13" fill="#475569">見出しひとつを表す</text>
  <text x="604" y="258" font-size="13" fill="#475569">（すべての見出し行の末尾）</text>
  <line x1="586" y1="207" x2="550" y2="207" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="586" y1="259" x2="550" y2="259" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="24" y="332" width="852" height="38" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="450" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">DLID- ＋ 12 文字。パスやファイル名と無関係で、移動・改名しても変わらない</text>
</svg>
